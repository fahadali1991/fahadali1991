<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.8</title><style>html,body{margin:0;height:100%;background:#f5f7f8;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-7-stable-scroll.html"></iframe><script>(function(){'use strict';const base=document.getElementById('base');function deep(f){try{let d=f.contentDocument;if(!d)return null;let fs=[...d.querySelectorAll('iframe')];if(!fs.length)return f;for(let x of fs){let r=deep(x);if(r)return r}return f}catch(e){return null}}function clean(s){return String(s||'').trim()}function prependToSection(d,patterns,text){if(!text)return false;let secs=[...d.querySelectorAll('#sections .sec')];let sec=secs.find(s=>{let h=clean(s.querySelector('h4')?.textContent);return patterns.some(p=>h.includes(p))});if(!sec)return false;let ta=sec.querySelector('textarea');if(!ta)return false;let v=clean(ta.value);if(v.includes(text))return true;ta.value='• '+text+'\n'+v;ta.dispatchEvent(new Event('input',{bubbles:true}));return true}function showUsed(d,actual,impact){let old=d.getElementById('v68used');if(old)old.remove();if(!actual&&!impact)return;let box=d.createElement('div');box.id='v68used';box.innerHTML='<b>✅ استخدم المحرك معلوماتك في المحتوى</b>'+(actual?'<div><span>التنفيذ الفعلي:</span> '+actual+'</div>':'')+(impact?'<div><span>الأثر/النتيجة:</span> '+impact+'</div>':'');let gb=d.getElementById('genBox');if(gb)gb.insertBefore(box,gb.firstChild)}function linkContext(d){let actual=clean(d.getElementById('actualWork')?.value),impact=clean(d.getElementById('impactEvidence')?.value);if(actual){prependToSection(d,['التنفيذ','المناقشات','الأهداف والإجراءات','النتائج والفجوات','التنفيذ والتقويم','الأدوار والتنفيذ','التنفيذ والملاحظات'],actual)}if(impact){prependToSection(d,['قياس الأثر','الأثر','المتابعة','النتائج','مؤشرات النجاح','الإجراءات والمتابعة','التحسين','الأثر والاستدامة','الإجراءات التصحيحية'],impact)}showUsed(d,actual,impact)}function patch(){let f=deep(base);if(!f)return;try{let d=f.contentDocument;if(!d)return;if(!d.getElementById('v68style')){let s=d.createElement('style');s.id='v68style';s.textContent=`#v66context{margin:0 0 14px!important;border:1px solid #b9ddd3!important;background:linear-gradient(135deg,#f0faf7,#fff)!important;box-shadow:0 4px 14px rgba(21,68,90,.06)!important}#v66context h3{font-size:19px!important}#v66context:before{content:"يُستخدم ما تكتبه هنا مباشرة داخل التقرير — لا يُهمل";display:block;color:#078257;font-weight:800;font-size:12px;margin-bottom:8px}.v68genCard{order:2}#v68used{background:#edf8f4;border:1px solid #b9ddd3;border-radius:13px;padding:11px 13px;margin-bottom:12px;color:#15445A;font-size:13px;line-height:1.7}#v68used b{display:block;color:#078257;margin-bottom:5px}#v68used span{font-weight:800}#v68model{font-size:11px;color:#7a878d;text-align:center;padding:3px 0 8px}@media(max-width:600px){#v66context h3{font-size:18px!important}#v68used{font-size:12.5px}}`;d.head.appendChild(s)}let ctx=d.getElementById('v66context'),gen=d.getElementById('gen');if(ctx&&gen){let genCard=gen.closest('.f.full')||gen.parentElement;if(genCard&&ctx.nextElementSibling!==genCard){genCard.parentNode.insertBefore(ctx,genCard)}if(genCard)genCard.classList.add('v68genCard')}if(gen&&!gen.dataset.v68){gen.dataset.v68='1';gen.addEventListener('click',()=>{setTimeout(()=>linkContext(d),180)},false)}let form=d.getElementById('form');if(form&&!d.getElementById('v68model')){let m=d.createElement('div');m.id='v68model';m.className='full';m.textContent='نموذج الطباعة الحالي: رقم 1 — بسيط';let submit=form.querySelector('button[type="submit"]');let wrap=submit?.closest('.v67savewrap')||submit?.parentElement;if(wrap)wrap.parentNode.insertBefore(m,wrap)} }catch(e){console.error(e)}}base.addEventListener('load',()=>setTimeout(patch,1600));setInterval(patch,650)})();</script></body></html>
