<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e4b"><title>V9 Print Style A Lab</title><style>
*{box-sizing:border-box}html,body{margin:0}body{background:#eef3f1;color:#17343d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dbe5e2;padding:12px}.barIn{max-width:980px;margin:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.controls{display:flex;gap:7px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d6e2de;background:#fff;border-radius:11px;padding:9px 12px;font-weight:700}button.primary{background:#173e4b;color:#fff;border-color:#173e4b}.wrap{max-width:980px;margin:auto;padding:14px}.note{background:#fff8df;border:1px solid #eadca9;padding:10px 12px;border-radius:12px;margin-bottom:12px}.preview{overflow:auto;padding:8px}.sheet{--navy:#173e4b;--jade:#2a8f78;--aqua:#65b9b1;--mist:#eff7f5;width:210mm;min-height:295.5mm;margin:0 auto 18px;background:#fff;color:#17343d;padding:8.5mm 11mm 9mm;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 34px rgba(18,55,48,.12)}.ribbon{height:4.2mm;border-radius:0 0 4mm 4mm;margin:-8.5mm -11mm 5mm;background:linear-gradient(90deg,var(--navy) 0 23%,#286b78 23% 49%,var(--aqua) 49% 72%,var(--jade) 72%)}.mast{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:5mm;padding-bottom:3.4mm;border-bottom:.35mm solid #d8e4e1}.ministry{font-size:10.5pt;font-weight:800;color:var(--navy);line-height:1.35}.ministry small{display:block;font-size:7.7pt;font-weight:500;color:#768581}.school{text-align:center}.school b{font-size:15.8pt;color:var(--navy);display:block;line-height:1.2}.school small{font-size:8.5pt;color:#75837f}.doc{text-align:left}.doc b{display:block;font-size:9.2pt;color:var(--navy)}.doc small{font-size:7.5pt;color:#7b8885}.hero{text-align:center;padding:3.2mm 0 2.4mm}.pill{display:inline-block;background:var(--mist);color:#247461;border:.25mm solid #cde6df;border-radius:999px;padding:1mm 3.7mm;font-size:8.2pt;font-weight:800}.hero h1{font-size:21.5pt;line-height:1.16;margin:1.7mm 0 0;color:#123744;font-weight:900}.meta{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);border:.3mm solid #d8e4e1;border-radius:3mm;overflow:hidden;background:#fbfdfc;margin-bottom:2.6mm}.mc{padding:1.9mm 2.8mm;min-height:11.8mm;border-left:.25mm solid #e4ece9;display:flex;flex-direction:column;justify-content:center}.mc:last-child{border-left:0}.mc small{font-size:7.3pt;color:#6f7f7b;font-weight:700;margin-bottom:.5mm}.mc b{font-size:10pt;color:#153d49;line-height:1.25}.body{display:grid;gap:1.25mm}.sec{break-inside:avoid}.sec h3{font-size:12pt;color:var(--navy);margin:0 0 .7mm;padding-right:3mm;position:relative;line-height:1.25}.sec h3:before{content:'';position:absolute;right:0;top:.55mm;width:1.25mm;height:4mm;border-radius:1mm;background:var(--jade)}.sec div{font-size:10.85pt;line-height:1.48;color:#2d4147;white-space:pre-line;padding-right:3mm}.ev{margin-top:1.7mm;break-inside:avoid}.evh{display:flex;align-items:center;gap:2mm;margin-bottom:1.35mm}.evh span{width:7mm;height:.9mm;border-radius:1mm;background:linear-gradient(90deg,var(--jade),var(--aqua))}.evh h3{font-size:12pt;color:var(--navy);margin:0}.photos{display:grid;gap:2.1mm}.photos.four,.photos.two{grid-template-columns:1fr 1fr}.photos.three{grid-template-columns:1fr 1fr}.photos.three .pic:nth-child(3){grid-column:1/-1;width:49.3%;justify-self:center}.photos.one{grid-template-columns:1fr}.pic{border:.3mm solid #dbe6e3;border-radius:3mm;padding:1.3mm;background:#fff;display:flex;flex-direction:column;overflow:hidden;break-inside:avoid}.four .pic{height:47.5mm}.four .stage{height:46mm}.three .pic{height:49mm}.three .stage{height:47.5mm}.two .pic{height:63mm}.two .stage{height:61.5mm}.one .pic{height:80mm}.one .stage{height:78.5mm}.stage{background:#f6f9f8;border-radius:2.1mm;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain;display:block}.pic figcaption{height:3.4mm;line-height:3.4mm;text-align:center;font-size:7.6pt;color:#71807c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pic.noCap{padding-bottom:1.3mm}.pic.noCap .stage{height:100%!important}.signWrap{margin-top:auto}.signs{display:grid;grid-template-columns:1fr 1fr;gap:18mm;border-top:.3mm solid #dce6e3;padding-top:2.1mm;margin-top:2.2mm}.sig{text-align:center;min-height:12.5mm}.sig small{font-size:7.8pt;color:#6f7e7a;font-weight:700}.sig b{display:block;font-size:9.5pt;color:#193e49;margin-top:.7mm}.line{width:54%;border-bottom:.3mm dotted #9aaba6;margin:3.8mm auto 0}.foot{display:flex;justify-content:space-between;align-items:center;border-top:.25mm solid #edf2f0;margin-top:1.6mm;padding-top:1.3mm;color:#84918e;font-size:7.1pt}.foot b{color:#526a65}.appendix .title{text-align:center;margin:2mm 0 4mm}.appendix .title h2{font-size:18pt;color:var(--navy);margin:0}.appendix .title p{font-size:8.5pt;color:#768581;margin:1mm 0}.appendix .photos{grid-template-columns:1fr 1fr;gap:3mm}.appendix .pic{height:66mm}.appendix .stage{height:64.5mm}.appendix .photos.three .pic:nth-child(3){grid-column:1/-1;width:49.3%;justify-self:center}.empty{padding:40px;text-align:center;color:#6d7b77}@media(max-width:760px){.preview{padding:0}.sheet{box-shadow:none;margin-bottom:8px}}@media print{@page{size:A4;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}.bar,.note{display:none!important}.wrap,.preview{max-width:none!important;margin:0!important;padding:0!important;overflow:visible!important}.sheet{width:210mm!important;min-height:0!important;height:295.5mm!important;margin:0!important;padding:8.5mm 11mm 9mm!important;box-shadow:none!important;overflow:hidden!important;break-after:auto!important;page-break-after:auto!important}.sheet+.sheet{break-before:page!important;page-break-before:always!important}.pic,.ev,.sec,.signs{break-inside:avoid!important;page-break-inside:avoid!important}}
</style></head><body><div class="bar"><div class="barIn"><div><b>مختبر المطبوع V9 — هوية أصلية</b><div style="font-size:12px;color:#6d7b77">V9 Print Style A.2 — الضبط النهائي</div></div><div class="controls"><select id="records"></select><button onclick="loadSelected()">عرض</button><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button></div></div></div><main class="wrap"><div class="note"><b>نسخة اختبار للمطبوع فقط.</b> 4 صور أو أقل = صفحة واحدة كاملة. الصور الزائدة = ملحق فقط، دون صفحات فارغة.</div><div id="preview" class="preview"><div class="empty">جاري قراءة سجلات V9…</div></div></main><script>
const DB='schoolEngineV9Core',STORE='works';let db,works=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function settings(){try{return Object.assign({school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',principal:'',user:'',year:'1447-1448هـ'},JSON.parse(localStorage.getItem('schoolEngineV9Settings')||'{}'))}catch(e){return{school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',year:'1447-1448هـ'}}}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function typeLabel(t){return({program:'برنامج / فعالية',meeting:'اجتماع',training:'تطوير مهني',lesson:'ممارسة تعليمية',analysis:'تحليل نتائج',partnership:'شراكة / أسرة',safety:'أمن وسلامة',plan:'خطة / متابعة'})[t]||'توثيق مدرسي'}
function evidenceFiles(w){return (w.files||w.evidenceFiles||w.attachments||[]).filter(Boolean)}function images(w){return evidenceFiles(w).filter(f=>(f.type||'').startsWith('image/'))}function otherFiles(w){return evidenceFiles(w).filter(f=>!(f.type||'').startsWith('image/'))}
function fileURL(f){try{return URL.createObjectURL(f)}catch(e){return''}}
function sectionData(w){let a=w.generated||w.sections||[];if(Array.isArray(a)&&a.length)return a.map(x=>Array.isArray(x)?{title:x[0],body:x[1]}:{title:x.title||'',body:x.body||''}).filter(x=>x.body);return [{title:'التنفيذ',body:w.rawDescription||w.whatDone||w.desc||''}].filter(x=>x.body)}
function shortBody(s,max=420){s=String(s||'').trim();return s.length>max?s.slice(0,max).replace(/\s+\S*$/,'')+'…':s}
function caption(w,i,extra=false){let custom=(w.imageCaptions||[])[i];if(custom)return custom;let lbl=typeLabel(w.type);if(extra)return 'جانب إضافي من التوثيق';if(/تطوير مهني/.test(lbl))return 'جانب من تنفيذ التطوير المهني';if(/برنامج/.test(lbl))return 'جانب من تنفيذ البرنامج';if(/اجتماع/.test(lbl))return 'جانب من الاجتماع';if(/ممارسة/.test(lbl))return 'شاهد من الممارسة التعليمية';return 'جانب من التوثيق';}
function metaItems(w){let scope=[w.stage,(w.grades||[]).join('، ')].filter(Boolean).join(' - ');return [['التاريخ',w.date],['الفئة',w.audience||w.beneficiaryGroup||w.beneficiary], [scope&&w.grades&&w.grades.length?'المرحلة / الصفوف':'المرحلة',scope],['المنفذ',w.owner]].filter(x=>x[1])}
function head(s,left='التوثيق المدرسي الذكي'){return `<div class="ribbon"></div><header class="mast"><div class="ministry">وزارة التعليم<small>المملكة العربية السعودية</small></div><div class="school"><b>${esc(s.school)}</b><small>${esc(s.office||'')}</small></div><div class="doc"><b>${esc(left)}</b><small>${esc(s.year||'')}</small></div></header>`}
function photosHTML(w,list,startIndex=0,extra=false){if(!list.length)return'';let cls=list.length===1?'one':list.length===2?'two':list.length===3?'three':'four';return `<div class="photos ${cls}">${list.map((f,j)=>{let u=fileURL(f),cap=(w.imageCaptions||[])[startIndex+j]||'';return `<figure class="pic ${cap?'':'noCap'}"><div class="stage"><img src="${u}" onload="setTimeout(()=>URL.revokeObjectURL('${u}'),60000)"></div>${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`}).join('')}</div>`}
function mainSheet(w){let s=settings(),imgs=images(w).slice(0,4),secs=sectionData(w).slice(0,4),meta=metaItems(w),id=String(w.id||'').slice(-8).toUpperCase()||'—';let body=secs.map(x=>`<section class="sec"><h3>${esc(x.title)}</h3><div>${esc(shortBody(x.body))}</div></section>`).join('');return `<section class="sheet main">${head(s)}<div class="hero"><span class="pill">${esc(typeLabel(w.type))}</span><h1>${esc(w.title||'توثيق مدرسي')}</h1></div><div class="meta" style="--cols:${Math.max(1,meta.length)}">${meta.map(x=>`<div class="mc"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('')}</div><div class="body">${body}</div>${imgs.length?`<section class="ev"><div class="evh"><span></span><h3>الشواهد المصورة</h3></div>${photosHTML(w,imgs,0,false)}</section>`:''}<div class="signWrap"><div class="signs"><div class="sig"><small>إعداد الوثيقة</small><b>${esc(w.owner||s.user||'........................')}</b><div class="line"></div></div><div class="sig"><small>اعتماد مدير المدرسة</small><b>${esc(s.principal||'........................')}</b><div class="line"></div></div></div><footer class="foot"><span><b>${esc(s.school)}</b> · وثيقة توثيق مدرسية</span><span>رقم الوثيقة: ${esc(id)}</span></footer></div></section>`}
function appendixSheet(w){let extra=images(w).slice(4);if(!extra.length)return'';let s=settings(),id=String(w.id||'').slice(-8).toUpperCase()||'—';return `<section class="sheet appendix">${head(s,'ملحق الشواهد')}<div class="title"><h2>ملحق الشواهد المصورة</h2><p>${esc(w.title||'توثيق مدرسي')} · الشواهد الإضافية</p></div>${photosHTML(w,extra,4,true)}<div class="signWrap"><footer class="foot"><span><b>${esc(s.school)}</b> · ملحق الشواهد</span><span>رقم الوثيقة: ${esc(id)}</span></footer></div></section>`}
function render(w){$('preview').innerHTML=mainSheet(w)+appendixSheet(w)}function loadSelected(){let w=works.find(x=>String(x.id)===$('records').value)||works[0];if(w)render(w)}
openDB().then(all).then(a=>{works=a.sort((x,y)=>(y.updatedAt||y.createdAt||'').localeCompare(x.updatedAt||x.createdAt||''));if(!works.length){$('preview').innerHTML='<div class="empty">لا توجد سجلات V9 على هذا الجهاز.</div>';return}$('records').innerHTML=works.map(w=>`<option value="${esc(w.id)}">${esc(w.title||'بدون عنوان')}</option>`).join('');render(works[0])}).catch(e=>{$('preview').innerHTML='<div class="empty">تعذر قراءة سجلات V9: '+esc(e.message||e)+'</div>'});
</script></body></html>
