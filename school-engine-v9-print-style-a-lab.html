<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e4b"><title>V9 Print Style A Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f1;color:#17343d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dbe5e2;padding:12px}.barIn{max-width:980px;margin:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar b{font-size:17px}.controls{display:flex;gap:7px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d6e2de;background:#fff;border-radius:11px;padding:9px 12px;font-weight:700}button.primary{background:#173e4b;color:#fff;border-color:#173e4b}.wrap{max-width:980px;margin:auto;padding:14px}.note{background:#fff8df;border:1px solid #eadca9;padding:10px 12px;border-radius:12px;margin-bottom:12px}.preview{overflow:auto;padding:8px}.sheet{--navy:#173e4b;--jade:#2a8f78;--aqua:#65b9b1;--mist:#eff7f5;width:210mm;height:297mm;margin:0 auto 18px;background:#fff;color:#17343d;padding:9mm 11mm 7mm;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 34px rgba(18,55,48,.12)}.ribbon{height:4.2mm;border-radius:0 0 4mm 4mm;margin:-9mm -11mm 5.5mm;background:linear-gradient(90deg,var(--navy) 0 23%,#286b78 23% 49%,var(--aqua) 49% 72%,var(--jade) 72%)}.mast{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:center;gap:5mm;padding-bottom:3.8mm;border-bottom:.35mm solid #d8e4e1}.ministry{font-size:10.5pt;font-weight:800;color:var(--navy);line-height:1.45}.ministry small{display:block;font-size:7.8pt;font-weight:500;color:#768581}.school{text-align:center}.school b{font-size:15.8pt;color:var(--navy);display:block;line-height:1.25}.school small{font-size:8.6pt;color:#75837f}.doc{text-align:left}.doc b{display:block;font-size:9.7pt;color:var(--navy)}.doc small{font-size:7.8pt;color:#7b8885}.hero{text-align:center;padding:4mm 0 2.8mm}.pill{display:inline-block;background:var(--mist);color:#247461;border:.25mm solid #cde6df;border-radius:999px;padding:1.2mm 4mm;font-size:8.5pt;font-weight:800}.hero h1{font-size:21pt;line-height:1.22;margin:2mm 0 0;color:#123744;font-weight:900}.meta{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);border:.3mm solid #d8e4e1;border-radius:3.1mm;overflow:hidden;background:#fbfdfc;margin-bottom:3mm}.mc{padding:2.2mm 3mm;min-height:13mm;border-left:.25mm solid #e4ece9;display:flex;flex-direction:column;justify-content:center}.mc:last-child{border-left:0}.mc small{font-size:7.5pt;color:#6f7f7b;font-weight:700;margin-bottom:.6mm}.mc b{font-size:10pt;color:#153d49;line-height:1.3}.body{display:grid;gap:2mm}.sec{break-inside:avoid}.sec h3{font-size:11.5pt;color:var(--navy);margin:0 0 .9mm;padding-right:3mm;position:relative;line-height:1.3}.sec h3:before{content:'';position:absolute;right:0;top:.7mm;width:1.3mm;height:4mm;border-radius:1mm;background:var(--jade)}.sec div{font-size:9.5pt;line-height:1.48;color:#2d4147;white-space:pre-line;padding-right:3mm}.ev{margin-top:2mm;break-inside:avoid}.evh{display:flex;align-items:center;gap:2mm;margin-bottom:1.5mm}.evh span{width:7mm;height:.9mm;border-radius:1mm;background:linear-gradient(90deg,var(--jade),var(--aqua))}.evh h3{font-size:11.5pt;color:var(--navy);margin:0}.photos{display:grid;grid-template-columns:1fr 1fr;gap:2.1mm}.pic{height:43mm;border:.3mm solid #dbe6e3;border-radius:3mm;padding:1.4mm;background:#fff;display:flex;flex-direction:column;overflow:hidden;break-inside:avoid}.stage{height:36.5mm;background:#f6f9f8;border-radius:2.1mm;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain;display:block}.pic figcaption{height:4mm;line-height:4mm;text-align:center;font-size:7.2pt;color:#71807c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.one .pic{height:70mm}.one .stage{height:63.5mm}.two .pic{height:55mm}.two .stage{height:48.5mm}.three .pic{height:44mm}.signWrap{margin-top:auto}.signs{display:grid;grid-template-columns:1fr 1fr;gap:18mm;border-top:.3mm solid #dce6e3;padding-top:2.5mm;margin-top:2.8mm}.sig{text-align:center;min-height:14mm}.sig small{font-size:7.8pt;color:#6f7e7a;font-weight:700}.sig b{display:block;font-size:9.5pt;color:#193e49;margin-top:.8mm}.line{width:64%;border-bottom:.3mm dotted #9aaba6;margin:4.7mm auto 0}.foot{display:flex;justify-content:space-between;align-items:center;border-top:.25mm solid #edf2f0;margin-top:2mm;padding-top:1.5mm;color:#84918e;font-size:7.2pt}.foot b{color:#526a65}.att{font-size:8pt;color:#566965;margin-top:1.2mm}.att span{display:inline-block;border:.25mm solid #dbe5e2;border-radius:999px;padding:.8mm 2mm;margin:0 .5mm .7mm;background:#fafcfb}.appendix{page-break-before:always;break-before:page}.appendix .title{text-align:center;margin:2mm 0 5mm}.appendix .title h2{font-size:18pt;color:var(--navy);margin:0}.appendix .title p{font-size:8.5pt;color:#768581;margin:1mm 0}.appendix .pic{height:58mm}.appendix .stage{height:51.5mm}.empty{padding:40px;text-align:center;color:#6d7b77}@media(max-width:760px){.preview{padding:0}.sheet{box-shadow:none;margin-bottom:8px}}@media print{@page{size:A4;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}.bar,.note{display:none!important}.wrap,.preview{max-width:none!important;margin:0!important;padding:0!important;overflow:visible!important}.sheet{width:210mm!important;height:297mm!important;margin:0!important;padding:9mm 11mm 7mm!important;box-shadow:none!important;page-break-after:always!important;break-after:page!important}.sheet:last-child{page-break-after:auto!important;break-after:auto!important}.pic,.ev,.sec,.signs{break-inside:avoid!important;page-break-inside:avoid!important}}
</style></head><body><div class="bar"><div class="barIn"><div><b>مختبر المطبوع V9 — هوية أصلية</b><div style="font-size:12px;color:#6d7b77">يقرأ نفس سجلات V9 الحالية</div></div><div class="controls"><select id="records"></select><button onclick="loadSelected()">عرض</button><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button></div></div></div><main class="wrap"><div class="note"><b>نسخة اختبار للمطبوع فقط.</b> إذا كان السجل يحتوي 4 صور أو أقل، يجب أن يكون التقرير كاملًا في صفحة واحدة مع التوقيع والتذييل. الصور الزائدة تنتقل لملحق مستقل.</div><div id="preview" class="preview"><div class="empty">جاري قراءة سجلات V9…</div></div></main><script>
const DB='schoolEngineV9',STORE='works',SET='schoolEngineV9Settings';let works=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function settings(){try{return Object.assign({school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',principal:'',user:'',year:'1447–1448هـ'},JSON.parse(localStorage.getItem(SET)||'{}'))}catch(e){return{school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',principal:'',user:'',year:'1447–1448هـ'}}}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function readAll(db){return new Promise((res,rej)=>{if(!db.objectStoreNames.contains(STORE))return res([]);let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function fileData(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)})}function compact(sections){const banned=/المستخدم|النظام|المحرك|الإدخال|لم يحدد|لا يفترض/i;let out=[];for(let s of sections||[]){let title=String(s?.[0]||'').trim(),lines=String(s?.[1]||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).filter(x=>!banned.test(x));if(!lines.length)continue;let text=lines.slice(0,3).join('\n');if(text.length>380)text=text.slice(0,377).replace(/\s+\S*$/,'')+'…';out.push([title,text]);if(out.length===3)break}return out}function caption(name){let x=String(name||'').replace(/\.[^.]+$/,'').trim();if(!x||/^(img|image|photo|dsc|screenshot|whatsapp)/i.test(x))return'جانب من التوثيق';return x.length>38?x.slice(0,35)+'…':x}function kind(w){let M={program:'برنامج / فعالية',meeting:'اجتماع / ورشة',training:'تطوير مهني',lesson:'ممارسة تعليمية',analysis:'تحليل نتائج',partnership:'شراكة / أسرة',safety:'أمن وسلامة',plan:'خطة / متابعة'};return M[w.type]||'توثيق مدرسي'}async function build(w){let s=settings(),photos=[];for(let f of(w.files||[])){if(f.type&&f.type.startsWith('image/')){let src=await fileData(f);if(src)photos.push({src,name:f.name})}}let first=photos.slice(0,4),extra=photos.slice(4),others=(w.files||[]).filter(f=>!(f.type||'').startsWith('image/')),scope=[w.stage,...(w.grades||[])].filter(Boolean),meta=[['التاريخ',w.date||''],['الفئة',w.audience||''],[(w.grades||[]).length?'المرحلة / الصفوف':'المرحلة',scope.join(' - ')],['المنفذ',w.owner||s.user||'']].filter(x=>x[1]),cols=Math.min(4,Math.max(2,meta.length));let metaHtml=`<div class="meta" style="--cols:${cols}">${meta.map(x=>`<div class="mc"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('')}</div>`;let secs=compact(w.generated||[]).map(x=>`<section class="sec"><h3>${esc(x[0])}</h3><div>${esc(x[1])}</div></section>`).join('');let pc=first.length===1?'one':first.length===2?'two':first.length===3?'three':'';let ev=first.length?`<section class="ev ${pc}"><div class="evh"><span></span><h3>الشواهد المصورة</h3></div><div class="photos">${first.map(p=>`<figure class="pic"><div class="stage"><img src="${p.src}"></div><figcaption>${esc(caption(p.name))}</figcaption></figure>`).join('')}</div></section>`:'';let att=others.length?`<div class="att"><b>المرفقات:</b> ${others.map(f=>`<span>📎 ${esc(f.name)}</span>`).join('')}</div>`:'';let main=`<section class="sheet"><div class="ribbon"></div><header class="mast"><div class="ministry">وزارة التعليم<small>المملكة العربية السعودية</small></div><div class="school"><b>${esc(s.school)}</b><small>${esc(s.office)}</small></div><div class="doc"><b>التوثيق المدرسي الذكي</b><small>${esc(s.year)} · ${esc(String(w.id||'').slice(0,8).toUpperCase())}</small></div></header><div class="hero"><span class="pill">${esc(kind(w))}</span><h1>${esc(w.title||'توثيق مدرسي')}</h1></div>${metaHtml}<div class="body">${secs}</div>${ev}${att}<div class="signWrap"><div class="signs"><div class="sig"><small>إعداد الوثيقة</small><b>${esc(w.owner||s.user||'........................')}</b><div class="line"></div></div><div class="sig"><small>اعتماد مدير المدرسة</small><b>${esc(s.principal||'........................')}</b><div class="line"></div></div></div><footer class="foot"><span><b>${esc(s.school)}</b> · وثيقة توثيق مدرسية</span><span>رقم التوثيق: ${esc(String(w.id||'').slice(0,8).toUpperCase())}</span></footer></div></section>`;let appendix='';if(extra.length){appendix=`<section class="sheet appendix"><div class="ribbon"></div><header class="mast"><div class="ministry">وزارة التعليم<small>المملكة العربية السعودية</small></div><div class="school"><b>${esc(s.school)}</b><small>${esc(s.office)}</small></div><div class="doc"><b>ملحق الشواهد</b><small>${esc(s.year)}</small></div></header><div class="title"><h2>ملحق الشواهد المصورة</h2><p>${esc(w.title||'')} · الشواهد الإضافية</p></div><div class="photos">${extra.map(p=>`<figure class="pic"><div class="stage"><img src="${p.src}"></div><figcaption>${esc(caption(p.name))}</figcaption></figure>`).join('')}</div><div class="signWrap"><footer class="foot"><span><b>${esc(s.school)}</b> · ملحق الشواهد</span><span>رقم التوثيق: ${esc(String(w.id||'').slice(0,8).toUpperCase())}</span></footer></div></section>`}return main+appendix}async function loadSelected(){let id=$('records').value,w=works.find(x=>x.id===id);if(!w)return;$('preview').innerHTML='<div class="empty">جاري تجهيز المطبوع…</div>';$('preview').innerHTML=await build(w)}openDB().then(readAll).then(a=>{works=a.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));$('records').innerHTML=works.length?works.map(w=>`<option value="${esc(w.id)}">${esc(w.title||'بدون عنوان')}</option>`).join(''):'<option>لا توجد سجلات</option>';if(works.length)loadSelected();else $('preview').innerHTML='<div class="empty">لا توجد سجلات في V9 على هذا الجهاز/المتصفح.</div>'}).catch(e=>$('preview').innerHTML='<div class="empty">تعذر قراءة قاعدة V9: '+esc(e.message||e)+'</div>');
</script></body></html>
