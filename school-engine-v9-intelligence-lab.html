<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145e52"><title>V9 Intelligence Lab</title><style>:root{--a:#145e52;--s:#eaf5f1;--l:#dce6e2;--m:#687570}*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17211f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:19px;padding:18px;margin:14px 0;box-shadow:0 9px 28px rgba(18,74,63,.06)}h1,h2,h3{margin-top:0}.muted{color:var(--m)}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid #d5dfdc;border-radius:13px;padding:12px;background:#fff}textarea{min-height:125px;line-height:1.8}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--a);color:#fff;border-color:var(--a)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px}.chip.on{background:var(--s);color:var(--a);border-color:#9fc9be;font-weight:800}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--s);color:var(--a);font-size:12px;margin:2px}.tag.gray{background:#f0f2f2;color:#5f6967}.item{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}.sec{border-right:4px solid var(--a);padding-right:12px;margin:15px 0}.sec p{white-space:pre-line;line-height:1.85;margin-bottom:0}.good{background:#f4fbf8;border:1px solid #cfe8df;padding:12px;border-radius:13px}.warn{background:#fff8e7;border:1px solid #ecdca8;padding:12px;border-radius:13px}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="card"><div class="muted">V9 Intelligence Lab — مختبر الفهم والنص والمؤشرات</div><h1>ماذا فعلت؟</h1><p class="muted">اكتب كما تتحدث. لا تكتب تقريرًا ولا تبحث عن رقم مؤشر.</p><textarea id="raw" placeholder="مثال: نفذنا مجتمع مهني لمعلمي اللغة العربية عن تحسين الخط للطلاب وخرجنا بنموذج تدريبي وسيتم تطبيقه في الحصص"></textarea><div class="grid" style="margin-top:10px"><div><label>المرحلة</label><select id="stage"><option value="">تلقائي</option><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></div><div><label>الفئة</label><input id="aud" placeholder="تلقائي"></div></div><div style="margin-top:12px"><button class="btn primary" onclick="analyze()">افهم العمل وابنِ التوثيق</button></div></div><div id="result"></div></main><script>
const $=x=>document.getElementById(x),norm=s=>String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,''),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const IND=[['1-1-1-1','الإدارة المدرسية','الخطة التشغيلية','تنفيذ'],['1-1-1-2','الإدارة المدرسية','متابعة الخطة التشغيلية','متابعة'],['1-2-1-1','الإدارة المدرسية','القيم الإسلامية والهوية الوطنية','تنفيذ'],['1-2-1-3','الإدارة المدرسية','إجراءات دعم الانضباط المدرسي','تنفيذ'],['1-2-1-4','الإدارة المدرسية','برامج السلوك الإيجابي','تنفيذ'],['1-2-1-5','الإدارة المدرسية','البرامج والأنشطة الإثرائية','تنفيذ'],['1-3-1-2','الإدارة المدرسية','مشاركة الأسرة في تعلم الأبناء','تنفيذ'],['1-3-1-3','الإدارة المدرسية','الشراكة المجتمعية','تنفيذ'],['1-4-1-4','الإدارة المدرسية','دعم الرخصة المهنية','متابعة'],['1-4-1-5','الإدارة المدرسية','التطوير المهني وفق الاحتياج','تنفيذ'],['1-4-1-6','الإدارة المدرسية','التقويم الذاتي','متابعة'],['1-4-1-7','الإدارة المدرسية','خطة التحسين','متابعة'],['2-1-1-3','التعليم والتعلم','تنويع استراتيجيات التعليم والتعلم','تنفيذ'],['2-1-1-4','التعليم والتعلم','تفعيل التقنية الرقمية','تنفيذ'],['2-1-1-5','التعليم والتعلم','أنشطة تعلم تطبيقية','تنفيذ'],['2-1-1-6','التعليم والتعلم','تنمية المهارات القرائية والعددية','أثر'],['2-1-1-7','التعليم والتعلم','مهارات التفكير والبحث والابتكار','أثر'],['2-2-1-1','التعليم والتعلم','أساليب وأدوات تقويم متنوعة','تنفيذ'],['2-2-1-3','التعليم والتعلم','تحليل نتائج التقويم وتوظيفها','أثر'],['2-2-1-4','التعليم والتعلم','التغذية الراجعة ومتابعة التقدم','متابعة'],['3-1-1-1','نواتج التعلم','نتائج القراءة في الاختبارات الوطنية','أثر'],['3-1-1-2','نواتج التعلم','نتائج الرياضيات في الاختبارات الوطنية','أثر'],['3-1-1-3','نواتج التعلم','نتائج العلوم في الاختبارات الوطنية','أثر'],['3-2-1-4','نواتج التعلم','المشاركة المجتمعية والتطوع','أثر'],['3-2-1-5','نواتج التعلم','السلوك والانضباط','أثر'],['4-2-1-1','البيئة المدرسية','الأمن والسلامة','تنفيذ'],['4-2-1-2','البيئة المدرسية','متابعة الصيانة','متابعة'],['4-2-1-3','البيئة المدرسية','متابعة النظافة','متابعة']];
const RULES=[{k:['انضباط','غياب','تأخر','مواظبة','بصمة'],c:['1-2-1-3'],impact:['3-2-1-5'],r:'الإجراء يرتبط مباشرة بدعم الانضباط والمتابعة'},{k:['سلوك إيجابي','تعزيز السلوك'],c:['1-2-1-4'],impact:['3-2-1-5'],r:'نشاط داعم للسلوك الإيجابي'},{k:['قيم','هوية وطنية'],c:['1-2-1-1'],r:'العمل مرتبط بالقيم والهوية الوطنية'},{k:['موهوب','موهبة','إثرائي','ابتكار'],c:['1-2-1-5','2-1-1-7'],r:'عمل إثرائي أو داعم للموهبة والابتكار'},{k:['أسرة','ولي الأمر','أولياء'],c:['1-3-1-2'],r:'مشاركة للأسرة في تعلم الأبناء'},{k:['شراكة','مجتمع','تطوع'],c:['1-3-1-3'],impact:['3-2-1-4'],r:'شراكة أو مشاركة مجتمعية'},{k:['تدريب','تطوير مهني','ورشة','مجتمع مهني','مجتمع تعلم'],c:['1-4-1-5'],r:'نشاط تطوير مهني لمنسوبي المدرسة'},{k:['تقويم ذاتي'],c:['1-4-1-6'],r:'عمل مرتبط بعملية التقويم الذاتي'},{k:['خطة تحسين'],c:['1-4-1-7'],r:'عمل مرتبط بخطة التحسين'},{k:['استراتيجية','تعلم تعاوني','تدريس'],c:['2-1-1-3'],r:'تنويع استراتيجيات التعليم والتعلم'},{k:['تقنية','رقمي','منصة','ذكاء اصطناعي'],c:['2-1-1-4'],r:'توظيف التقنية الرقمية'},{k:['تطبيقي','مشروع','مهمة أدائية'],c:['2-1-1-5'],r:'نشاط تعلم تطبيقي'},{k:['قراءة','قرائي','خط','إملاء','عددية'],c:['2-1-1-6'],r:'تنمية مهارة قرائية أو عددية أساسية'},{k:['اختبار','تقويم','روبرك'],c:['2-2-1-1'],r:'استخدام أداة أو أسلوب تقويم'},{k:['تحليل نتائج','نتائج الطلاب','علاجي','إثرائي'],c:['2-2-1-3'],r:'تحليل نتائج وتوظيفها في التحسين'},{k:['تغذية راجعة','تقدم الطلاب'],c:['2-2-1-4'],r:'متابعة تقدم المتعلمين'},{k:['نافس','اختبار وطني'],c:['3-1-1-1','3-1-1-2','3-1-1-3'],r:'بيانات مرتبطة بالاختبارات الوطنية'},{k:['سلامة','إخلاء','حريق','طوارئ'],c:['4-2-1-1'],r:'إجراء للأمن والسلامة'},{k:['صيانة','تكييف','إضاءة'],c:['4-2-1-2'],r:'متابعة صيانة مبنى أو تجهيزات'},{k:['نظافة'],c:['4-2-1-3'],r:'متابعة نظافة المرافق'},{k:['خطة تشغيلية','تشغيلية'],c:['1-1-1-1','1-1-1-2'],r:'إعداد أو متابعة الخطة التشغيلية'}];
function detectType(t){let n=norm(t);if(/اجتماع|محضر|لجنة/.test(n))return'meeting';if(/تدريب|تطوير مهني|ورشة|مجتمع مهني|مجتمع تعلم/.test(n))return'training';if(/درس|حصة|تدريس|استراتيجية/.test(n))return'lesson';if(/تحليل|نتائج|اختبار/.test(n))return'analysis';if(/شراكة|أولياء|أسرة/.test(n))return'partnership';if(/سلامة|صيانة|إخلاء|نظافة/.test(n))return'safety';if(/خطة|تشغيلية|تحسين/.test(n))return'plan';return'program'}
function detectStage(t){let n=norm(t);if(/ابتدائي/.test(n))return'ابتدائي';if(/متوسط/.test(n))return'متوسط';if(/ثانوي/.test(n))return'ثانوي';return $('stage').value}
function detectAudience(t){let n=norm(t);if(/معلم|معلمات/.test(n))return'المعلمون';if(/طالب|طلاب/.test(n))return'الطلاب';if(/ولي الأمر|أولياء|أسرة/.test(n))return'أولياء الأمور';return $('aud').value.trim()}
function typeLabel(t){return({program:'برنامج / فعالية',meeting:'اجتماع',training:'تطوير مهني',lesson:'ممارسة تعليمية',analysis:'تحليل نتائج',partnership:'شراكة / أسرة',safety:'أمن وسلامة',plan:'خطة / متابعة'})[t]}
function impact(t){return /انخفض|ارتفع|تحسن|زيادة|نسبة|مقارنة|قبل وبعد|نتيجة|نتائج|تقدم|أثر/.test(norm(t))}
function titleOf(t,type){let s=String(t).trim().replace(/^(تم|قمنا|نفذنا|نُفذ|عقدنا)\s+/,'').replace(/[.،].*$/,'');return s.length<=58?s:typeLabel(type)+' — '+s.slice(0,35)}
function generate(raw,type,title,aud,stage){let n=norm(raw),secs=[];if(type==='training'){secs=[['الاحتياج المهني',`نُفذ «${title}» لدعم تطوير الممارسة المهنية وتبادل الخبرات المرتبطة باحتياج فعلي لدى ${aud||'المستفيدين'}.`],['التنفيذ',`${raw}\nورُكز أثناء التنفيذ على التطبيق العملي وتبادل الممارسات القابلة للتوظيف في العمل المدرسي.`],['المتابعة المهنية',impact(raw)?'تُتابع النتائج من خلال المخرج أو الأثر المذكور وربطه بالممارسة الفعلية.':'تُتابع الاستفادة من خلال ما يطبقه المستفيدون في الممارسة الفعلية، ويُضاف شاهد أثر عند توفره.']]}else if(type==='program'){let goal=/انضباط|غياب|بصمة/.test(n)?'تعزيز الانضباط المدرسي ودعم انتظام الطلاب من خلال إجراء منظم يسهل المتابعة والرصد.':/خط|قراءة|إملاء/.test(n)?'تنمية المهارة المستهدفة لدى الطلاب من خلال نشاط منظم يدعم الممارسة والتطبيق.':'دعم هدف تربوي محدد من خلال تنفيذ عمل منظم يخدم الفئة المستهدفة.';secs=[['الهدف',goal],['التنفيذ',raw],['المتابعة',impact(raw)?'تُستثمر النتائج المذكورة في توجيه المتابعة وتحديد الإجراء اللاحق.':'تُستكمل المتابعة من خلال الشواهد والبيانات الناتجة عن التنفيذ، وتُبنى عليها إجراءات التحسين عند الحاجة.']]}else if(type==='meeting'){secs=[['الغرض من الاجتماع',`عُقد «${title}» لمناقشة الموضوع وتنسيق الإجراءات المرتبطة به.`],['أبرز ما تم',raw],['المتابعة','تُتابع القرارات والتكليفات وفق ما تم الاتفاق عليه وتوثيقه.']]}else if(type==='lesson'){secs=[['الهدف التعليمي',`توظيف «${title}» لدعم تعلم الطلاب وتحسين تفاعلهم مع ناتج التعلم المستهدف.`],['الممارسة',raw],['التحقق والمتابعة',impact(raw)?'تُستخدم النتيجة المذكورة لتوجيه الدعم أو الإثراء اللاحق.':'يُستكمل التحقق من التعلم بأداة مناسبة، وتوظف نتائجه في الدعم أو الإثراء.']]}else if(type==='analysis'){secs=[['نطاق التحليل',`أُجري «${title}» لقراءة مستوى الأداء وتحديد جوانب القوة والفجوات ذات الأولوية.`],['التحليل',raw],['الإجراء والمتابعة','تُربط الإجراءات بنتائج التحليل وتُتابع ببيانات لاحقة لقياس التقدم.']]}else if(type==='partnership'){secs=[['الهدف','تعزيز التعاون مع الأسرة أو المجتمع بما يدعم الهدف التربوي ويضيف قيمة للعمل المدرسي.'],['التنفيذ',raw],['المتابعة','تُراجع نتائج المشاركة وقيمتها المضافة لتحديد فرص الاستمرار أو التطوير.']]}else if(type==='safety'){secs=[['الغرض','دعم سلامة البيئة المدرسية وجاهزيتها من خلال إجراء واضح وقابل للمتابعة.'],['الإجراء',raw],['المتابعة','تُستكمل المتابعة حتى إغلاق الملاحظة أو التأكد من استدامة الإجراء.']]}else{secs=[['الهدف والأولوية',`أُعدت «${title}» لمعالجة أولوية محددة وتحويلها إلى إجراءات قابلة للتنفيذ والمتابعة.`],['التنفيذ',raw],['المتابعة','تتم متابعة التنفيذ دوريًا ومراجعة الشواهد لتحديد مستوى التقدم والإجراءات اللاحقة.']]};return secs}
function indicators(raw,type){let text=norm(raw),sc={},rs={};RULES.forEach(r=>{let h=r.k.filter(k=>text.includes(norm(k))).length;if(!h)return;(r.c||[]).forEach(c=>{sc[c]=(sc[c]||0)+h*2;(rs[c]||(rs[c]=[])).push(r.r)});if(impact(raw))(r.impact||[]).forEach(c=>{sc[c]=(sc[c]||0)+h*2;(rs[c]||(rs[c]=[])).push('وردت إشارة إلى نتيجة أو تغير قابل للقياس')})});let d={training:['1-4-1-5'],lesson:['2-1-1-3'],analysis:['2-2-1-3'],partnership:['1-3-1-3'],safety:['4-2-1-1'],plan:['1-1-1-1']}[type]||[];d.forEach(c=>{sc[c]=(sc[c]||0)+1;(rs[c]||(rs[c]=[])).push('نوع العمل يتوافق مبدئيًا مع المؤشر')});return Object.entries(sc).map(([code,score])=>{let i=IND.find(x=>x[0]===code),kind=i?.[3]||'تنفيذ';if(kind==='أثر'&&!impact(raw))score=Math.min(score,2);return{code,score,kind,level:score>=5?'قوي':score>=3?'متوسط':'محتمل',label:i?.[2]||'',reason:[...new Set(rs[code]||[])].join('؛ '),need:kind==='أثر'&&!impact(raw)?'يحتاج بيانات أثر أو نتيجة قبل اعتباره دعمًا قويًا':'يحتاج شاهدًا مناسبًا يثبت هذا الجانب'}}).sort((a,b)=>b.score-a.score).slice(0,8)}
function analyze(){let raw=$('raw').value.trim();if(!raw)return alert('اكتب ما فعلته أولًا.');let type=detectType(raw),stage=detectStage(raw),aud=detectAudience(raw),title=titleOf(raw,type),secs=generate(raw,type,title,aud,stage),inds=indicators(raw,type);$('result').innerHTML=`<div class="card"><h2>هذا ما فهمه المحرك</h2><div class="chips"><span class="tag">${esc(typeLabel(type))}</span>${stage?`<span class="tag">${esc(stage)}</span>`:''}${aud?`<span class="tag">${esc(aud)}</span>`:''}</div><h3 style="margin-top:12px">${esc(title)}</h3></div><div class="card"><h2>النص المهني</h2>${secs.map(s=>`<div class="sec"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}</div><div class="card"><h2>الربط الذكي بالمؤشرات</h2><div class="warn">وجود ارتباط لا يعني تحقق المؤشر. مؤشرات الأثر لا تقوى إلا بوجود نتيجة أو بيانات أثر.</div>${inds.length?inds.map(i=>`<div class="item"><b>${i.code} — ${esc(i.label)}</b> <span class="tag">${i.level}</span> <span class="tag gray">${i.kind}</span><div class="muted" style="margin-top:6px"><b>سبب الاقتراح:</b> ${esc(i.reason)}</div><div class="muted"><b>ما ينقص:</b> ${esc(i.need)}</div></div>`).join(''):'<div class="muted" style="margin-top:12px">لم يظهر ارتباط قوي من الوصف الحالي.</div>'}</div>`}
</script></body></html>
