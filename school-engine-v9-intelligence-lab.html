<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145e52">
<title>V9 Intelligence Lab — فهم مهني</title>
<style>
:root{--a:#145e52;--s:#eaf5f1;--l:#dce6e2;--m:#687570;--bg:#f4f7f6;--warn:#fff8e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17211f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.w{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 9px 28px rgba(18,74,63,.06)}
h1,h2,h3{margin-top:0}.muted{color:var(--m)}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid #d5dfdc;border-radius:13px;padding:12px;background:#fff}
textarea{min-height:135px;line-height:1.9;font-size:17px}.btn{border:1px solid var(--l);background:#fff;border-radius:12px;padding:11px 14px;font-weight:800}
.primary{background:var(--a);color:#fff;border-color:var(--a)}.soft{background:var(--s);color:var(--a)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--s);color:var(--a);font-size:13px;font-weight:800}
.factGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.fact{border:1px solid var(--l);border-radius:13px;padding:10px;background:#fbfdfc}.fact small{display:block;color:var(--m);margin-bottom:4px}.fact b{font-size:14px}
.titleBox{margin-top:14px;padding-top:12px;border-top:1px solid var(--l)}.titleBox small{color:var(--m)}.titleBox h3{margin:5px 0 0}
.sec{border-right:4px solid var(--a);padding-right:12px;margin:16px 0}.sec p{white-space:pre-line;line-height:1.9;margin-bottom:0;font-size:16px}
.warn{background:var(--warn);border:1px solid #ecdca8;padding:12px;border-radius:13px}.item{border:1px solid var(--l);border-radius:14px;padding:12px;margin:9px 0}
.itemTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.badge{padding:4px 8px;border-radius:999px;background:#f0f2f2;color:#5f6967;font-size:12px}
.strong{background:#e7f5ef;color:#11624f}.possible{background:#fff4d8;color:#7c5c00}.hidden{display:none!important}.edit{margin-top:12px;border-top:1px dashed var(--l);padding-top:12px}
.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{font-size:13px;color:var(--m);margin-top:6px}
@media(max-width:650px){.factGrid{grid-template-columns:1fr 1fr}.editGrid{grid-template-columns:1fr}.itemTop{flex-direction:column}}
</style>
</head>
<body>
<main class="w">
  <section class="card">
    <div class="muted">V9 Intelligence Lab — الفهم المهني قبل التوثيق</div>
    <h1>ماذا فعلت؟</h1>
    <p class="muted">اكتب بطريقتك حتى لو كانت عامية. المحرك يستخرج المعنى ثم يكتب وثيقة مهنية جديدة.</p>
    <textarea id="raw" placeholder="مثال: سوينا بصمة لطلاب أول متوسط عشان نتابع التأخير"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" onclick="analyze()">افهم العمل وابنِ التوثيق</button>
      <button class="btn soft" onclick="loadExample()">تجربة مثال عامي</button>
    </div>
  </section>
  <div id="result"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه');
const has=(t,re)=>re.test(norm(t));
const TYPE_LABEL={attendance:'متابعة الانضباط والحضور',analysis:'تحليل نتائج',training:'تطوير مهني',meeting:'اجتماع',lesson:'ممارسة تعليمية',partnership:'شراكة / تواصل أسري',safety:'أمن وسلامة',plan:'خطة / متابعة',program:'برنامج / فعالية'};
const IND=[
 ['1-2-1-3','إجراءات دعم الانضباط المدرسي','تنفيذ'],
 ['3-2-1-5','السلوك والانضباط','أثر'],
 ['1-4-1-5','التطوير المهني وفق الاحتياج','تنفيذ'],
 ['2-2-1-3','تحليل نتائج التقويم وتوظيفها','أثر'],
 ['2-2-1-4','التغذية الراجعة ومتابعة التقدم','متابعة'],
 ['2-1-1-3','تنويع استراتيجيات التعليم والتعلم','تنفيذ'],
 ['2-1-1-4','تفعيل التقنية الرقمية','تنفيذ'],
 ['1-3-1-2','مشاركة الأسرة في تعلم الأبناء','تنفيذ'],
 ['1-3-1-3','الشراكة المجتمعية','تنفيذ'],
 ['4-2-1-1','الأمن والسلامة','تنفيذ'],
 ['4-2-1-2','متابعة الصيانة','متابعة'],
 ['1-1-1-1','الخطة التشغيلية','تنفيذ'],
 ['1-4-1-7','خطة التحسين','متابعة']
];
function detectGrade(t){
 let n=norm(t), stage='', grade='';
 if(/اول(ى)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='الأول الابتدائي'}
 else if(/ثاني(ه)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='الثاني الابتدائي'}
 else if(/ثالث(ه)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='الثالث الابتدائي'}
 else if(/رابع(ه)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='الرابع الابتدائي'}
 else if(/خامس(ه)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='الخامس الابتدائي'}
 else if(/سادس(ه)?\s*(ابتدائي|الابتدائي)/.test(n)){stage='ابتدائي';grade='السادس الابتدائي'}
 else if(/اول(ى)?\s*(متوسط|المتوسط)/.test(n)){stage='متوسط';grade='الأول المتوسط'}
 else if(/ثاني(ه)?\s*(متوسط|المتوسط)/.test(n)){stage='متوسط';grade='الثاني المتوسط'}
 else if(/ثالث(ه)?\s*(متوسط|المتوسط)/.test(n)){stage='متوسط';grade='الثالث المتوسط'}
 else if(/اول(ى)?\s*(ثانوي|الثانوي)/.test(n)){stage='ثانوي';grade='الأول الثانوي'}
 else if(/ثاني(ه)?\s*(ثانوي|الثانوي)/.test(n)){stage='ثانوي';grade='الثاني الثانوي'}
 else if(/ثالث(ه)?\s*(ثانوي|الثانوي)/.test(n)){stage='ثانوي';grade='الثالث الثانوي'}
 else if(/ابتدائي/.test(n))stage='ابتدائي';
 else if(/متوسط/.test(n))stage='متوسط';
 else if(/ثانوي/.test(n))stage='ثانوي';
 return {stage,grade};
}
function detectAudience(t){
 let n=norm(t);
 if(/معلم|معلمات|معلمين/.test(n))return 'المعلمون';
 if(/ولي الامر|اولياء|اسره|امهات|اباء/.test(n))return 'أولياء الأمور';
 if(/طالب|طلاب|طالبه|طالبات/.test(n))return 'الطلاب';
 return '';
}
function detectType(t){
 let n=norm(t);
 if(/بصم|تاخير|غياب|حضور|مواظب|انضباط/.test(n))return'attendance';
 if(/حلل|تحليل|نتائج|اختبار|متعثر|علاجي/.test(n))return'analysis';
 if(/تدريب|ورشه|تطوير مهني|مجتمع مهني|مجتمع تعلم/.test(n))return'training';
 if(/اجتماع|اجتمع|لجنه|محضر/.test(n))return'meeting';
 if(/درس|حصه|تدريس|استراتيجي/.test(n))return'lesson';
 if(/ولي الامر|اولياء|اسره|شراك/.test(n))return'partnership';
 if(/سلامه|اخلاء|حريق|صيانه|نظافه/.test(n))return'safety';
 if(/خطه|تشغيلي|تحسين/.test(n))return'plan';
 return'program';
}
function topicOf(t,type){
 let n=norm(t);
 if(type==='attendance')return /بصم/.test(n)?'متابعة الحضور والانضباط إلكترونيًا':'تعزيز الانضباط ومتابعة الحضور';
 if(type==='analysis')return /اختبار/.test(n)?'نتائج الاختبار والإجراءات العلاجية':'تحليل الأداء والتحسين';
 if(type==='training')return /لغه عربي/.test(n)?'تطوير الممارسات المهنية في اللغة العربية':'التطوير المهني';
 if(type==='safety')return /صيانه/.test(n)?'متابعة الصيانة':'الأمن والسلامة';
 if(type==='partnership')return'تعزيز التواصل والشراكة مع الأسرة';
 if(type==='lesson')return'تحسين الممارسة التعليمية';
 if(type==='meeting')return'تنسيق العمل ومتابعة الإجراءات';
 if(type==='plan')return'التخطيط والمتابعة';
 return'تنفيذ برنامج تربوي';
}
function professionalTitle(f){
 if(f.type==='attendance')return f.grade?`تفعيل المتابعة الإلكترونية لحضور طلاب ${f.grade}`:'تفعيل المتابعة الإلكترونية للحضور والانضباط';
 if(f.type==='analysis')return 'تحليل نتائج الاختبار ووضع الإجراءات العلاجية';
 if(f.type==='training')return 'تنفيذ مجتمع مهني لدعم تطوير الممارسة التعليمية';
 if(f.type==='meeting')return 'اجتماع تنسيقي لمراجعة الإجراءات ومتابعة التنفيذ';
 if(f.type==='lesson')return 'تطبيق ممارسة تعليمية داعمة لتحسين التعلم';
 if(f.type==='partnership')return 'تعزيز التواصل مع الأسرة لدعم تعلم الطلاب';
 if(f.type==='safety')return 'تنفيذ إجراء داعم لسلامة البيئة المدرسية';
 if(f.type==='plan')return 'إعداد ومتابعة خطة تحسين';
 return 'تنفيذ برنامج تربوي للفئة المستهدفة';
}
function impactSignal(t){return has(t,/تحسن|ارتفع|انخفض|نسبه|مقارنه|قبل وبعد|نتيجه لاحقه|تقدم بعد|اثر/)}
function factsFrom(raw){
 let g=detectGrade(raw), type=detectType(raw), aud=detectAudience(raw);
 if(!aud && ['attendance','analysis','lesson'].includes(type))aud='الطلاب';
 return {type,stage:g.stage,grade:g.grade,audience:aud,topic:topicOf(raw,type),title:'',raw};
}
function professionalSections(f){
 const aud=f.audience||'الفئة المستهدفة', grade=f.grade?` في ${f.grade}`:'', type=f.type;
 if(type==='attendance') return [
  ['الهدف',`تعزيز الانضباط المدرسي ورفع دقة متابعة حضور ${aud}${grade} من خلال تفعيل وسيلة إلكترونية تدعم الرصد المنتظم لحالات الحضور والتأخر.`],
  ['الإجراء',`تم تفعيل نظام إلكتروني لتسجيل الحضور ومتابعة حالات التأخر بصورة منظمة، بما يسهّل الوصول إلى بيانات المتابعة اليومية واتخاذ الإجراء المناسب عند الحاجة.`],
  ['المتابعة',`تُراجع بيانات الحضور والتأخر بصورة دورية، وتُستخدم نتائج المتابعة في توجيه الإجراءات الداعمة للانضباط وقياس التحسن بمرور الوقت.`]
 ];
 if(type==='analysis') return [
  ['نطاق التحليل',`تم تحليل نتائج الاختبار بهدف قراءة مستوى الأداء وتحديد الطلاب الذين يحتاجون إلى دعم إضافي، مع التركيز على جوانب التعثر ذات الأولوية.`],
  ['نتائج التحليل',`أسفر التحليل عن تحديد الطلاب المتعثرين وتوجيه الاهتمام إلى الجوانب التي تتطلب معالجة تعليمية مركزة.`],
  ['الإجراء والتحسين',`وُضعت خطة علاجية موجهة للطلاب المتعثرين، على أن تُتابع نتائج تنفيذها ببيانات لاحقة لقياس مستوى التقدم وتعديل الإجراءات عند الحاجة.`]
 ];
 if(type==='training') return [
  ['الاحتياج المهني',`نُفذ النشاط التطويري لدعم الممارسة المهنية لدى ${aud} والاستجابة لاحتياج مرتبط بتحسين جودة الأداء في المجال المستهدف.`],
  ['التنفيذ',`نُفذت جلسة مهنية قائمة على النقاش والتطبيق وتبادل الخبرات، مع التركيز على ممارسات قابلة للتوظيف في العمل التعليمي.`],
  ['المتابعة المهنية',`تُتابع الاستفادة من خلال تطبيق المخرجات في الممارسة الفعلية، وإضافة شاهد أثر عند توفر نتيجة أو منتج يوضح أثر التطوير المهني.`]
 ];
 if(type==='meeting') return [
  ['الغرض',`عُقد الاجتماع لمراجعة الموضوع محل العمل وتنسيق الأدوار والإجراءات المرتبطة به بما يدعم وضوح التنفيذ.`],
  ['أبرز ما تم',`تمت مناقشة الجوانب ذات الصلة وتحديد ما يلزم من إجراءات أو تكليفات وفق الحاجة.`],
  ['المتابعة',`تُتابع القرارات والتكليفات حتى استكمالها، مع توثيق ما تم تنفيذه وما يستلزم إجراءً لاحقًا.`]
 ];
 if(type==='lesson') return [
  ['الهدف التعليمي',`توظيف ممارسة تعليمية مناسبة لدعم تعلم الطلاب وتحسين تفاعلهم مع ناتج التعلم المستهدف.`],
  ['الممارسة',`تم تنفيذ الممارسة داخل البيئة التعليمية بصورة منظمة مع توجيه الطلاب نحو المشاركة والتطبيق.`],
  ['التحقق والمتابعة',`يُتحقق من مستوى التعلم بأداة مناسبة، وتُستخدم النتائج لتحديد احتياج الطلاب إلى دعم أو إثراء.`]
 ];
 if(type==='partnership') return [
  ['الهدف',`تعزيز دور الأسرة في دعم تعلم الطلاب وتحسين جودة التواصل حول الجوانب التعليمية ذات الأولوية.`],
  ['التنفيذ',`تم التواصل مع أولياء الأمور ومناقشة الجوانب المرتبطة بمستوى الأبناء ودور الأسرة في المتابعة والدعم.`],
  ['المتابعة',`تُتابع الاستجابة والتقدم في الجوانب المتفق عليها، وتُوثق التغذية الراجعة ذات الصلة عند توفرها.`]
 ];
 if(type==='safety') return [
  ['الهدف',`دعم سلامة البيئة المدرسية ورفع جاهزيتها من خلال إجراء واضح قابل للمتابعة.`],
  ['الإجراء',`تم تنفيذ الإجراء المرتبط بالملاحظة أو الحاجة المحددة وفق متطلبات السلامة والتشغيل.`],
  ['المتابعة',`تستمر المتابعة حتى إغلاق الملاحظة أو التحقق من استدامة الإجراء وعدم تكرار المشكلة.`]
 ];
 return [
  ['الهدف',`تنفيذ عمل تربوي منظم يخدم ${aud} ويرتبط بأولوية محددة في العمل المدرسي.`],
  ['التنفيذ',`تم تنفيذ العمل وفق هدف واضح ومشاركة الفئة المستهدفة بما يدعم تحقيق الغرض منه.`],
  ['المتابعة',`تُراجع الشواهد والنتائج المرتبطة بالتنفيذ لتحديد ما تحقق وما يحتاج إلى استكمال أو تحسين.`]
 ];
}
function indicatorSuggestions(f){
 const r=[], add=(code,level,reason,need)=>{
  const i=IND.find(x=>x[0]===code); if(i)r.push({code,label:i[1],kind:i[2],level,reason,need});
 };
 if(f.type==='attendance'){
  add('1-2-1-3','قوي','العمل يتضمن إجراءً مباشرًا لتنظيم متابعة الحضور والتأخر.','صورة أو سجل يثبت تفعيل الإجراء ومتابعته.');
  add('3-2-1-5',impactSignal(f.raw)?'متوسط':'فرصة استكمال','قد يدعم الإجراء تحسن السلوك والانضباط، لكن الأثر يحتاج نتيجة فعلية.','مقارنة أو بيانات لاحقة توضح تحسن الانضباط أو انخفاض التأخر.');
 }
 if(f.type==='analysis'){
  add('2-2-1-3','قوي','الوصف يتضمن تحليل نتائج، تحديد متعثرين، ثم إجراءً علاجيًا مبنيًا على النتائج.','كشف التحليل أو تقرير النتائج مع الخطة العلاجية.');
  add('2-2-1-4','فرصة استكمال','وجود خطة علاجية يفتح مسار متابعة تقدم الطلاب بعد التنفيذ.','نتيجة متابعة لاحقة توضح مستوى تقدم الطلاب بعد تنفيذ الخطة.');
 }
 if(f.type==='training') add('1-4-1-5','قوي','العمل نشاط تطوير مهني مرتبط بتحسين الممارسة.','محضر أو عرض أو منتج تدريبي وشاهد تطبيق لاحق عند توفره.');
 if(f.type==='lesson') add('2-1-1-3','متوسط','العمل ممارسة تعليمية، وتزداد قوة الربط عند تحديد الاستراتيجية المستخدمة.','شاهد يوضح الاستراتيجية وتطبيقها داخل الموقف التعليمي.');
 if(f.type==='partnership') add('1-3-1-2','قوي','العمل يتضمن تواصلًا مباشرًا مع الأسرة لدعم تعلم الأبناء.','سجل تواصل أو محضر أو نموذج متابعة.');
 if(f.type==='safety') add('4-2-1-1','متوسط','العمل مرتبط بسلامة البيئة المدرسية.','شاهد تنفيذ واضح أو سجل متابعة للملاحظة.');
 if(f.type==='plan') add('1-4-1-7','متوسط','العمل يتضمن إعداد أو متابعة إجراء تحسيني.','الخطة نفسها مع ما يثبت المتابعة والتنفيذ.');
 return r;
}
let state=null;
function render(){
 let f=state, secs=professionalSections(f), inds=indicatorSuggestions(f);
 $('result').innerHTML=`
 <section class="card">
   <div class="row" style="justify-content:space-between"><h2 style="margin:0">هذا ما فهمته</h2><button class="btn soft" onclick="toggleEdit()">تعديل الفهم</button></div>
   <div class="factGrid">
    <div class="fact"><small>نوع العمل</small><b>${esc(TYPE_LABEL[f.type])}</b></div>
    <div class="fact"><small>المستفيدون</small><b>${esc(f.audience||'غير محسوم')}</b></div>
    <div class="fact"><small>المرحلة</small><b>${esc(f.stage||'غير محسومة')}</b></div>
    <div class="fact"><small>الصفوف</small><b>${esc(f.grade||'غير محددة')}</b></div>
   </div>
   <div class="titleBox"><small>الموضوع المستنتج</small><div><b>${esc(f.topic)}</b></div><small style="display:block;margin-top:10px">العنوان المهني المقترح</small><h3>${esc(professionalTitle(f))}</h3></div>
   <div id="editBox" class="edit hidden">
    <div class="editGrid">
      <div><label>المرحلة</label><select id="eStage"><option value="">غير محددة</option><option ${f.stage==='ابتدائي'?'selected':''}>ابتدائي</option><option ${f.stage==='متوسط'?'selected':''}>متوسط</option><option ${f.stage==='ثانوي'?'selected':''}>ثانوي</option></select></div>
      <div><label>الصف</label><input id="eGrade" value="${esc(f.grade)}" placeholder="مثال: الأول المتوسط"></div>
      <div><label>المستفيدون</label><input id="eAud" value="${esc(f.audience)}" placeholder="مثال: الطلاب"></div>
      <div><label>نوع العمل</label><select id="eType">${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}" ${k===f.type?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <button class="btn primary" style="margin-top:10px" onclick="applyEdit()">اعتماد التصحيح</button>
   </div>
 </section>
 <section class="card"><h2>النص المهني</h2>${secs.map(s=>`<div class="sec"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}</section>
 <section class="card"><h2>الربط الذكي بالمؤشرات</h2><div class="warn">الربط لا يعني تحقق المؤشر. مؤشرات الأثر لا تُقوى إلا بنتيجة أو بيانات أثر.</div>
 ${inds.length?inds.map(i=>`<div class="item"><div class="itemTop"><b>${i.code} — ${esc(i.label)}</b><div><span class="badge ${i.level==='قوي'?'strong':i.level==='فرصة استكمال'?'possible':''}">${i.level}</span> <span class="badge">${i.kind}</span></div></div><div class="muted" style="margin-top:8px"><b>لماذا ظهر؟</b> ${esc(i.reason)}</div><div class="muted"><b>ما الذي يقويه؟</b> ${esc(i.need)}</div></div>`).join(''):'<div class="muted" style="margin-top:12px">لا يوجد ارتباط موثوق من الوصف الحالي، ولن يعرض المحرك مؤشرات لمجرد التشابه اللفظي.</div>'}
 </section>`;
}
function analyze(){let raw=$('raw').value.trim();if(!raw)return alert('اكتب ما فعلته أولًا.');state=factsFrom(raw);render();setTimeout(()=>$('result').scrollIntoView({behavior:'smooth'}),40)}
function toggleEdit(){$('editBox').classList.toggle('hidden')}
function applyEdit(){state.stage=$('eStage').value;state.grade=$('eGrade').value.trim();state.audience=$('eAud').value.trim();state.type=$('eType').value;state.topic=topicOf(state.raw,state.type);render()}
function loadExample(){$('raw').value='سوينا بصمة لطلاب أول متوسط عشان نتابع التأخير';analyze()}
</script>
</body></html>
