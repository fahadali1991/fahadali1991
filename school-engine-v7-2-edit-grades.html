<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>محرك توثيق المدرسة V7.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f8}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app"></iframe><script>
function v72Patch(){
'use strict';
const d=document,$=id=>d.getElementById(id);
if(d.__v72patched)return;d.__v72patched=true;
const STAGES={primary:['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],middle:['الأول المتوسط','الثاني المتوسط','الثالث المتوسط'],secondary:['الأول الثانوي','الثاني الثانوي','الثالث الثانوي']};
let editingId=null;
const style=d.createElement('style');style.textContent='.stageChecks{display:flex;flex-wrap:wrap;gap:8px}.stageOpt{display:flex!important;align-items:center;gap:7px;border:1px solid #cfdde2;border-radius:12px;padding:9px 11px;background:#fff;font-weight:700!important}.stageOpt input{width:auto!important;margin:0}.cardActions{display:flex;gap:7px;flex-wrap:wrap}.editBadge{background:#fff8e7;border:1px solid #ead59d;color:#6c5419;border-radius:10px;padding:7px 9px;font-size:12px}';d.head.appendChild(style);
const settingsGrid=$('settings').querySelector('.settings');const stagesWrap=d.createElement('div');stagesWrap.className='field full';stagesWrap.innerHTML='<label>المراحل الدراسية في المدرسة</label><div id="stageChecks" class="stageChecks"><label class="stageOpt"><input type="checkbox" data-stage="primary"> ابتدائي</label><label class="stageOpt"><input type="checkbox" data-stage="middle"> متوسط</label><label class="stageOpt"><input type="checkbox" data-stage="secondary"> ثانوي</label></div><div class="helper">اختر مرحلة واحدة أو أكثر. ستظهر في خانة الصف فقط الصفوف التابعة للمراحل المختارة، بدون شعب إضافية.</div>';settingsGrid.appendChild(stagesWrap);
const duration=$('duration').closest('.field');const gradeField=d.createElement('div');gradeField.className='field';gradeField.innerHTML='<label>الصف <span class="muted">(اختياري)</span></label><select id="grade"></select>';duration.insertAdjacentElement('afterend',gradeField);
function readStored(){try{return JSON.parse(localStorage.getItem('school_settings')||'{}')}catch(e){return{}}}
function selectedStages(){return[...d.querySelectorAll('#stageChecks [data-stage]:checked')].map(x=>x.dataset.stage)}
function renderGradeOptions(selected=''){const grades=selectedStages().flatMap(k=>STAGES[k]||[]);let html='<option value="">بدون تحديد صف</option>'+grades.map(g=>`<option value="${esc(g)}">الصف ${esc(g)}</option>`).join('');if(selected&&!grades.includes(selected))html+=`<option value="${esc(selected)}">الصف ${esc(selected)} — محفوظ سابقًا</option>`;$('grade').innerHTML=html;$('grade').value=selected||''}
function applyStoredStages(){const s=readStored(),arr=Array.isArray(s.schoolStages)?s.schoolStages:[];d.querySelectorAll('#stageChecks [data-stage]').forEach(x=>x.checked=arr.includes(x.dataset.stage));renderGradeOptions()}
applyStoredStages();
const oldGetSettings=getSettings;getSettings=function(){return{...oldGetSettings(),schoolStages:selectedStages()}};
$('saveSettings').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();localStorage.setItem('school_settings',JSON.stringify(getSettings()));renderGradeOptions($('grade').value);alert('تم حفظ الإعدادات')},true);
d.querySelectorAll('#stageChecks [data-stage]').forEach(x=>x.addEventListener('change',()=>renderGradeOptions($('grade').value)));
const oldOpenForm=openForm;openForm=function(k='program'){editingId=null;oldOpenForm(k);renderGradeOptions();$('formSub').textContent='اختر التصنيف الأقرب ثم انقر على ما حدث فعليًا.'};
const oldBuild=build;build=function(){const s=oldBuild();const grade=$('grade').value;if(grade&&s.length){const lines=s[0][1].split('\n').filter(x=>!/^• الصف المستهدف:/.test(x));lines.unshift(`• الصف المستهدف: ${grade}.`);s[0][1]=lines.join('\n')}return s};
function syncGradeInEditor(){if(!$('generated').classList.contains('active'))return;const ta=$('sections').querySelector('textarea');if(!ta)return;let lines=ta.value.split('\n').filter(x=>!/^• الصف المستهدف:/.test(x));const grade=$('grade').value;if(grade)lines.unshift(`• الصف المستهدف: ${grade}.`);ta.value=lines.join('\n')}
function restoreSelections(saved){if(!saved)return;$('note').value=fix(saved.note||'');$('smartGroups').querySelectorAll('.group').forEach(g=>{const vals=new Set(saved[g.dataset.k]||[]);g.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',vals.has(b.dataset.v)))})}
function renderPending(){ $('pendingFiles').innerHTML=(pending||[]).map(f=>`<div class="doc">📎 ${esc(f.name||'مرفق')} <span class="muted">${f.size?Math.round(f.size/1024)+' KB':''}</span></div>`).join('') }
function editDoc(id){const rec=docs.find(x=>x.id===id);if(!rec)return;editingId=id;$('form').reset();pending=[...(rec.files||[])];renderPending();const type=TYPES[rec.type]?rec.type:'program';$('type').value=type;renderSubtypes(rec.subtype||'');renderSmart();renderGradeOptions(rec.grade||'');$('title').value=rec.title||'';$('date').value=rec.date||new Date().toISOString().slice(0,10);$('duration').value=rec.duration||'حصة واحدة';$('beneficiary').value=rec.beneficiary||'الطلاب';$('count').value=Number(rec.count||0);$('owner').value=rec.owner||'';restoreSelections(rec.smartSelections||{});if((rec.sections||[]).length)renderSections(rec.sections.map(x=>[x.title||'',x.body||'']));else{$('sections').innerHTML='';$('generated').classList.remove('active')}$('formTitle').textContent='تعديل '+(TYPES[type]?.label||'التوثيق');$('formSub').innerHTML='<span class="editBadge">تعديل سجل محفوظ — يدعم السجلات السابقة واللاحقة</span>';if(!$('formDialog').open)$('formDialog').showModal()}
window.editDoc=editDoc;
$('form').addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();if(!$('generated').classList.contains('active')){const s=build();if(!s.length)return;renderSections(s)}syncGradeInEditor();if(!db){alert('تعذر فتح قاعدة البيانات. أعد تحميل الصفحة.');return}const st=getSettings(),prev=editingId?docs.find(x=>x.id===editingId):null,now=new Date().toISOString(),rec={...(prev||{}),id:editingId||crypto.randomUUID(),type:$('type').value,subtype:$('subtype').value,subtypeLabel:subtypeLabel(),title:fix($('title').value),date:$('date').value,duration:$('duration').value,grade:$('grade').value||'',beneficiary:$('beneficiary').value,count:Number($('count').value||0),owner:fix($('owner').value),sections:getSections(),files:pending,smartSelections:selections(),schoolName:st.schoolName||'',eduOffice:st.eduOffice||'',principalName:st.principalName||'',preparedBy:st.preparedBy||'',created:prev?.created||now,updated:editingId?now:''};await put(rec);editingId=null;$('formDialog').close();await render();nav('archive')},true);
card=function(rec,editable=false){const type=TYPES[rec.type]||{label:'توثيق'};return`<div class="doc"><div class="row"><div><span class="tag">${esc(type.label)}</span>${rec.subtypeLabel?`<span class="tag">${esc(rec.subtypeLabel)}</span>`:''}${rec.grade?`<span class="tag">الصف ${esc(rec.grade)}</span>`:''}<h3 style="margin:7px 0 4px">${esc(rec.title)}</h3><div class="muted">${esc(rec.date||'')} · ${esc(rec.duration||'')} · ${esc(rec.owner||'')}</div></div><div class="cardActions"><button class="ghost" data-open-id="${esc(rec.id)}">فتح</button>${editable?`<button class="secondary" data-edit-id="${esc(rec.id)}">✏️ تعديل</button>`:''}</div></div></div>`};
function bindDocButtons(){d.querySelectorAll('[data-open-id]').forEach(b=>b.addEventListener('click',()=>viewDoc(b.dataset.openId)));d.querySelectorAll('[data-edit-id]').forEach(b=>b.addEventListener('click',()=>editDoc(b.dataset.editId)))}
renderList=function(){const q=fix($('search').value).toLowerCase();const arr=docs.filter(x=>!q||[x.title,x.owner,x.subtypeLabel,x.grade,...(x.sections||[]).map(s=>s.body)].join(' ').toLowerCase().includes(q));$('list').innerHTML=arr.map(x=>card(x,true)).join('')||'<div class="empty">لا توجد نتائج.</div>';bindDocButtons()};
render=async function(){docs=(await getAll()).sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));$('recent').innerHTML=docs.slice(0,4).map(x=>card(x,false)).join('')||'<div class="empty">لا توجد أعمال موثقة بعد.</div>';renderList();bindDocButtons()};
viewDoc=function(id){const rec=docs.find(x=>x.id===id);if(!rec)return;const imgs=(rec.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));const type=TYPES[rec.type]||{label:'توثيق'};$('viewBody').innerHTML=`<div class="row"><div><span class="tag">${esc(type.label)}</span>${rec.subtypeLabel?`<span class="tag">${esc(rec.subtypeLabel)}</span>`:''}<h2>${esc(rec.title)}</h2></div><button class="secondary" id="printCurrent">🖨️ نموذج الطباعة 1</button></div><div class="doc"><span class="tag">التاريخ: ${esc(rec.date)}</span><span class="tag">المدة: ${esc(rec.duration)}</span>${rec.grade?`<span class="tag">الصف: ${esc(rec.grade)}</span>`:''}<span class="tag">المستفيد: ${esc(rec.beneficiary)}</span><span class="tag">العدد: ${rec.count||0}</span><span class="tag">المسؤول: ${esc(rec.owner||'-')}</span></div>${(rec.sections||[]).map(s=>`<div class="sec"><h4>${esc(s.title)}</h4><div style="white-space:pre-wrap;line-height:1.9">${esc(s.body)}</div></div>`).join('')}${imgs.length?`<div class="doc"><h3>الشواهد المصورة</h3><div class="thumbs">${imgs.map(f=>{const u=URL.createObjectURL(f);return`<div class="thumb"><img src="${u}"></div>`}).join('')}</div></div>`:''}`;$('printCurrent').addEventListener('click',()=>printDoc(id));if(!$('viewDialog').open)$('viewDialog').showModal()};
printDoc=function(id){const rec=docs.find(x=>x.id===id);if(!rec)return;const w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة.');return}w.document.write('<div dir="rtl" style="font-family:Tahoma;padding:30px">جاري تجهيز الطباعة…</div>');const imgs=(rec.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));Promise.all(imgs.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)}))).then(a=>{a=a.filter(Boolean);const type=TYPES[rec.type]||{label:'توثيق'};w.document.open();w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(rec.title)}</title><style>@page{size:A4;margin:10mm}body{font-family:Tahoma,Arial;color:#17252d}.head{text-align:center;border-bottom:1px solid #ddd;padding:10px}.head h1{font-size:20pt;color:#15445a}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.meta div{border:1px solid #ddd;border-radius:8px;padding:7px}.sec{border-right:4px solid #07a869;padding:5px 10px;margin:10px 0}.sec h3{color:#15445a}.sec div{font-size:12pt;line-height:1.7}.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.imgs img{width:100%;height:170px;object-fit:contain}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:22px;text-align:center}</style></head><body><div class="head"><div>وزارة التعليم · ${esc(rec.eduOffice||'إدارة التعليم')}</div><h1>${esc(rec.title)}</h1><div>${esc(rec.schoolName||'اسم المدرسة')} — ${esc(type.label)}${rec.subtypeLabel?' — '+esc(rec.subtypeLabel):''}</div></div><div class="meta"><div>التاريخ<br>${esc(rec.date)}</div><div>المدة<br>${esc(rec.duration)}</div>${rec.grade?`<div>الصف<br>${esc(rec.grade)}</div>`:''}<div>المستفيد<br>${esc(rec.beneficiary)}</div><div>العدد<br>${rec.count||0}</div><div style="grid-column:span 2">المسؤول<br>${esc(rec.owner||'-')}</div></div>${(rec.sections||[]).map(s=>`<section class="sec"><h3>${esc(s.title)}</h3><div>${esc(s.body).replace(/\n/g,'<br>')}</div></section>`).join('')}${a.length?`<div class="imgs">${a.map(src=>`<img src="${src}">`).join('')}</div>`:''}<div class="sign"><div>إعداد الوثيقة<br><b>${esc(rec.owner||'-')}</b></div><div>اعتماد مدير المدرسة<br><b>${esc(rec.principalName||'........................')}</b></div></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()})};
setTimeout(()=>render(),0);
}
const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const s=frame.contentDocument.createElement('script');s.textContent='('+v72Patch.toString()+')()';frame.contentDocument.body.appendChild(s)}catch(e){console.error(e)}});frame.src='https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/v7-unified/school-engine-v7-1-input-committee.html';
</script></body></html>
