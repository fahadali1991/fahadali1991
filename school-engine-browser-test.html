<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار محرك توثيق المدرسة</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;margin:0;background:#f5f7f8;color:#17202a}.wrap{max-width:820px;margin:auto;padding:18px}header{background:white;border-bottom:1px solid #ddd}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn,button{font:inherit;border:1px solid #ddd;background:white;padding:12px 16px;border-radius:12px;cursor:pointer}.primary{background:#1f6f5f;color:white;border-color:#1f6f5f}.tabs{display:flex;gap:8px;overflow:auto;margin-top:15px}.card{background:white;border:1px solid #e3e5e7;border-radius:18px;padding:18px;margin:16px 0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.action{border:1px solid #ddd;border-radius:15px;padding:18px 8px;text-align:center;background:white;cursor:pointer}.action span{display:block;font-size:28px;margin-bottom:6px}.page{display:none}.page.active{display:block}.toast{position:fixed;bottom:20px;left:20px;right:20px;max-width:420px;margin:auto;background:#17202a;color:white;padding:14px;border-radius:14px;display:none;text-align:center}.counter{font-size:34px;font-weight:700;color:#1f6f5f}@media(max-width:600px){.actions{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}}</style></head><body><header><div class="wrap"><div class="top"><div><b>محرك توثيق المدرسة الذكي</b><div style="color:#68717d;font-size:13px">اختبار المتصفح الخارجي</div></div><button class="primary" id="newBtn">+ وثّق عملاً</button></div><div class="tabs"><button data-page="home">الرئيسية</button><button data-page="works">الأعمال</button><button data-page="ready">الجاهزية</button><button data-page="settings">الإعدادات</button></div></div></header><main class="wrap"><section id="home" class="page active"><div class="card"><h2>ماذا فعلت اليوم؟</h2><p>اضغط أي أيقونة. إذا ظهر التنبيه فالـ JavaScript يعمل في متصفحك.</p><div class="actions"><div class="action" data-kind="برنامج"><span>🎯</span><b>برنامج</b></div><div class="action" data-kind="اجتماع"><span>👥</span><b>اجتماع</b></div><div class="action" data-kind="تطوير مهني"><span>🎓</span><b>تطوير مهني</b></div><div class="action" data-kind="تحليل نتائج"><span>📊</span><b>تحليل نتائج</b></div></div></div><div class="card"><div>عدد الضغطات الناجحة</div><div class="counter" id="count">0</div></div></section><section id="works" class="page"><div class="card"><h2>الأعمال</h2><p>إذا وصلت لهذه الصفحة فالتنقل يعمل.</p></div></section><section id="ready" class="page"><div class="card"><h2>الجاهزية</h2><p>هذه صفحة اختبار للتنقل.</p></div></section><section id="settings" class="page"><div class="card"><h2>الإعدادات</h2><button id="reset">تصفير عداد الاختبار</button></div></section></main><div id="toast" class="toast"></div><script>let n=0;const toast=document.getElementById('toast');function msg(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}function hit(t){n++;document.getElementById('count').textContent=n;msg('نجح: '+t)}document.getElementById('newBtn').addEventListener('click',()=>hit('زر وثّق عملاً'));document.querySelectorAll('.action').forEach(el=>el.addEventListener('click',()=>hit(el.dataset.kind)));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');msg('تم فتح '+b.textContent)}));document.getElementById('reset').addEventListener('click',()=>{n=0;document.getElementById('count').textContent='0';msg('تم التصفير')});</script></body></html>
