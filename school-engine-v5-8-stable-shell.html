<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك الوثائق المدرسية الذكي V5.8</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>html,body{margin:0;height:100%;background:#f5f7f8;font-family:Arial,Tahoma,sans-serif}#app{border:0;width:100%;height:100vh;display:block}#pdfOverlay{display:none;position:fixed;inset:0;background:#0008;z-index:999999;align-items:center;justify-content:center;padding:18px}#pdfBox{background:#fff;border-radius:18px;padding:18px;max-width:560px;width:100%;direction:rtl;box-shadow:0 10px 40px #0003}#pdfBox h3{margin:0 0 8px;color:#15445A}#pdfBox p{color:#68707a;line-height:1.7}.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer;margin:4px}.primary{background:#07A869;color:white}.secondary{background:#eef6f8;color:#15445A}#render{position:fixed;left:-12000px;top:0;width:794px;background:white}.error{padding:12px;border:1px solid #d99;border-radius:12px;background:#fff5f5;color:#822}</style></head><body><iframe id="app" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v5-5-stable.html"></iframe><div id="pdfOverlay"><div id="pdfBox"><h3 id="pdfTitle">إنشاء PDF</h3><div id="pdfState"><p>جاري تجهيز الملف…</p></div><button class="btn secondary" id="closePdf">إغلاق</button></div></div><div id="render"></div><script>(function(){'use strict';var frame=document.getElementById('app'),overlay=document.getElementById('pdfOverlay'),state=document.getElementById('pdfState'),render=document.getElementById('render');function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function getDoc(id){return new Promise(function(resolve,reject){var r=indexedDB.open('schoolDocsV53',1);r.onsuccess=function(){var db=r.result;if(!db.objectStoreNames.contains('docs')){reject(new Error('الأرشيف غير موجود'));return}var q=db.transaction('docs').objectStore('docs').get(id);q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}};r.onerror=function(){reject(r.error)}})}function fileDataUrl(f){return new Promise(function(resolve){var r=new FileReader();r.onload=function(){resolve({name:f.name||'صورة',src:r.result})};r.onerror=function(){resolve(null)};r.readAsDataURL(f)})}function build(d,imgs){var sections=(d.sections||[]).map(function(s){return '<section class="sec"><h3>'+esc(s.title)+'</h3><div>'+esc(s.body).split('\n').join('<br>')+'</div></section>'}).join('');var images=imgs.length?'<h3 class="evh">الشواهد المصورة</h3><div class="imgs">'+imgs.map(function(i){return '<figure><img src="'+i.src+'"><figcaption>'+esc(i.name)+'</figcaption></figure>'}).join('')+'</div>':'';render.innerHTML='<div id="pdfdoc" style="direction:rtl;width:794px;background:#fff;padding:24px;font-family:Arial,Tahoma,sans-serif;color:#17202a"><style>#pdfdoc *{box-sizing:border-box}#pdfdoc .bar{height:7px;background:linear-gradient(90deg,#07A869,#3D7EB9,#0DA9A6,#15445A,#C1B48A);margin-bottom:9px}#pdfdoc .head{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:center;border-bottom:2px solid #15445A;padding-bottom:8px}#pdfdoc .center{text-align:center}#pdfdoc .left{text-align:left}#pdfdoc .moe{font-size:14px;font-weight:700;color:#15445A}#pdfdoc .school{font-size:18px;font-weight:800;color:#07A869}#pdfdoc .sub{font-size:10px;color:#68707a}#pdfdoc .title{background:#eef6f8;border:1px solid #d6e4ea;border-radius:9px;padding:8px 10px;margin:9px 0;font-size:16px;font-weight:800;color:#15445A}#pdfdoc .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}#pdfdoc .meta div{border:1px solid #dfe5e8;border-radius:7px;padding:5px 6px;font-size:10px}#pdfdoc .sec{border:1px solid #dfe5e8;border-right:5px solid #07A869;border-radius:8px;padding:8px 10px;margin:5px 0;break-inside:avoid-page}#pdfdoc .sec h3{margin:0 0 4px;font-size:13px;color:#15445A}#pdfdoc .sec div{font-size:11.5px;line-height:1.6}#pdfdoc .evh{font-size:13px;color:#15445A;border-bottom:1px solid #dfe5e8;padding-bottom:4px}#pdfdoc .imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}#pdfdoc figure{margin:0;border:1px solid #dfe5e8;border-radius:8px;padding:5px;break-inside:avoid}#pdfdoc figure img{width:100%;height:160px;object-fit:cover;border-radius:5px}#pdfdoc figcaption{font-size:9px;margin-top:3px}#pdfdoc .sign{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:10px;padding-top:9px;border-top:1px dashed #c8d2d8;font-size:10px}</style><div class="bar"></div><div class="head"><div><div class="moe">وزارة التعليم</div><div class="sub">المملكة العربية السعودية</div></div><div class="center"><div class="school">'+esc(d.schoolName||'اسم المدرسة')+'</div><div class="sub">'+esc(d.eduOffice||'إدارة التعليم')+'</div></div><div class="left"><div class="moe">وثيقة مدرسية</div><div class="sub">نسخة PDF</div></div></div><div class="title">'+esc(d.title||'وثيقة')+'</div><div class="meta"><div><b>التاريخ:</b> '+esc(d.date||'-')+'</div><div><b>المدة:</b> '+esc(d.duration||'-')+'</div><div><b>المستفيد:</b> '+esc(d.beneficiary||'-')+'</div><div><b>العدد:</b> '+(d.count||0)+'</div><div><b>المسؤول:</b> '+esc(d.owner||'-')+'</div><div><b>إعداد:</b> '+esc(d.preparedBy||'-')+'</div><div><b>المدير:</b> '+esc(d.principalName||'-')+'</div><div><b>المرفقات:</b> '+((d.files||[]).length)+'</div></div>'+sections+images+'<div class="sign"><div><b>إعداد الوثيقة</b><br>'+esc(d.preparedBy||'........................')+'</div><div><b>اعتماد مدير المدرسة</b><br>'+esc(d.principalName||'........................')+'</div></div></div>';return document.getElementById('pdfdoc')}async function createPdf(id){overlay.style.display='flex';state.innerHTML='<p>⏳ جاري إنشاء ملف PDF…</p>';try{if(typeof html2pdf==='undefined')throw new Error('تعذر تحميل محرك PDF من الإنترنت');var d=await getDoc(id);if(!d)throw new Error('لم يتم العثور على السجل');var files=(d.files||[]).filter(function(f){return f.type&&f.type.indexOf('image/')===0});var imgs=(await Promise.all(files.map(fileDataUrl))).filter(Boolean);var node=build(d,imgs);var name=(d.title||'وثيقة').replace(/[\\/:*?"<>|]/g,'-')+'.pdf';var blob=await html2pdf().set({margin:[5,5,5,5],filename:name,image:{type:'jpeg',quality:.92},html2canvas:{scale:1.35,useCORS:true,backgroundColor:'#fff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}}).from(node).outputPdf('blob');var url=URL.createObjectURL(blob);state.innerHTML='<p><b>✅ تم إنشاء الملف.</b><br>افتح PDF ثم استخدم مشاركة Safari للطباعة، أو احفظه مباشرة.</p><a class="btn primary" target="_blank" rel="noopener" href="'+url+'">فتح PDF</a><a class="btn secondary" download="'+esc(name)+'" href="'+url+'">حفظ PDF</a>'}catch(e){state.innerHTML='<div class="error">تعذر إنشاء PDF: '+esc(e.message||e)+'</div>'}}function patch(){try{var doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-print]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();createPdf(b.dataset.print)},true);var mo=new MutationObserver(function(){doc.querySelectorAll('[data-print]').forEach(function(b){b.textContent='📄 إنشاء PDF / طباعة'})});mo.observe(doc.documentElement,{childList:true,subtree:true});doc.querySelectorAll('[data-print]').forEach(function(b){b.textContent='📄 إنشاء PDF / طباعة'})}catch(e){console.error(e)}}frame.addEventListener('load',patch);document.getElementById('closePdf').onclick=function(){overlay.style.display='none'};})();</script></body></html>
