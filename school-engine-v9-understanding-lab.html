<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V9 Understanding Engine</title><style>
:root{--a:#145e52;--s:#eaf5f1;--l:#dce6e2;--m:#687570;--bg:#f4f7f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17211f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0}.muted{color:var(--m)}textarea,input,button{font:inherit}textarea,input{width:100%;border:1px solid #d5dfdc;border-radius:14px;padding:13px;background:#fff}textarea{min-height:145px;line-height:1.9;font-size:18px}.btn{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px 14px;font-weight:800}.primary{background:var(--a);color:#fff;border-color:var(--a)}.soft{background:var(--s);color:var(--a)}.row{display:flex;gap:8px;flex-wrap:wrap}.facts,.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.fact{border:1px solid var(--l);border-radius:14px;padding:11px;background:#fbfdfc}.fact small{display:block;color:var(--m);font-weight:700}.fact.needsChoice{border-color:#c9dfd8;background:#f7fcfa}.fact.needsChoice>b{color:#8a6a18}.under{font-size:20px;line-height:1.8;font-weight:800}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--s);color:var(--a);font-size:12px;margin:2px}.sec{border-right:4px solid #1c7869;padding-right:12px;margin:17px 0}.sec p{line-height:1.9;margin:0;font-size:16px}.hidden{display:none}.title{font-size:24px;font-weight:900;line-height:1.5}.warn{background:#fff7e3;border:1px solid #eadca9;padding:12px;border-radius:13px}.editbox{margin-top:14px;border-top:1px solid var(--l);padding-top:14px}.fixgroup{margin:12px 0}.fixgroup>small{display:block;color:var(--m);font-weight:800;margin-bottom:7px}.fixchips{display:flex;gap:7px;flex-wrap:wrap}.fixchip{border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700}.fixchip.on{background:var(--s);color:var(--a);border-color:#9fc9be}.naturalFix{margin-top:14px;padding:12px;background:#fbfdfc;border:1px solid var(--l);border-radius:14px}.naturalFix textarea{min-height:82px;font-size:16px}.delta{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4fbf8;border:1px solid #cfe8df}.mini{font-size:13px;color:var(--m)}@media(max-width:620px){.facts,.editgrid{grid-template-columns:1fr}.w{padding:10px}.card{padding:15px}.under{font-size:18px}}
</style></head><body><main class="w"><section class="card"><div class="muted">V9 Understanding Engine Lab</div><h1>ماذا فعلت اليوم؟</h1><p class="muted">اكتب بطريقتك. العامية مقبولة، لكنها لا تدخل التقرير.</p><textarea id="raw" placeholder="سوينا بصمة لطلاب اول متوسط عشان نعرف المتأخرين"></textarea><div style="margin-top:12px"><button class="btn primary" onclick="understand()">افهم ما فعلت</button></div></section><div id="out"></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function norm(s){return String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function has(n,...x){return x.some(v=>n.includes(norm(v)))}
function facts(raw){let n=norm(raw),grade='',stage='',aud='',domain='',type='',purpose='',actionMode='';let m=n.match(/(اول|الأول|ثاني|الثاني|ثالث|الثالث|رابع|الرابع|خامس|الخامس|سادس|السادس)\s*(ابتدائي|متوسط|ثانوي)/);if(m){let o={اول:'الأول',الأول:'الأول',ثاني:'الثاني',الثاني:'الثاني',ثالث:'الثالث',الثالث:'الثالث',رابع:'الرابع',الرابع:'الرابع',خامس:'الخامس',الخامس:'الخامس',سادس:'السادس',السادس:'السادس'},s={ابتدائي:'الابتدائي',متوسط:'المتوسط',ثانوي:'الثانوي'};grade=o[m[1]]+' '+s[m[2]];stage=m[2]}else if(has(n,'ابتدائي'))stage='ابتدائي';else if(has(n,'متوسط'))stage='متوسط';else if(has(n,'ثانوي'))stage='ثانوي';
if(has(n,'طلاب','طالب','الطلاب','الطالبات','عيال','العيال'))aud='الطلاب';else if(has(n,'معلمين','معلمون','معلمات','معلم'))aud='المعلمون';else if(has(n,'اولياء','ولي الامر','الاهالي','الاسر','الاسره'))aud='أولياء الأمور';
if(has(n,'بصمه','غياب','تاخير','متاخر','حضور','انضباط','مواظبه')){domain='الحضور والانضباط';type='إجراء تنظيمي / متابعة';actionMode=has(n,'بصمه','جهاز','الكتروني','نظام')?'electronic':'monitoring';purpose=has(n,'تاخير','متاخر')?'رصد حالات التأخر وتحسين متابعة انتظام الطلاب':has(n,'غياب')?'رصد الغياب وتحسين متابعة انتظام الطلاب':'تعزيز انتظام الطلاب ودعم الانضباط المدرسي'}else if(has(n,'نتائج','درجات','اختبار','متعثر','علاجي','علاج')){domain='التحصيل وتحليل النتائج';type='تحليل نتائج';purpose=has(n,'متعثر','علاجي','علاج')?'تحديد الطلاب المتعثرين وبناء تدخلات علاجية مناسبة':'قراءة مستوى الأداء وتحديد جوانب القوة والفجوات'}else if(has(n,'مجتمع مهني','ورشه','تدريب','تطوير مهني')){domain='التطوير المهني';type='تطوير مهني';purpose='تطوير الممارسة المهنية وتبادل الخبرات'}else if(has(n,'اولياء','ولي الامر','الاهالي')){domain='الشراكة مع الأسرة';type='تواصل أسري';purpose='تعزيز دور الأسرة في دعم تعلم الطلاب ومتابعتهم'}else{domain='عمل مدرسي';type='برنامج / فعالية';purpose='دعم هدف تربوي محدد وتحسين جودة التنفيذ والمتابعة'}return{raw,n,grade,stage,audience:aud,domain,type,purpose,actionMode}}
function understanding(f){if(f.domain==='الحضور والانضباط'){let action=f.actionMode==='electronic'?'فعّلت وسيلة إلكترونية لمتابعة الحضور':'نفذت إجراءً لمتابعة الحضور والغياب';return`فهمت أنك ${action} ${f.audience||'للفئة المستهدفة'}${f.grade?` في ${f.grade}`:''} بهدف ${f.purpose}.`}if(f.domain==='التحصيل وتحليل النتائج')return`فهمت أنك حللت نتائج التقويم${f.grade?` لطلاب ${f.grade}`:''} بهدف ${f.purpose}.`;if(f.type==='تطوير مهني')return`فهمت أنك نفذت نشاطًا للتطوير المهني${f.audience?` يستهدف ${f.audience}`:''} بهدف ${f.purpose}.`;if(f.type==='تواصل أسري')return`فهمت أنك عززت التواصل مع أولياء الأمور بهدف ${f.purpose}.`;return`فهمت أنك نفذت عملًا مدرسيًا منظمًا بهدف ${f.purpose}.`}
function title(f){if(f.domain==='الحضور والانضباط'){let base=f.actionMode==='electronic'?'تفعيل المتابعة الإلكترونية للحضور':'متابعة الحضور والغياب';return f.grade?`${base} لطلاب ${f.grade}`:`${base} والانضباط المدرسي`};if(f.domain==='التحصيل وتحليل النتائج')return has(f.n,'علاجي','علاج')?'تحليل نتائج التقويم وبناء خطة علاجية':'تحليل نتائج التقويم وتحديد أولويات التحسين';if(f.type==='تطوير مهني')return'تنفيذ نشاط تطوير مهني';if(f.type==='تواصل أسري')return'تعزيز الشراكة مع أولياء الأمور';return'توثيق عمل مدرسي'}
function sections(f){if(f.domain==='الحضور والانضباط'){let exec=f.actionMode==='electronic'?`تم تفعيل وسيلة إلكترونية لمتابعة حضور ${f.audience||'الفئة المستهدفة'}${f.grade?` في ${f.grade}`:''}، بما يسهّل الرصد المنتظم ويدعم إجراءات المتابعة المدرسية.`:`تم تنفيذ إجراء منظم لمتابعة الحضور والغياب لدى ${f.audience||'الفئة المستهدفة'}${f.grade?` في ${f.grade}`:''}، بما يدعم رصد حالات الغياب أو التأخر ومتابعتها بصورة منتظمة.`;return[['الهدف','تعزيز الانضباط المدرسي وتحسين متابعة الحضور والغياب من خلال إجراء منظم يدعم دقة الرصد وسرعة المتابعة.'],['التنفيذ',exec],['المتابعة','تتم مراجعة بيانات الحضور والغياب بصورة دورية والاستفادة منها في متابعة الحالات التي تتطلب تدخلًا، وبناء إجراءات تحسين عند الحاجة.']]};if(f.domain==='التحصيل وتحليل النتائج')return[['نطاق التحليل','تم تحليل نتائج التقويم بهدف قراءة مستوى الأداء وتحديد جوانب القوة والفجوات ذات الأولوية.'],['نتائج التحليل',has(f.n,'متعثر')?'تم تحديد الطلاب الذين يحتاجون إلى دعم إضافي تمهيدًا لمعالجة جوانب التعثر لديهم.':'تم تحديد الجوانب التي تتطلب متابعة وتحسين في ضوء النتائج المتاحة.'],['الإجراء والمتابعة',has(f.n,'علاجي','علاج')?'تم بناء إجراء علاجي موجه لمعالجة جوانب التعثر، وتُتابع فاعليته من خلال بيانات لاحقة تقيس مستوى التقدم.':'تُبنى إجراءات التحسين في ضوء نتائج التحليل وتُتابع ببيانات لاحقة.']];if(f.type==='تطوير مهني')return[['الاحتياج المهني','نُفذ النشاط لدعم تطوير الممارسة المهنية وتبادل الخبرات المرتبطة باحتياج فعلي لدى المستفيدين.'],['التنفيذ','تم تنفيذ نشاط مهني منظم يركز على تبادل الممارسات والخبرات القابلة للتطبيق في العمل المدرسي.'],['المتابعة المهنية','تُتابع الاستفادة من خلال المخرجات المهنية وما يطبقه المستفيدون في الممارسة الفعلية.']];if(f.type==='تواصل أسري')return[['الهدف','تعزيز دور الأسرة في متابعة تعلم الطلاب ودعم التكامل بين المدرسة وولي الأمر.'],['التنفيذ','تم التواصل مع أولياء الأمور ومناقشة الجوانب المرتبطة بمتابعة الطلاب بما يعزز المشاركة في العملية التعليمية.'],['المتابعة','تُتابع نتائج التواصل من خلال الاستجابات والإجراءات المتفق عليها وتوثيق المخرجات ذات الصلة.']];return[['الهدف','دعم هدف تربوي محدد من خلال تنفيذ عمل منظم يخدم الفئة المستهدفة.'],['التنفيذ','تم تنفيذ العمل وفق الغرض المحدد وبما يتناسب مع طبيعة المستفيدين والسياق المدرسي.'],['المتابعة','تُستكمل المتابعة من خلال الشواهد والبيانات الناتجة عن التنفيذ.']]}
function inds(f){let a=[];if(f.domain==='الحضور والانضباط'){a.push(['1-2-1-3','إجراءات دعم الانضباط المدرسي','قوي','كشف متابعة الحضور أو تقرير حالات التأخر']);a.push(['3-2-1-5','السلوك والانضباط لدى المتعلمين','فرصة استكمال','بيانات لاحقة تبين تحسن التأخر أو الانضباط'])}if(f.domain==='التحصيل وتحليل النتائج'){a.push(['2-2-1-3','تحليل نتائج التقويم وتوظيفها','قوي','كشف التحليل أو تقرير النتائج والإجراء العلاجي']);if(has(f.n,'علاجي','علاج','متابعه'))a.push(['2-2-1-4','متابعة تقدم المتعلمين','فرصة استكمال','نتيجة متابعة بعد تنفيذ الإجراء'])}if(f.type==='تطوير مهني')a.push(['1-4-1-5','التطوير المهني وفق الاحتياج','قوي','محضر أو منتج تدريبي أو شاهد تطبيق']);return a}
let cur=null;
const TYPES=['إجراء متابعة','تطوير مهني','تحليل نتائج','تواصل أسري','برنامج / فعالية','اجتماع','ممارسة تعليمية'];
const AUDS=['الطلاب','المعلمون','أولياء الأمور','جميع منسوبي المدرسة'];
const STAGES=['ابتدائي','متوسط','ثانوي'];
const GRADES={ابتدائي:['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],متوسط:['الأول المتوسط','الثاني المتوسط','الثالث المتوسط'],ثانوي:['الأول الثانوي','الثاني الثانوي','الثالث الثانوي']};
function chipset(items,current,field){return `<div class="fixchips">${items.map(v=>`<button type="button" class="fixchip ${v===current?'on':''}" onclick="setFix('${field}','${esc(v)}')">${esc(v)}</button>`).join('')}</div>`}
function unresolvedChoices(field,f){if(field==='audience'&&!f.audience)return`<div class="mini" style="margin-top:7px">اختر المستفيدين:</div>${chipset(AUDS,'','audience')}`;if(field==='stage'&&!f.stage)return`<div class="mini" style="margin-top:7px">اختر المرحلة:</div>${chipset(STAGES,'','stage')}`;if(field==='grade'&&!f.grade){if(!f.stage)return`<div class="mini" style="margin-top:7px">اختر المرحلة أولًا، وستظهر الصفوف هنا تلقائيًا.</div>`;return`<div class="mini" style="margin-top:7px">اختر الصف:</div>${chipset(GRADES[f.stage]||[],'','grade')}`}return''}
function factCard(label,value,field,f){let unclear=!value;return`<div class="fact ${unclear?'needsChoice':''}"><small>${label}</small><b>${esc(value||(field==='audience'?'غير واضح':'غير واضحة'))}</b>${unresolvedChoices(field,f)}</div>`}
function renderUnderstand(f){cur=f;let cards=[factCard('نوع العمل',f.type,'type',f),factCard('المستفيدون',f.audience,'audience',f),factCard('المرحلة',f.stage,'stage',f),factCard('الصفوف',f.grade,'grade',f),factCard('الموضوع',f.domain,'domain',f)].join('');let missing=[!f.audience&&!0,!f.stage&&!0,!f.grade&&!0].filter(Boolean).length;return`<section class="card"><div class="muted">هذا ما فهمته</div><div class="under">${esc(understanding(f))}</div><div>${[f.type,f.audience,f.stage,f.grade].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${missing?`<div class="warn" style="margin-top:12px"><b>أحتاج منك ${missing} اختيار${missing>1?'ات':''} فقط.</b> اضغط على الخيارات الظاهرة تحت المعلومات غير الواضحة.</div>`:''}<div class="facts">${cards}</div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="confirmIt()">${missing?'أكمل بعد الاختيار':'صحيح، أكمل'}</button><button class="btn soft" onclick="editIt()">تصحيح شيء فهمته خطأ</button></div><div id="edit" class="hidden editbox"><h3>صحح الجزء الخطأ فقط</h3><div class="mini">هذا القسم للأشياء التي فهمتها ولكن فهمتها بشكل خاطئ. أما "غير واضح" فاختره مباشرة من الأعلى.</div><div class="fixgroup"><small>نوع العمل</small>${chipset(TYPES,f.type,'type')}</div><div class="fixgroup"><small>المستفيدون</small>${chipset(AUDS,f.audience,'audience')}</div><div class="fixgroup"><small>المرحلة</small>${chipset(STAGES,f.stage,'stage')}</div><div class="fixgroup"><small>الصف</small>${chipset(GRADES[f.stage]||[],f.grade,'grade')}</div><div class="naturalFix"><b>أو صححني بطريقتك</b><div class="mini">مثال: المستفيدون هم المعلمون، مو الطلاب.</div><textarea id="naturalCorrection" placeholder="اكتب فقط الشيء الذي فهمته خطأ..."></textarea><button class="btn soft" style="margin-top:8px" onclick="applyNaturalCorrection()">افهم التصحيح</button></div><div id="delta"></div></div></section>`}
function setFix(field,value){let before=cur[field]||'غير محدد';cur={...cur,[field]:value};if(field==='stage'&&cur.grade&&!(GRADES[value]||[]).includes(cur.grade))cur.grade='';$('out').innerHTML=renderUnderstand(cur);let d=$('delta');if(d)d.innerHTML=`<div class="delta">تم تصحيح <b>${esc(field==='type'?'نوع العمل':field==='audience'?'المستفيدين':field==='stage'?'المرحلة':'الصف')}</b>: ${esc(before)} ← <b>${esc(value)}</b></div>`}
function explicitPatch(text){let n=norm(text),p={},f=facts(text);if(has(n,'طلاب','طالب','الطلاب','طالبات','عيال','العيال'))p.audience='الطلاب';else if(has(n,'معلمين','معلمون','معلمات','معلم'))p.audience='المعلمون';else if(has(n,'اولياء','ولي الامر','اهالي','اسر'))p.audience='أولياء الأمور';if(f.stage)p.stage=f.stage;if(f.grade)p.grade=f.grade;if(has(n,'متابعه','اجراء','بصمه','غياب','تاخر','انضباط')){p.type='إجراء متابعة';p.domain='الحضور والانضباط';p.actionMode=has(n,'بصمه','جهاز','الكتروني','نظام')?'electronic':'monitoring'}else if(has(n,'تطوير مهني','ورشه','مجتمع مهني','تدريب'))p.type='تطوير مهني';else if(has(n,'تحليل','درجات','نتائج','اختبار','متعثر'))p.type='تحليل نتائج';else if(has(n,'اولياء','ولي الامر','اهالي'))p.type='تواصل أسري';else if(has(n,'اجتماع','لجنه'))p.type='اجتماع';let gm=text.match(/(?:الهدف|عشان|بهدف)\s+(.+)/i);if(gm&&gm[1].trim().length>4)p.purpose=gm[1].trim().replace(/[.،]+$/,'');return p}
function applyNaturalCorrection(){let t=$('naturalCorrection').value.trim();if(!t)return;let p=explicitPatch(t),changed=[];Object.entries(p).forEach(([k,v])=>{if(v&&cur[k]!==v){changed.push([k,cur[k],v]);cur[k]=v}});$('out').innerHTML=renderUnderstand(cur);$('edit').classList.remove('hidden');let d=$('delta');if(d)d.innerHTML=changed.length?`<div class="delta"><b>عدلت فهمي في ${changed.length} نقطة:</b><br>${changed.map(x=>`${esc(x[1]||'غير محدد')} ← <b>${esc(x[2])}</b>`).join('<br>')}</div>`:`<div class="warn">لم أجد تصحيحًا واضحًا. اختر الجزء مباشرة من الخيارات أعلاه.</div>`}
function renderDoc(f){let ss=sections(f),ii=inds(f);return`<section class="card"><div class="muted">العنوان المهني المقترح</div><div class="title">${esc(title(f))}</div></section><section class="card"><h2>النص المهني</h2>${ss.map(s=>`<div class="sec"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}</section>${ii.length?`<section class="card"><h2>ارتباطات محتملة</h2><div class="warn">لا تعني الارتباطات تحقق المؤشر.</div>${ii.map(i=>`<div class="fact" style="margin-top:9px"><small>${i[2]}</small><b>${i[0]} — ${i[1]}</b><div class="muted">لتقوية التوثيق: ${i[3]}</div></div>`).join('')}</section>`:''}`}
function understand(){let r=$('raw').value.trim();if(!r)return alert('اكتب ما فعلته أولًا');let f=facts(r);$('out').innerHTML=renderUnderstand(f);$('out').scrollIntoView({behavior:'smooth'})}
function confirmIt(){$('out').innerHTML=renderUnderstand(cur)+renderDoc(cur)}
function editIt(){$('edit').classList.toggle('hidden')}
</script></body></html>
