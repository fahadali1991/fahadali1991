<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V9 Understanding Engine — Content V2</title><style>:root{--a:#145e52;--s:#eaf5f1;--l:#dce6e2;--m:#687570;--bg:#f4f7f6;--w:#fff7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17211f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0}.muted{color:var(--m)}textarea,input,button{font:inherit}textarea,input{width:100%;border:1px solid #d5dfdc;border-radius:14px;padding:13px;background:#fff}textarea{min-height:145px;line-height:1.9;font-size:18px}.btn{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px 14px;font-weight:800}.primary{background:var(--a);color:#fff;border-color:var(--a)}.soft{background:var(--s);color:var(--a)}.row{display:flex;gap:8px;flex-wrap:wrap}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.fact{border:1px solid var(--l);border-radius:14px;padding:11px;background:#fbfdfc}.fact small{display:block;color:var(--m);font-weight:700}.fact.needsChoice{border-color:#c9dfd8;background:#f7fcfa}.fact.needsChoice>b{color:#8a6a18}.under{font-size:20px;line-height:1.8;font-weight:800}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--s);color:var(--a);font-size:12px;margin:2px}.sec{border-right:4px solid #1c7869;padding-right:12px;margin:17px 0}.sec p{line-height:1.9;margin:0;font-size:16px}.hidden{display:none}.title{font-size:24px;font-weight:900;line-height:1.5}.warn{background:var(--w);border:1px solid #eadca9;padding:12px;border-radius:13px}.editbox{margin-top:14px;border-top:1px solid var(--l);padding-top:14px}.fixgroup{margin:12px 0}.fixgroup>small{display:block;color:var(--m);font-weight:800;margin-bottom:7px}.fixchips{display:flex;gap:7px;flex-wrap:wrap}.fixchip{border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700}.fixchip.on{background:var(--s);color:var(--a);border-color:#9fc9be}.naturalFix{margin-top:14px;padding:12px;background:#fbfdfc;border:1px solid var(--l);border-radius:14px}.naturalFix textarea{min-height:82px;font-size:16px}.delta{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4fbf8;border:1px solid #cfe8df}.mini{font-size:13px;color:var(--m)}.qbox{margin-top:12px;padding:12px;border:1px solid #cfe4dd;background:#f7fcfa;border-radius:14px}.qbox b{display:block;margin-bottom:8px}.evidence{border:1px dashed #bad2ca;border-radius:14px;padding:12px;background:#fbfdfc;margin-top:12px}.evidence strong{color:var(--a)}details{margin-top:12px;border-top:1px solid var(--l);padding-top:10px}summary{font-weight:800;color:var(--a);cursor:pointer}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:var(--s);color:var(--a)}@media(max-width:620px){.facts{grid-template-columns:1fr}.w{padding:10px}.card{padding:15px}.under{font-size:18px}}</style></head><body><main class="w"><section class="card"><div class="muted">V9 Understanding Engine Lab · Content Generator V2</div><h1>ماذا فعلت اليوم؟</h1><p class="muted">اكتب بطريقتك. كلامك يُستخدم للفهم فقط، ولا يُنسخ إلى التقرير.</p><textarea id="raw" placeholder="مثال: عملت رصد للغياب على مستوى الحصة"></textarea><div style="margin-top:12px"><button class="btn primary" onclick="understand()">افهم ما فعلت</button></div></section><div id="out"></div></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(s){return String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}function has(n,...x){return x.some(v=>n.includes(norm(v)))}function gradeFrom(n){let m=n.match(/(اول|الأول|ثاني|الثاني|ثالث|الثالث|رابع|الرابع|خامس|الخامس|سادس|السادس)\s*(ابتدائي|متوسط|ثانوي)/);if(!m)return{grade:'',stage:has(n,'ابتدائي')?'ابتدائي':has(n,'متوسط')?'متوسط':has(n,'ثانوي')?'ثانوي':''};let o={اول:'الأول',الأول:'الأول',ثاني:'الثاني',الثاني:'الثاني',ثالث:'الثالث',الثالث:'الثالث',رابع:'الرابع',الرابع:'الرابع',خامس:'الخامس',الخامس:'الخامس',سادس:'السادس',السادس:'السادس'},s={ابتدائي:'الابتدائي',متوسط:'المتوسط',ثانوي:'الثانوي'};return{grade:o[m[1]]+' '+s[m[2]],stage:m[2]}}function inferAudience(n,type){if(has(n,'طلاب','طالب','الطلاب','الطالبات','عيال','العيال'))return'الطلاب';if(has(n,'معلمين','معلمون','معلمات','معلم','الهيئه التعليميه'))return'المعلمون';if(has(n,'اولياء','ولي الامر','الاهالي','الاسر','الاسره'))return'أولياء الأمور';if(type==='تطوير مهني')return'المعلمون';if(type==='تحليل نتائج'||type==='إجراء متابعة')return'الطلاب';return''}function facts(raw){let n=norm(raw),g=gradeFrom(n),f={raw,n,grade:g.grade,stage:g.stage,audience:'',domain:'',type:'',purpose:'',actionMode:'',scope:'',topic:'',resultAction:'',meetingPurpose:'',programMode:''};if(has(n,'اجتماع','اجتمعنا','لجنه','محضر','اجتماعنا')){f.domain='الإدارة والمتابعة';f.type='اجتماع / متابعة إدارية';f.meetingPurpose=has(n,'نتائج','درجات','تحصيل')?'مراجعة نتائج':has(n,'مشكل','حل','معالجه')?'حل مشكلة':has(n,'خطه','تخطيط')?'تخطيط':has(n,'متابعه','انجاز','تكليف')?'متابعة':' ';f.purpose=f.meetingPurpose.trim()?({"مراجعة نتائج":'مراجعة النتائج وتحديد الإجراءات المناسبة',"حل مشكلة":'مناقشة المشكلة وتحديد إجراءات المعالجة',"تخطيط":'تنسيق العمل وتحديد خطوات التنفيذ',"متابعة":'متابعة ما تم تنفيذه وتحديد الإجراءات اللاحقة'})[f.meetingPurpose]:'تنسيق العمل وتحديد الإجراء اللاحق'}else if(has(n,'بصمه','غياب','تاخير','متاخر','حضور','انضباط','مواظبه')){f.domain='الحضور والانضباط';f.type='إجراء متابعة';f.actionMode=has(n,'بصمه')?'biometric':has(n,'جهاز','الكتروني','نظام','منصه')?'electronic':'monitoring';f.scope=has(n,'حصه','الحصه','حصص')?'على مستوى الحصة الدراسية':'متابعة الحضور';f.purpose=has(n,'تاخير','متاخر')?'رصد حالات التأخر ودعم المتابعة المبكرة':has(n,'غياب')?'رصد حالات الغياب وتحسين سرعة المتابعة':'تعزيز انتظام الطلاب ودعم الانضباط المدرسي'}else if(has(n,'نتائج','درجات','اختبار','متعثر','علاجي','علاج','تحليل')){f.domain='التحصيل وتحليل النتائج';f.type='تحليل نتائج';f.resultAction=has(n,'متعثر','علاجي','علاج','خطه علاجيه')?'علاجي':has(n,'اثراء','اثرائي','متفوق')?'إثرائي':'';f.purpose=f.resultAction==='علاجي'?'تحديد الطلاب المتعثرين وتوجيه تدخل علاجي مناسب':f.resultAction==='إثرائي'?'تحديد الطلاب المتقدمين وتوجيه فرص إثرائية مناسبة':'قراءة مستوى الأداء وتحديد أولويات التحسين'}else if(has(n,'مجتمع مهني','ورشه','تدريب','تطوير مهني','مجتمع تعلم')){f.domain='التطوير المهني';f.type='تطوير مهني';f.topic=has(n,'خط','قراءه','لغويه')?'الممارسات المرتبطة باللغة العربية':has(n,'تقنيه','رقمي','ذكاء اصطناعي')?'توظيف التقنية في التدريس':'';f.purpose='تطوير الممارسة المهنية وتبادل الخبرات القابلة للتطبيق'}else if(has(n,'برنامج','فعاليه','نشاط','مبادره','مسابقه','حمله')){f.domain='البرامج والأنشطة';f.type='برنامج / فعالية';f.programMode=has(n,'توعوي','توعيه')?'توعوي':has(n,'مسابقه')?'مسابقة':has(n,'حمله')?'حملة':has(n,'نشاط')?'نشاط':'';f.topic=has(n,'خط','قراءه','املاء')?'تنمية مهارة لغوية':has(n,'قيم','وطن','وطنيه')?'القيم والهوية الوطنية':has(n,'سلامه','امن')?'الأمن والسلامة':'';f.purpose=f.topic?`دعم ${f.topic} لدى الفئة المستهدفة`:'تحقيق هدف تربوي محدد من خلال نشاط منظم'}else if(has(n,'اولياء','ولي الامر','الاهالي','الاسر')){f.domain='الشراكة مع الأسرة';f.type='تواصل أسري';f.purpose='تعزيز دور الأسرة في متابعة الطلاب ودعم تعلمهم'}else{f.domain='عمل مدرسي';f.type='برنامج / فعالية';f.purpose='دعم هدف تربوي محدد وتحسين جودة التنفيذ والمتابعة'}f.audience=inferAudience(n,f.type);return f}function understanding(f){let who=f.audience||'الفئة المستهدفة',grade=f.grade?` من ${f.grade}`:'';if(f.type==='إجراء متابعة'){let what=f.actionMode==='biometric'?'فعّلت وسيلة تعتمد على البصمة لمتابعة الحضور':f.actionMode==='electronic'?'فعّلت وسيلة إلكترونية لمتابعة الحضور':'نفذت إجراءً لمتابعة الحضور والغياب';return`فهمت أنك ${what} لدى ${who}${grade}${f.scope?` ${f.scope}`:''} بهدف ${f.purpose}.`}if(f.type==='تحليل نتائج')return`فهمت أنك حللت نتائج تقويم ${who}${grade} بهدف ${f.purpose}.`;if(f.type==='تطوير مهني')return`فهمت أنك نفذت نشاطًا للتطوير المهني يستهدف ${who}${f.topic?` في ${f.topic}`:''} بهدف ${f.purpose}.`;if(f.type==='برنامج / فعالية')return`فهمت أنك نفذت ${f.programMode||'برنامجًا أو فعالية'}${f.topic?` مرتبطة بـ${f.topic}`:''}${f.audience?` تستهدف ${who}`:''} بهدف ${f.purpose}.`;if(f.type==='اجتماع / متابعة إدارية')return`فهمت أنك عقدت اجتماعًا${f.meetingPurpose.trim()?` لغرض ${f.meetingPurpose}`:''} بهدف ${f.purpose}.`;if(f.type==='تواصل أسري')return`فهمت أنك نفذت تواصلًا مع أولياء الأمور بهدف ${f.purpose}.`;return`فهمت أنك نفذت عملًا مدرسيًا منظمًا بهدف ${f.purpose}.`}function title(f){if(f.type==='إجراء متابعة'){let b=f.scope?'رصد الحضور والغياب على مستوى الحصة':'متابعة الحضور والغياب';if(f.actionMode==='biometric')b='تفعيل البصمة لمتابعة الحضور';return f.grade?`${b} لطلاب ${f.grade}`:b}if(f.type==='تحليل نتائج')return f.resultAction==='علاجي'?'تحليل نتائج التقويم وبناء خطة علاجية':f.resultAction==='إثرائي'?'تحليل نتائج التقويم وبناء خطة إثرائية':'تحليل نتائج التقويم وتحديد أولويات التحسين';if(f.type==='تطوير مهني')return f.topic?`تطوير الممارسة المهنية في ${f.topic}`:'تنفيذ نشاط تطوير مهني';if(f.type==='برنامج / فعالية')return f.topic?`${f.programMode||'برنامج'} في ${f.topic}`:'تنفيذ برنامج تربوي';if(f.type==='اجتماع / متابعة إدارية')return f.meetingPurpose.trim()?`اجتماع ${f.meetingPurpose}`:'اجتماع تنسيقي ومتابعة';if(f.type==='تواصل أسري')return'تعزيز الشراكة مع أولياء الأمور';return'توثيق عمل مدرسي'}function professionalSections(f){let who=f.audience||'الفئة المستهدفة',grade=f.grade?` في ${f.grade}`:'';if(f.type==='إجراء متابعة'){let execution=f.scope?`تم تطبيق رصد الحضور والغياب ${f.scope} لدى ${who}${grade}، بحيث تُسجل حالة الحضور بصورة أقرب إلى وقت حدوثها بدل الاكتفاء بالرصد العام على مستوى اليوم الدراسي.`:`تم تنفيذ إجراء منظم لمتابعة حضور ${who}${grade} ورصد حالات الغياب أو التأخر بصورة منتظمة.`;if(f.actionMode==='biometric')execution=`تم تفعيل وسيلة تعتمد على البصمة لمتابعة حضور ${who}${grade}، بما يسهم في توحيد عملية الرصد وتوفير بيانات أكثر انتظامًا للمتابعة.`;else if(f.actionMode==='electronic')execution=`تم تفعيل وسيلة إلكترونية لمتابعة حضور ${who}${grade}، بما يسهم في تنظيم الرصد وتسريع الوصول إلى الحالات التي تتطلب متابعة.`;return[['الهدف',f.scope?'رفع دقة متابعة حضور الطلاب ورصد الغياب على مستوى الحصة الدراسية بما يدعم سرعة اكتشاف الحالات التي تحتاج إلى متابعة.':'تعزيز الانضباط المدرسي وتحسين دقة متابعة الحضور والغياب من خلال إجراء منظم يدعم سرعة الرصد والمتابعة.'],['آلية التنفيذ',execution],['المتابعة','تُراجع الحالات المرصودة بصورة دورية لتحديد الغياب أو التأخر المتكرر، والاستفادة من البيانات في توجيه التدخل أو التواصل المناسب عند الحاجة.']]}if(f.type==='تحليل نتائج'){let results=f.resultAction==='علاجي'?'أظهر التحليل الحاجة إلى توجيه دعم إضافي للطلاب المتعثرين، وتم تحديد الفئة المستهدفة بالتدخل العلاجي دون افتراض مستوى تحسن قبل تنفيذ الخطة.':f.resultAction==='إثرائي'?'أظهر التحليل وجود طلاب يحتاجون إلى فرص إثرائية تتناسب مع مستوى تقدمهم، وتم تحديد الحاجة إلى تنظيم تدخل إثرائي مناسب.':'تمت قراءة النتائج لتحديد أنماط الأداء والجوانب التي تتطلب أولوية في التحسين دون افتراض نتائج لم ترد في البيانات.';let action=f.resultAction==='علاجي'?'بُني إجراء علاجي موجه لمعالجة جوانب التعثر، على أن تُقاس فاعليته لاحقًا بمقارنة بيانات المتابعة بالنتائج السابقة المتاحة.':f.resultAction==='إثرائي'?'بُني إجراء إثرائي موجه للفئة المستهدفة، وتُتابع الاستفادة منه ببيانات لاحقة توضح مستوى التقدم.':'تُحوّل نتائج التحليل إلى إجراءات تحسين محددة، ثم تُراجع بيانات لاحقة للتحقق من التقدم وتعديل الإجراء عند الحاجة.';return[['نطاق التحليل',`تم تحليل نتائج التقويم لدى ${who}${grade} بهدف قراءة مستوى الأداء وتحديد الأولويات التي تستحق التدخل أو المتابعة.`],['قراءة النتائج',results],['الإجراء والتحسين',action]]}if(f.type==='تطوير مهني'){let exec=f.topic?`تم تنفيذ نشاط مهني يركز على ${f.topic}، مع توجيه المحتوى نحو ممارسات قابلة للتطبيق داخل المدرسة وتبادل الخبرات بين المستفيدين.`:`تم تنفيذ نشاط مهني منظم يركز على تبادل الممارسات والخبرات القابلة للتطبيق في العمل المدرسي.`;let tgt=who==='المعلمون'?'المعلمين':who;return[['الاحتياج المهني',`استهدف النشاط دعم تطوير الممارسة المهنية لدى ${tgt} من خلال معالجة احتياج يرتبط بالممارسة الفعلية وتبادل الخبرات القابلة للتوظيف.`],['التنفيذ',exec],['التطبيق والمتابعة','تُتابع الاستفادة من النشاط من خلال المنتج المهني أو ما يطبقه المستفيدون في الممارسة الفعلية، ويُضاف شاهد أثر عند توفر تطبيق أو نتيجة لاحقة.']]}if(f.type==='برنامج / فعالية'){let goal=f.topic?`دعم ${f.topic} لدى ${who} من خلال نشاط منظم يتيح المشاركة والتطبيق بما يتناسب مع طبيعة الفئة المستهدفة.`:`تحقيق هدف تربوي محدد لدى ${who} من خلال برنامج منظم يرتبط باحتياج أو أولوية مدرسية واضحة.`;let exec=f.programMode?`تم تنفيذ ${f.programMode==='مسابقة'?'مسابقة':f.programMode==='حملة'?'حملة':f.programMode==='توعوي'?'برنامج توعوي':'نشاط'} موجهة إلى ${who}${grade}${f.topic?` حول ${f.topic}`:''}، مع تنظيم التنفيذ بما يتيح مشاركة الفئة المستهدفة وفق طبيعة البرنامج.`:`تم تنفيذ البرنامج لدى ${who}${grade} وفق الغرض التربوي المحدد، مع تنظيم المشاركة بما يتناسب مع طبيعة الفئة المستهدفة.`;return[['الهدف',goal],['التنفيذ',exec],['المتابعة','تُراجع الشواهد والمخرجات الناتجة عن التنفيذ لتحديد مستوى المشاركة وما إذا كانت هناك حاجة إلى استكمال أو إجراء لاحق، دون افتراض تحقق أثر لم يتم قياسه.']]}if(f.type==='اجتماع / متابعة إدارية'){let purpose=f.meetingPurpose.trim()?f.meetingPurpose:'تنسيق العمل';let body=purpose==='مراجعة نتائج'?'عُقد الاجتماع لمراجعة النتائج ومناقشة ما تشير إليه من أولويات، وتحديد الإجراءات التي تتطلب متابعة أو تدخلًا.':purpose==='حل مشكلة'?'عُقد الاجتماع لتحديد أبعاد المشكلة ومناقشة البدائل الممكنة وتوزيع الإجراءات اللازمة لمعالجتها.':purpose==='تخطيط'?'عُقد الاجتماع لتحديد الأولويات وتنظيم خطوات التنفيذ وتوزيع الأدوار اللازمة للمرحلة القادمة.':purpose==='متابعة'?'عُقد الاجتماع لمراجعة ما تم إنجازه ومناقشة ما تبقى من أعمال وتحديد الإجراءات اللاحقة.':'عُقد الاجتماع لتنسيق العمل وتحديد ما يلزم من إجراءات ومتابعة.';return[['غرض الاجتماع',body],['محاور العمل',`تركزت المناقشة على ${f.purpose}، مع توجيه الحوار نحو القرارات والإجراءات القابلة للتنفيذ دون إضافة تفاصيل لم تُذكر في وصف العمل.`],['الإجراء والمتابعة','تُتابع القرارات والتكليفات وفق ما يتم اعتماده، ويُوثق الإنجاز أو المخرج الناتج عن كل إجراء عند توفره.']]}if(f.type==='تواصل أسري')return[['الهدف','تعزيز التكامل بين المدرسة والأسرة بما يدعم متابعة الطلاب ويجعل التواصل مرتبطًا باحتياج واضح في التعلم أو الانضباط أو المتابعة.'],['التنفيذ','تم التواصل مع أولياء الأمور ومناقشة الجوانب التي تتطلب متابعة، مع توضيح ما يحتاج إلى تعاون أو إجراء مشترك بين المدرسة والأسرة.'],['المتابعة','تُراجع الاستجابات والإجراءات المتفق عليها، ويُوثق ما ينتج عن التواصل من متابعة أو تحسن عندما تتوفر بيانات تدعم ذلك.']];return[['الهدف','دعم هدف تربوي محدد من خلال تنفيذ عمل منظم يخدم الفئة المستهدفة.'],['التنفيذ','تم تنفيذ العمل وفق الغرض المحدد وبما يتناسب مع طبيعة المستفيدين والسياق المدرسي.'],['المتابعة','تُستكمل المتابعة من خلال الشواهد والبيانات الناتجة عن التنفيذ دون افتراض نتائج لم يتم قياسها.']]}function evidenceAdvice(f){if(f.type==='إجراء متابعة')return f.scope?'أفضل شاهد الآن: كشف حضور/غياب على مستوى الحصة أو سجل متابعة يوضح الحالات المرصودة.':'أفضل شاهد الآن: كشف حضور/غياب أو تقرير متابعة للحالات.';if(f.type==='تحليل نتائج')return f.resultAction==='علاجي'?'أفضل شاهد الآن: تقرير تحليل النتائج + الخطة العلاجية. ولتقوية الأثر لاحقًا: نتيجة متابعة بعد تنفيذ الخطة.':'أفضل شاهد الآن: تقرير تحليل النتائج أو كشف التحليل مع الإجراء الناتج عنه.';if(f.type==='تطوير مهني')return'أفضل شاهد الآن: محضر أو كشف حضور أو منتج تدريبي. ولإثبات الأثر لاحقًا: شاهد تطبيق في الممارسة.';if(f.type==='برنامج / فعالية')return'أفضل شاهد الآن: صور التنفيذ أو كشف مشاركة أو منتج النشاط. ويضاف قياس أثر فقط إذا كان موجودًا فعلًا.';if(f.type==='اجتماع / متابعة إدارية')return'أفضل شاهد الآن: محضر الاجتماع والقرارات أو التكليفات، ثم شاهد إنجاز للإجراء المتابع.';if(f.type==='تواصل أسري')return'أفضل شاهد الآن: سجل التواصل أو محضر اللقاء أو ما يثبت الإجراء المتفق عليه.';return'أضف شاهدًا يثبت التنفيذ الفعلي للعمل.'}function indicatorLinks(f){let a=[];if(f.type==='إجراء متابعة'&&f.domain==='الحضور والانضباط'){a.push(['1-2-1-3','إجراءات دعم الانضباط المدرسي','قوي']);a.push(['3-2-1-5','السلوك والانضباط لدى المتعلمين','يحتاج أثر'])}if(f.type==='تحليل نتائج'){a.push(['2-2-1-3','تحليل نتائج التقويم وتوظيفها','قوي']);if(f.resultAction)a.push(['2-2-1-4','متابعة تقدم المتعلمين','يحتاج متابعة'])}if(f.type==='تطوير مهني')a.push(['1-4-1-5','التطوير المهني وفق الاحتياج','قوي']);return a}function requiredQuestions(f){let q=[];if(f.type==='برنامج / فعالية'&&!f.audience)q.push({field:'audience',label:'لمن نُفذ البرنامج؟',items:['الطلاب','المعلمون','أولياء الأمور','جميع منسوبي المدرسة']});if(f.type==='اجتماع / متابعة إدارية'&&!f.meetingPurpose.trim())q.push({field:'meetingPurpose',label:'ما الغرض الأساسي من الاجتماع؟',items:['متابعة','تخطيط','حل مشكلة','مراجعة نتائج']});return q.slice(0,2)}let cur=null;const TYPES=['إجراء متابعة','تطوير مهني','تحليل نتائج','برنامج / فعالية','اجتماع / متابعة إدارية','تواصل أسري','ممارسة تعليمية'];const AUDS=['الطلاب','المعلمون','أولياء الأمور','جميع منسوبي المدرسة'];const STAGES=['ابتدائي','متوسط','ثانوي'];const GRADES={ابتدائي:['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],متوسط:['الأول المتوسط','الثاني المتوسط','الثالث المتوسط'],ثانوي:['الأول الثانوي','الثاني الثانوي','الثالث الثانوي']};function chipset(items,current,field){return `<div class="fixchips">${items.map(v=>`<button type="button" class="fixchip ${v===current?'on':''}" onclick="setFix('${field}','${esc(v)}')">${esc(v)}</button>`).join('')}</div>`}function unresolvedChoices(field,f){if(field==='audience'&&!f.audience&&f.type==='برنامج / فعالية')return`<div class="mini" style="margin-top:7px">اختر المستفيدين:</div>${chipset(AUDS,'','audience')}`;return''}function factCard(label,value,field,f){let unclear=!value&&field==='audience'&&f.type==='برنامج / فعالية';return`<div class="fact ${unclear?'needsChoice':''}"><small>${label}</small><b>${esc(value||(field==='audience'?'غير واضح':'غير محدد'))}</b>${unresolvedChoices(field,f)}</div>`}function questionHTML(q){return`<div class="qbox"><b>${esc(q.label)}</b>${chipset(q.items,cur[q.field]||'',q.field)}</div>`}function renderUnderstand(f){cur=f;let cards=[factCard('نوع العمل',f.type,'type',f),factCard('المستفيدون',f.audience,'audience',f),factCard('المرحلة',f.stage,'stage',f),factCard('الصفوف',f.grade,'grade',f),factCard('الموضوع',f.domain,'domain',f)].join('');let qs=requiredQuestions(f);return`<section class="card"><div class="muted">هذا ما فهمته</div><div class="under">${esc(understanding(f))}</div><div>${[f.type,f.audience,f.stage,f.grade].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="facts">${cards}</div>${qs.map(questionHTML).join('')}<div class="row" style="margin-top:14px"><button class="btn primary" onclick="confirmIt()">${qs.length?'أكمل بعد الاختيار':'صحيح، أكمل'}</button><button class="btn soft" onclick="editIt()">تصحيح شيء فهمته خطأ</button></div><div id="edit" class="hidden editbox"><h3>صحح الجزء الخطأ فقط</h3><div class="mini">لا تحتاج لمراجعة كل شيء؛ غيّر الجزء الذي فهمته خطأ فقط.</div><div class="fixgroup"><small>نوع العمل</small>${chipset(TYPES,f.type,'type')}</div><div class="fixgroup"><small>المستفيدون</small>${chipset(AUDS,f.audience,'audience')}</div><div class="fixgroup"><small>المرحلة</small>${chipset(STAGES,f.stage,'stage')}</div><div class="fixgroup"><small>الصف</small>${chipset(GRADES[f.stage]||[],f.grade,'grade')}</div><div class="naturalFix"><b>أو صححني بطريقتك</b><textarea id="naturalCorrection" placeholder="مثال: المستفيدون هم المعلمون، مو الطلاب"></textarea><button class="btn soft" style="margin-top:8px" onclick="applyNaturalCorrection()">افهم التصحيح</button></div><div id="delta"></div></div></section>`}function rebuildMeaningAfterFix(field){if(field==='meetingPurpose'){cur.purpose=({"مراجعة نتائج":'مراجعة النتائج وتحديد الإجراءات المناسبة',"حل مشكلة":'مناقشة المشكلة وتحديد إجراءات المعالجة',"تخطيط":'تنسيق العمل وتحديد خطوات التنفيذ',"متابعة":'متابعة ما تم تنفيذه وتحديد الإجراءات اللاحقة'})[cur.meetingPurpose]||cur.purpose}}function setFix(field,value){let before=cur[field]||'غير محدد';cur={...cur,[field]:value};if(field==='stage'&&cur.grade&&!(GRADES[value]||[]).includes(cur.grade))cur.grade='';rebuildMeaningAfterFix(field);$('out').innerHTML=renderUnderstand(cur);let d=$('delta');if(d)d.innerHTML=`<div class="delta">تم تصحيح <b>${esc(field)}</b>: ${esc(before)} ← <b>${esc(value)}</b></div>`}function explicitPatch(text){let n=norm(text),p={},f=facts(text);if(f.audience)p.audience=f.audience;if(f.stage)p.stage=f.stage;if(f.grade)p.grade=f.grade;if(has(n,'متابعه','اجراء','غياب','تاخر','انضباط')){p.type='إجراء متابعة';p.domain='الحضور والانضباط'}else if(has(n,'تطوير مهني','ورشه','مجتمع مهني','تدريب')){p.type='تطوير مهني';p.domain='التطوير المهني'}else if(has(n,'تحليل','درجات','نتائج','اختبار','متعثر')){p.type='تحليل نتائج';p.domain='التحصيل وتحليل النتائج'}else if(has(n,'اجتماع','لجنه')){p.type='اجتماع / متابعة إدارية';p.domain='الإدارة والمتابعة'}if(has(n,'مراجعه نتائج'))p.meetingPurpose='مراجعة نتائج';else if(has(n,'حل مشكله'))p.meetingPurpose='حل مشكلة';else if(has(n,'تخطيط'))p.meetingPurpose='تخطيط';else if(has(n,'متابعه'))p.meetingPurpose='متابعة';return p}function applyNaturalCorrection(){let t=$('naturalCorrection').value.trim();if(!t)return;let p=explicitPatch(t),changed=[];Object.entries(p).forEach(([k,v])=>{if(v&&cur[k]!==v){changed.push([k,cur[k],v]);cur[k]=v}});if(p.meetingPurpose)rebuildMeaningAfterFix('meetingPurpose');$('out').innerHTML=renderUnderstand(cur);$('edit').classList.remove('hidden');let d=$('delta');if(d)d.innerHTML=changed.length?`<div class="delta"><b>عدلت فهمي في ${changed.length} نقطة.</b></div>`:`<div class="warn">لم أجد تصحيحًا واضحًا. اختر الجزء مباشرة من الخيارات.</div>`}function renderDoc(f){let ss=professionalSections(f),links=indicatorLinks(f);return`<section class="card"><div class="muted">العنوان المهني المقترح</div><div class="title">${esc(title(f))}</div></section><section class="card"><h2>النص المهني</h2>${ss.map(s=>`<div class="sec"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}<div class="evidence"><strong>الشاهد الأنسب</strong><div>${esc(evidenceAdvice(f))}</div></div>${links.length?`<details><summary>عرض الارتباطات المحتملة (${links.length})</summary>${links.map(i=>`<div class="fact" style="margin-top:8px"><small><span class="status">${esc(i[2])}</span></small><b>${esc(i[0])} — ${esc(i[1])}</b></div>`).join('')}<div class="mini" style="margin-top:8px">الارتباط لا يعني تحقق المؤشر، خصوصًا مؤشرات الأثر.</div></details>`:''}</section>`}function understand(){let r=$('raw').value.trim();if(!r)return alert('اكتب ما فعلته أولًا');cur=facts(r);$('out').innerHTML=renderUnderstand(cur);$('out').scrollIntoView({behavior:'smooth'})}function confirmIt(){let qs=requiredQuestions(cur);if(qs.length){alert('أكمل الاختيار القصير أولًا.');return}$('out').innerHTML=renderUnderstand(cur)+renderDoc(cur)}function editIt(){$('edit').classList.toggle('hidden')}</script></body></html>
