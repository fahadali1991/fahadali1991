<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك الوثائق المدرسية الذكي V5.9</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>html,body{margin:0;height:100%;font-family:Arial,Tahoma,sans-serif;background:#f5f7f8}#app{border:0;width:100%;height:100vh;display:block}#overlay{display:none;position:fixed;inset:0;background:#0008;z-index:999999;align-items:center;justify-content:center;padding:12px}#box{background:#fff;border-radius:18px;width:min(930px,100%);max-height:94vh;overflow:auto;box-shadow:0 16px 50px #0004}#head{position:sticky;top:0;background:#fff;border-bottom:1px solid #dfe5e8;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:2}#body{padding:14px}.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}.primary{background:#07A869;color:#fff}.secondary{background:#eef6f8;color:#15445A}.tag{display:inline-block;background:#eef6f8;color:#15445A;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.sec{border:1px solid #dfe5e8;border-right:4px solid #07A869;border-radius:12px;padding:11px;margin:9px 0}.sec h4{margin:0 0 7px;color:#15445A}.muted{color:#68707a}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{border:1px solid #dfe5e8;border-radius:10px;padding:6px}.thumb img{width:100%;height:140px;object-fit:cover;border-radius:7px}.status{margin:10px 0;padding:11px;border:1px solid #dfe5e8;border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#render{position:fixed;left:-12000px;top:0;width:794px;background:#fff}.error{border-color:#d99;background:#fff5f5;color:#822}@media(max-width:600px){.thumbs{grid-template-columns:1fr 1fr}#head{align-items:flex-start}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body>
<iframe id="app" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v5-5-stable.html"></iframe>
<div id="overlay"><div id="box"><div id="head"><div><b>عرض الوثيقة</b><div class="muted" style="font-size:12px">V5.9 — فتح مباشر من الأرشيف</div></div><button class="btn secondary" id="close">✕ إغلاق</button></div><div id="body"></div></div></div><div id="render"></div>
<script>(function(){'use strict';var TYPES={program:'تقرير برنامج/فعالية',meeting:'محضر اجتماع',plan:'خطة عمل',training:'تقرير تطوير مهني',analysis:'تحليل نتائج',lesson:'تقرير ممارسة تعليمية',partnership:'تقرير شراكة/أسرة',safety:'تقرير أمن وسلامة'};var frame=document.getElementById('app'),overlay=document.getElementById('overlay'),body=document.getElementById('body'),render=document.getElementById('render');function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function getDoc(id){return new Promise(function(resolve,reject){var r=indexedDB.open('schoolDocsV53',1);r.onsuccess=function(){var db=r.result;if(!db.objectStoreNames.contains('docs'))return reject(new Error('الأرشيف غير موجود'));var q=db.transaction('docs').objectStore('docs').get(id);q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}};r.onerror=function(){reject(r.error)}})}function fileUrl(f){try{return URL.createObjectURL(f)}catch(e){return''}}function showDoc(d){var imgs=(d.files||[]).filter(function(f){return f&&f.type&&f.type.indexOf('image/')===0});body.innerHTML='<div><span class="tag">'+esc(TYPES[d.type]||'وثيقة')+'</span><h2 style="margin:8px 0 4px">'+esc(d.title||'وثيقة')+'</h2><div class="muted">'+esc(d.schoolName||'')+' · '+esc(d.eduOffice||'')+'</div></div><div style="margin-top:8px"><span class="tag">التاريخ: '+esc(d.date||'-')+'</span><span class="tag">المدة: '+esc(d.duration||'-')+'</span><span class="tag">المستفيد: '+esc(d.beneficiary||'-')+'</span><span class="tag">العدد: '+(d.count||0)+'</span><span class="tag">المسؤول: '+esc(d.owner||'-')+'</span></div><div class="actions"><button class="btn primary" id="pdfBtn">📄 إنشاء PDF / طباعة</button><label class="btn secondary"><input type="checkbox" id="withImgs" checked> تضمين الصور</label></div><div id="pdfState"></div>'+(d.sections||[]).map(function(s){return'<div class="sec"><h4>'+esc(s.title||'قسم')+'</h4><div style="white-space:pre-wrap;line-height:1.8">'+esc(s.body||'')+'</div></div>'}).join('')+(imgs.length?'<div class="sec"><h4>الصور المحفوظة</h4><div class="thumbs">'+imgs.map(function(f){return'<div class="thumb"><img src="'+fileUrl(f)+'"><div style="font-size:11px;margin-top:4px">'+esc(f.name||'صورة')+'</div></div>'}).join('')+'</div></div>':'');document.getElementById('pdfBtn').onclick=function(){createPdf(d)};overlay.style.display='flex'}async function openDoc(id){try{var d=await getDoc(id);if(!d)throw new Error('لم يتم العثور على التقرير');showDoc(d)}catch(e){alert('تعذر فتح التقرير: '+(e.message||e))}}function fileData(f){return new Promise(function(resolve){try{var r=new FileReader();r.onload=function(){resolve({name:f.name||'صورة',src:r.result})};r.onerror=function(){resolve(null)};r.readAsDataURL(f)}catch(e){resolve(null)}})}async function createPdf(d){var st=document.getElementById('pdfState'),btn=document.getElementById('pdfBtn');st.innerHTML='<div class="status">⏳ جاري إنشاء PDF…</div>';btn.disabled=true;try{if(typeof html2pdf==='undefined')throw new Error('تعذر تحميل محرك PDF');var want=document.getElementById('withImgs').checked,imgs=[];if(want){var files=(d.files||[]).filter(function(f){return f&&f.type&&f.type.indexOf('image/')===0});imgs=(await Promise.all(files.map(fileData))).filter(Boolean)}render.innerHTML='';var node=document.createElement('div');node.className='pdfdoc';node.style.cssText='direction:rtl;width:794px;background:#fff;padding:22px;font-family:Arial,Tahoma,sans-serif;color:#17202a';var sec=(d.sections||[]).map(function(s){return'<section class="psec"><h3>'+esc(s.title||'قسم')+'</h3><div>'+esc(s.body||'').split('\n').join('<br>')+'</div></section>'}).join('');var pics=imgs.length?'<h3 class="evh">الشواهد المصورة</h3><div class="pimgs">'+imgs.map(function(i){return'<figure><img src="'+i.src+'"><figcaption>'+esc(i.name)+'</figcaption></figure>'}).join('')+'</div>':'';node.innerHTML='<style>.pdfdoc *{box-sizing:border-box}.bar{height:7px;background:linear-gradient(90deg,#07A869,#3D7EB9,#0DA9A6,#15445A,#C1B48A);margin-bottom:8px}.phead{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:8px;border-bottom:2px solid #15445A;padding-bottom:8px}.center{text-align:center}.left{text-align:left}.moe{font-size:14px;font-weight:700;color:#15445A}.school{font-size:18px;font-weight:800;color:#07A869}.sub{font-size:10px;color:#68707a}.ptitle{background:#eef6f8;border:1px solid #d6e4ea;border-radius:9px;padding:8px 10px;margin:9px 0;font-size:16px;font-weight:800;color:#15445A}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.meta div{border:1px solid #dfe5e8;border-radius:7px;padding:5px 6px;font-size:10px}.psec{border:1px solid #dfe5e8;border-right:5px solid #07A869;border-radius:8px;padding:8px 10px;margin:5px 0;break-inside:avoid-page}.psec h3{margin:0 0 4px;font-size:13px;color:#15445A}.psec div{font-size:11.5px;line-height:1.6}.evh{font-size:13px;color:#15445A;border-bottom:1px solid #dfe5e8;padding-bottom:4px}.pimgs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.pimgs figure{margin:0;border:1px solid #dfe5e8;border-radius:8px;padding:5px;break-inside:avoid}.pimgs img{width:100%;height:160px;object-fit:cover;border-radius:5px}.pimgs figcaption{font-size:9px;margin-top:3px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:10px;padding-top:9px;border-top:1px dashed #c8d2d8;font-size:10px}</style><div class="bar"></div><div class="phead"><div><div class="moe">وزارة التعليم</div><div class="sub">المملكة العربية السعودية</div></div><div class="center"><div class="school">'+esc(d.schoolName||'اسم المدرسة')+'</div><div class="sub">'+esc(d.eduOffice||'إدارة التعليم')+'</div></div><div class="left"><div class="moe">'+esc(TYPES[d.type]||'وثيقة مدرسية')+'</div><div class="sub">نسخة PDF</div></div></div><div class="ptitle">'+esc(d.title||'وثيقة')+'</div><div class="meta"><div><b>التاريخ:</b> '+esc(d.date||'-')+'</div><div><b>المدة:</b> '+esc(d.duration||'-')+'</div><div><b>المستفيد:</b> '+esc(d.beneficiary||'-')+'</div><div><b>العدد:</b> '+(d.count||0)+'</div><div><b>المسؤول:</b> '+esc(d.owner||'-')+'</div><div><b>إعداد:</b> '+esc(d.preparedBy||'-')+'</div><div><b>المدير:</b> '+esc(d.principalName||'-')+'</div><div><b>المرفقات:</b> '+((d.files||[]).length)+'</div></div>'+sec+pics+'<div class="sign"><div><b>إعداد الوثيقة</b><br>'+esc(d.preparedBy||'........................')+'</div><div><b>اعتماد مدير المدرسة</b><br>'+esc(d.principalName||'........................')+'</div></div>';render.appendChild(node);var name=(d.title||'وثيقة').replace(/[\\/:*?"<>|]/g,'-')+'.pdf';var blob=await html2pdf().set({margin:[5,5,5,5],filename:name,image:{type:'jpeg',quality:.92},html2canvas:{scale:1.35,useCORS:true,backgroundColor:'#fff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}}).from(node).outputPdf('blob');var url=URL.createObjectURL(blob);st.innerHTML='<div class="status"><b style="color:#07A869">✅ تم إنشاء PDF</b><div class="muted" style="margin:6px 0">افتح الملف ثم استخدم مشاركة Safari للطباعة، أو احفظه مباشرة.</div><a class="btn primary" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+url+'">فتح PDF</a> <a class="btn secondary" style="text-decoration:none;display:inline-block" download="'+esc(name)+'" href="'+url+'">حفظ PDF</a></div>'}catch(e){st.innerHTML='<div class="status error">تعذر إنشاء PDF: '+esc(e.message||e)+'</div>'}finally{btn.disabled=false}}function patch(){try{var doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',function(e){var open=e.target.closest&&e.target.closest('[data-open]');if(open){e.preventDefault();e.stopImmediatePropagation();openDoc(open.dataset.open);return}var print=e.target.closest&&e.target.closest('[data-print]');if(print){e.preventDefault();e.stopImmediatePropagation();openDoc(print.dataset.print)}},true);var mo=new MutationObserver(function(){doc.querySelectorAll('[data-open]').forEach(function(b){b.textContent='فتح التقرير'});doc.querySelectorAll('[data-print]').forEach(function(b){b.textContent='📄 PDF / طباعة'})});mo.observe(doc.documentElement,{childList:true,subtree:true})}catch(e){console.error(e)}}frame.addEventListener('load',patch);document.getElementById('close').onclick=function(){overlay.style.display='none'};})();</script></body></html>
