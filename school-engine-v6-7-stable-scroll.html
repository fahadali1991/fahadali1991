<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.7</title><style>html,body{margin:0;height:100%;background:#f5f7f8;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-6-grounded-content.html"></iframe><script>(function(){'use strict';const base=document.getElementById('base');function deep(f){try{let d=f.contentDocument;if(!d)return null;let fs=[...d.querySelectorAll('iframe')];if(!fs.length)return f;for(let x of fs){let r=deep(x);if(r)return r}return f}catch(e){return null}}function patch(){let f=deep(base);if(!f)return;try{let d=f.contentDocument;if(!d)return;if(!d.getElementById('v67style')){let s=d.createElement('style');s.id='v67style';s.textContent=`html,body{overflow-anchor:none!important}dialog .db{overflow-anchor:none!important;padding-bottom:92px!important}#sections .v66sec textarea,#sections textarea{height:260px!important;min-height:260px!important;max-height:260px!important;overflow-y:auto!important;resize:vertical!important;-webkit-overflow-scrolling:touch!important;font-size:18px!important;line-height:1.9!important}.v66field textarea{height:130px!important;min-height:130px!important;max-height:180px!important;overflow-y:auto!important;resize:vertical!important}.v67savewrap{position:sticky!important;bottom:-16px!important;z-index:90!important;background:linear-gradient(to top,#fff 78%,rgba(255,255,255,.92),rgba(255,255,255,0))!important;padding:24px 0 10px!important;margin-top:10px!important}.v67savewrap button{width:100%!important;min-height:54px!important;font-size:17px!important;font-weight:800!important;box-shadow:0 5px 18px rgba(0,0,0,.12)!important}@media(max-width:600px){#sections .v66sec textarea,#sections textarea{height:280px!important;min-height:280px!important;max-height:280px!important;font-size:18px!important;line-height:1.95!important}.v66field textarea{height:140px!important;min-height:140px!important;max-height:170px!important}.v67savewrap{bottom:-16px!important}}`;d.head.appendChild(s)}let form=d.getElementById('form');if(form){let submit=form.querySelector('button[type="submit"]');if(submit&&!submit.closest('.v67savewrap')){let oldParent=submit.parentElement;let wrap=d.createElement('div');wrap.className='full v67savewrap';oldParent.insertBefore(wrap,submit);wrap.appendChild(submit);if(oldParent!==wrap&&oldParent.children.length===0)oldParent.remove()}}[...d.querySelectorAll('#sections textarea')].forEach(t=>{t.style.setProperty('height','280px','important');t.style.setProperty('max-height','280px','important');t.style.setProperty('overflow-y','auto','important')})}catch(e){console.error(e)}}base.addEventListener('load',()=>setTimeout(patch,1500));setInterval(patch,500)})();</script></body></html>
