<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.5</title><style>html,body{margin:0;height:100%;background:#f5f7f8}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-2-smart-flow.html"></iframe><script>(function(){'use strict';const base=document.getElementById('base');const TYPES={program:'تقرير برنامج / فعالية',meeting:'محضر اجتماع',plan:'خطة عمل',training:'تقرير تطوير مهني',analysis:'تحليل نتائج',lesson:'تقرير ممارسة تعليمية',partnership:'تقرير شراكة / أسرة',safety:'تقرير أمن وسلامة'};const LOGO='https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.svg/512px-Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.svg.png';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function deepestFrame(f){try{let d=f.contentDocument;if(!d)return null;let fs=[...d.querySelectorAll('iframe')];if(!fs.length)return f;for(let x of fs){let r=deepestFrame(x);if(r)return r}return f}catch(e){return null}}function dbGet(id){return new Promise((res,rej)=>{let r=indexedDB.open('schoolDocsV53Print',1);r.onsuccess=()=>{let db=r.result;if(!db.objectStoreNames.contains('docs'))return rej(new Error('الأرشيف غير موجود'));let q=db.transaction('docs').objectStore('docs').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)};r.onerror=()=>rej(r.error)})}function imgData(files){return Promise.all((files||[]).filter(f=>f.type&&f.type.startsWith('image/')).map(f=>new Promise(resolve=>{let fr=new FileReader();fr.onload=()=>resolve({name:f.name||'صورة',src:fr.result});fr.onerror=()=>resolve(null);fr.readAsDataURL(f)}))).then(a=>a.filter(Boolean))}function printHTML(d,imgs){let owner=d.owner||'-',type=TYPES[d.type]||'وثيقة مدرسية',school=d.schoolName||'اسم المدرسة',office=d.eduOffice||'إدارة التعليم';let secs=(d.sections||[]).map((s,i)=>`<section class="sec"><div class="sh"><span>${i+1}</span><h2>${esc(s.title)}</h2></div><div class="sb">${esc(s.body).replace(/\n/g,'<br>')}</div></section>`).join('');let photos=imgs.length?`<section class="photos"><h2>الشواهد المصورة</h2><div class="pg">${imgs.map(i=>`<figure><div class="pw"><img src="${i.src}"></div><figcaption>${esc(i.name)}</figcaption></figure>`).join('')}</div></section>`:'';return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(d.title||type)}</title><style>@page{size:A4;margin:12mm 13mm}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#1c3039;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top{height:5px;background:linear-gradient(90deg,#07A869,#0DA9A6,#3D7EB9,#15445A);margin-bottom:12px}.head{display:grid;grid-template-columns:145px 1fr 125px;gap:14px;align-items:center;padding-bottom:11px;border-bottom:1.5px solid #d6e1e5}.logo{display:flex;align-items:center;height:72px}.logo img{max-width:138px;max-height:68px;object-fit:contain}.school{text-align:center}.school b{display:block;font-size:18pt;color:#15445A}.school small{font-size:11pt;color:#66757d}.mark{text-align:left;font-size:9.5pt;color:#6f7c82}.mark b{display:block;color:#15445A;font-size:10.5pt}.id{text-align:center;padding:15px 6px 10px}.type{display:inline-block;font-size:11.5pt;font-weight:700;color:#3D7EB9;border-bottom:2px solid #0DA9A6;padding:4px 14px;margin-bottom:9px}.title{margin:0;font-size:22pt;line-height:1.4;color:#123442;font-weight:900;text-align:center}.meta{margin:11px 0 16px;border:1px solid #d7e2e6;border-radius:12px;overflow:hidden;background:#fbfcfc}.r{display:grid;grid-template-columns:repeat(3,1fr)}.r.r2{grid-template-columns:1fr 2fr;border-top:1px solid #e1e8eb}.mi{padding:10px 12px;min-height:54px;border-left:1px solid #e1e8eb}.mi:last-child{border-left:0}.lab{display:block;font-size:10pt;color:#6b7880;font-weight:700;margin-bottom:3px}.val{display:block;font-size:12pt;color:#183846;font-weight:800}.sec{margin:0 0 13px;break-inside:avoid-page}.sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sh span{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#eaf7f2;color:#078257;font-size:10pt;font-weight:800}.sh h2{margin:0;font-size:14.5pt;color:#15445A}.sh:after{content:"";height:1px;background:#d9e3e7;flex:1}.sb{font-size:13pt;line-height:1.78;padding:2px 34px 4px 4px;color:#263940}.photos{margin-top:16px}.photos>h2{font-size:14.5pt;color:#15445A;border-right:5px solid #07A869;padding-right:9px}.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}figure{margin:0;border:1px solid #dce5e8;border-radius:10px;padding:7px;break-inside:avoid-page}.pw{height:190px;display:flex;align-items:center;justify-content:center;background:#f8fafb;border-radius:7px}.pw img{width:100%;height:100%;object-fit:contain}figcaption{text-align:center;font-size:9pt;color:#6e7a80;margin-top:5px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:24px;padding-top:14px;border-top:1px solid #d8e1e5;break-inside:avoid-page}.sig{text-align:center;min-height:82px}.sig label{display:block;font-size:10.5pt;color:#6a777d;font-weight:700}.sig b{display:block;font-size:12.5pt;color:#173744;margin-top:6px}.line{width:70%;border-bottom:1px dotted #9ca9af;margin:28px auto 0}.foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:7px;border-top:1px solid #edf1f2;font-size:8.5pt;color:#8a959a}</style></head><body><div class="top"></div><header class="head"><div class="logo"><img src="${LOGO}" alt="شعار وزارة التعليم" onerror="this.style.display='none';this.parentNode.innerHTML='<b style=&quot;color:#15445A;font-size:13pt&quot;>وزارة التعليم</b>'"></div><div class="school"><b>${esc(school)}</b><small>${esc(office)}</small></div><div class="mark"><b>التوثيق المدرسي</b>وثيقة مهيأة للاعتماد والطباعة</div></header><div class="id"><div class="type">${esc(type)}</div><h1 class="title">${esc(d.title||type)}</h1></div><section class="meta"><div class="r"><div class="mi"><span class="lab">التاريخ</span><span class="val">${esc(d.date||'-')}</span></div><div class="mi"><span class="lab">المدة</span><span class="val">${esc(d.duration||'-')}</span></div><div class="mi"><span class="lab">المستفيدون / الحضور</span><span class="val">${esc(d.beneficiary||'-')}</span></div></div><div class="r r2"><div class="mi"><span class="lab">العدد</span><span class="val">${esc(d.count||0)}</span></div><div class="mi"><span class="lab">المسؤول</span><span class="val">${esc(owner)}</span></div></div></section>${secs}${photos}<section class="sign"><div class="sig"><label>إعداد الوثيقة</label><b>${esc(owner)}</b><div class="line"></div></div><div class="sig"><label>اعتماد مدير المدرسة</label><b>${esc(d.principalName||'........................')}</b><div class="line"></div></div></section><footer class="foot"><span>${esc(school)} — التوثيق المدرسي</span><span>${esc(type)}</span></footer><script>window.onload=function(){let n=0;function go(){let p=[...document.images].filter(i=>!i.complete);if(!p.length||n>12){setTimeout(()=>window.print(),250);return}n++;setTimeout(go,120)}go()}<\/script></body></html>`}async function premiumPrint(id){let w=window.open('','_blank');if(!w){alert('Safari منع نافذة الطباعة. اسمح بالنوافذ المنبثقة لهذا الموقع مرة واحدة.');return}w.document.write('<div dir="rtl" style="font-family:Tahoma,Arial;padding:34px;color:#15445A"><h3>جاري تجهيز النسخة الاحترافية…</h3></div>');try{let d=await dbGet(id);if(!d)throw new Error('لم يتم العثور على التقرير');let imgs=await imgData(d.files);w.document.open();w.document.write(printHTML(d,imgs));w.document.close()}catch(e){w.document.body.innerHTML='<div dir="rtl" style="font-family:Tahoma,Arial;padding:30px"><h3>تعذر تجهيز الطباعة</h3><p>'+esc(e.message||e)+'</p></div>'}}function resizeTa(t){try{t.style.height='auto';t.style.height=Math.max(190,t.scrollHeight+8)+'px'}catch(e){}}function patch(){let f=deepestFrame(base);if(!f)return;try{let d=f.contentDocument;if(!d)return;if(!d.getElementById('v65style')){let s=d.createElement('style');s.id='v65style';s.textContent='#sections textarea{min-height:210px!important;font-size:18px!important;line-height:1.95!important;padding:16px!important;border-radius:14px!important;color:#17252d!important;background:#fff!important}#sections .sec{padding:15px!important}#sections .sec h4{font-size:18px!important;margin-bottom:10px!important}@media(max-width:600px){#sections textarea{min-height:230px!important;font-size:18px!important;line-height:2!important}}';d.head.appendChild(s)}[...d.querySelectorAll('#sections textarea')].forEach(t=>{if(!t.dataset.v65){t.dataset.v65='1';t.addEventListener('input',()=>resizeTa(t))}resizeTa(t)});[...d.querySelectorAll('button[onclick*="printDoc"]')].forEach(b=>{let m=(b.getAttribute('onclick')||'').match(/printDoc\(['\"]([^'\"]+)['\"]\)/);if(!m)return;b.removeAttribute('onclick');b.dataset.premiumPrint=m[1];b.textContent='🖨️ طباعة احترافية / حفظ PDF';b.style.background='#15445A';b.style.color='#fff';b.style.borderColor='#15445A'});if(!d.__v65click){d.__v65click=true;d.addEventListener('click',e=>{let b=e.target.closest&&e.target.closest('[data-premium-print]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();premiumPrint(b.dataset.premiumPrint)},true);let mo=new MutationObserver(()=>patch());mo.observe(d.documentElement,{subtree:true,childList:true})}}catch(e){console.error(e)}}base.addEventListener('load',()=>setTimeout(patch,1200));setInterval(patch,700)})();</script></body></html>
