<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>محرك توثيق المدرسة الذكي V7</title><style>:root{--g:#07a869;--n:#15445a;--bg:#f5f7f8;--line:#dfe5e8;--muted:#68707a}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#17252d;-webkit-text-size-adjust:100%}button,input,select,textarea{font:inherit}button{cursor:pointer}.bar{height:5px;background:linear-gradient(90deg,#07a869,#0da9a6,#3d7eb9,#15445a)}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1080px;margin:auto;padding:14px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{font-size:18px;color:var(--n)}.brand small,.muted{color:var(--muted)}.brand small{display:block;margin-top:3px}.primary,.ghost,.secondary{border-radius:12px;padding:11px 14px;border:1px solid var(--line);font-weight:700}.primary{background:var(--g);border-color:var(--g);color:#fff}.secondary{background:var(--n);border-color:var(--n);color:#fff}.ghost{background:#fff;color:var(--n)}nav{display:flex;gap:8px;overflow:auto;margin-top:12px}nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--n)}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.hero{background:linear-gradient(135deg,#eefaf6,#fff)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 8px}.quick span{display:block;font-size:28px;margin-bottom:5px}.doc{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.tag{display:inline-block;background:#eef6f8;color:var(--n);border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.search{width:100%;padding:12px;border:1px solid #d7dfe3;border-radius:12px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:22px}dialog{border:0;border-radius:20px;padding:0;width:min(940px,calc(100% - 16px));max-height:94vh}dialog::backdrop{background:#0007}.dh{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between}.db{padding:16px;max-height:84vh;overflow:auto;overflow-anchor:none}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{display:grid;gap:6px}.field label{font-weight:700;color:var(--n)}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7dfe3;border-radius:12px;background:#fff}.smart{border:1px solid #cfe4df;background:#f6fbf9;border-radius:16px;padding:14px}.smart h3{margin:0 0 4px;color:var(--n)}.group{margin-top:12px}.group b{display:block;color:var(--n);margin-bottom:7px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #cfdde2;background:#fff;border-radius:999px;padding:8px 11px;color:#24434f}.chip.on{background:#e9f8f2;border-color:#79cdb1;color:#067a51;font-weight:800}.note{margin-top:12px}.note textarea{height:100px;resize:none}.generate{width:100%;min-height:54px;font-size:16px;margin-top:14px}.generated{display:none}.generated.active{display:block}.sec{border:1px solid var(--line);border-right:4px solid var(--g);border-radius:14px;padding:12px;margin:10px 0}.sec h4{margin:0 0 9px;color:var(--n);font-size:18px}.sec textarea{width:100%;height:245px;resize:none;overflow-y:auto;border:1px solid #d7dfe3;border-radius:12px;padding:15px;font-size:18px;line-height:1.9}.sticky{position:sticky;bottom:-16px;z-index:3;background:linear-gradient(to top,#fff 80%,#ffffff00);padding:24px 0 10px}.sticky button{width:100%;min-height:55px;font-size:17px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumb img{width:100%;height:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px}@media(max-width:760px){.quick{grid-template-columns:1fr 1fr}.grid,.settings{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:470px){.quick{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.db{padding:12px}.sec textarea{height:255px}.top{align-items:flex-start}}</style></head><body><div class="bar"></div><header><div class="wrap"><div class="top"><div class="brand"><b>محرك توثيق المدرسة الذكي</b><small>V7 — نواة موحدة مستقرة</small></div><button class="primary" id="newBtn">+ وثّق عملاً</button></div><nav><button data-page="home">الرئيسية</button><button data-page="archive">الأرشيف</button><button data-page="settings">الإعدادات</button></nav></div></header><main class="wrap"><section id="home" class="page active"><div class="card hero"><h2 style="margin:0">ماذا فعلت اليوم؟</h2><div class="muted">اختر نوع العمل ثم حدّد ما تم بنقرات سريعة.</div><div id="quick" class="quick"></div></div><div class="card"><div class="row"><h3 style="margin:0">آخر الأعمال</h3><button class="ghost" data-page="archive">عرض الكل</button></div><div id="recent"></div></div></section><section id="archive" class="page"><div class="card"><div class="row"><h2 style="margin:0">الأرشيف</h2><button class="primary" id="newBtn2">+ توثيق جديد</button></div><input id="search" class="search" placeholder="ابحث في العنوان أو المسؤول أو المحتوى..."><div id="list"></div></div></section><section id="settings" class="page"><div class="card"><h2 style="margin-top:0">إعدادات المدرسة</h2><div class="settings"><div class="field"><label>اسم المدرسة</label><input id="schoolName"></div><div class="field"><label>إدارة التعليم</label><input id="eduOffice"></div><div class="field"><label>اسم مدير المدرسة</label><input id="principalName"></div><div class="field"><label>إعداد افتراضي للتوقيع</label><input id="preparedBy"></div></div><button class="primary" id="saveSettings" style="margin-top:12px">حفظ الإعدادات</button></div></section></main><dialog id="formDialog"><div class="dh"><div><b id="formTitle">توثيق عمل</b><div id="formSub" class="muted" style="font-size:12px"></div></div><button class="close" id="formClose">✕</button></div><div class="db"><form id="form"><div class="grid"><div class="field full"><label>نوع العمل</label><select id="type"></select></div><div class="field full"><label>العنوان *</label><input id="title" required></div><div class="field"><label>التاريخ</label><input id="date" type="date" required></div><div class="field"><label>المدة</label><select id="duration"><option>حصة واحدة</option><option>حصتان</option><option>3 حصص</option><option>يوم دراسي</option><option>أسبوع</option><option>شهر</option><option>فصل دراسي</option><option>عام دراسي</option><option>مستمر</option></select></div><div class="field"><label>المستفيد / الحضور</label><select id="beneficiary"><option>الطلاب</option><option>المعلمون</option><option>الهيئة الإدارية</option><option>الهيئة الإدارية والمعلمون</option><option>أولياء الأمور</option><option>المجتمع المحلي</option><option>متعدد</option></select></div><div class="field"><label>العدد</label><input id="count" type="number" min="0" value="0"></div><div class="field full"><label>المسؤول</label><input id="owner"></div><div class="field full"><label>المرفقات والصور</label><input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><div id="pendingFiles"></div></div><div class="full smart"><h3>ما تم توثيقه</h3><div class="muted" style="font-size:13px">اختر ما ينطبق فقط. لا حاجة لكتابة شرح طويل.</div><div id="smartGroups"></div><div class="field note"><label>أضف شيئًا مهمًا حدث <span class="muted">(اختياري)</span></label><textarea id="note"></textarea></div><button type="button" class="primary generate" id="generate">إنشاء المحتوى من المعلومات المختارة</button></div><div id="generated" class="full generated"><h3>المحتوى — قابل للتعديل</h3><div id="sections"></div></div><div class="full sticky"><button type="submit" class="primary">اعتماد وحفظ</button></div></div></form></div></dialog><dialog id="viewDialog"><div class="dh"><b>عرض العمل</b><button class="close" id="viewClose">✕</button></div><div id="viewBody" class="db"></div></dialog><script>const TYPES={program:['🎯','برنامج / فعالية'],meeting:['👥','اجتماع'],plan:['🗂️','خطة عمل'],training:['🎓','تطوير مهني'],analysis:['📊','تحليل نتائج'],lesson:['📚','ممارسة تعليمية'],partnership:['🤝','شراكة / أسرة'],safety:['🛡️','أمن وسلامة']};const CFG={lesson:[['الأداة أو الوسيلة',['جهاز عرض','عرض تقديمي','فيديو تعليمي','منصة رقمية','تطبيق تعليمي','سبورة تفاعلية']],['دور الطلاب',['مشاهدة مركزة','مناقشة','حل نشاط','تطبيق عملي','إنتاج عمل','تعلم تعاوني']],['التحقق من التعلم',['أسئلة شفهية','ملاحظة الأداء','ورقة عمل','اختبار قصير','منتج تعلم','لم يتم القياس']],['النتيجة',['تحقق جيد','تحقق جزئي','يحتاج دعم','لم أقس الأثر']]],program:[['نوع التنفيذ',['عرض توعوي','نشاط تطبيقي','مسابقة','ركن / معرض','إذاعة مدرسية','حملة']],['مشاركة المستفيدين',['مشاركة مباشرة','مناقشة','تنفيذ مهمة','إنتاج عمل','حضور فقط']],['قياس الأثر',['استبانة','ملاحظة','منتج / مخرج','مقارنة قبل وبعد','لم يتم القياس']],['النتيجة',['تحقق جيد','تحقق جزئي','يحتاج متابعة','لم أقس الأثر']]],meeting:[['طبيعة الاجتماع',['تنسيقي','متابعة','حل مشكلة','تخطيط','مراجعة نتائج']],['ما تم',['مناقشة واقع','تحديد أسباب','اقتراح حلول','توزيع مسؤوليات','تحديد مدة']],['المتابعة',['اجتماع لاحق','تقرير متابعة','تكليف مباشر','محضر تنفيذ']]],training:[['أسلوب التنفيذ',['عرض ومناقشة','ورشة تطبيقية','تدريب عملي','تبادل خبرات','مجتمع تعلم مهني']],['مشاركة الحضور',['تطبيق نشاط','مناقشة أمثلة','إنتاج نموذج','تبادل تجارب']],['قياس الأثر',['تطبيق ميداني','ملاحظة ممارسة','استبانة','منتج تدريبي','لم يتم القياس']]],analysis:[['مصدر البيانات',['اختبار قصير','اختبار فصلي','اختبارات وطنية','سجلات أداء','استبانة']],['نوع المعالجة',['تحديد نقاط قوة','تحديد فجوات','تحليل أخطاء','تصنيف مستويات','مقارنة نتائج']],['الإجراء',['خطة علاجية','إثراء','إعادة تدريس','تدريب إضافي','متابعة فردية']]],plan:[['طبيعة الخطة',['تحسين','تشغيلية','علاجية','إثرائية','متابعة']],['آلية التنفيذ',['مراحل زمنية','توزيع مسؤوليات','مؤشرات أداء','اجتماعات متابعة']],['المتابعة',['تقرير دوري','نسبة إنجاز','مراجعة شواهد','اجتماع متابعة']]],partnership:[['نوع الشراكة',['أسرة','جهة حكومية','قطاع خاص','مؤسسة مجتمعية']],['دور الشريك',['توعية','تقديم خدمة','مشاركة تنفيذ','دعم مورد','استضافة']],['قياس الأثر',['استبانة','عدد مستفيدين','مخرج موثق','تغذية راجعة','لم يتم القياس']]],safety:[['نوع الإجراء',['جولة سلامة','إخلاء','توعية','صيانة','معالجة ملاحظة']],['الملاحظة',['لا توجد ملاحظات','ملاحظة بسيطة','ملاحظة تحتاج معالجة','حالة عاجلة']],['المتابعة',['إغلاق الملاحظة','طلب صيانة','إعادة فحص','توعية إضافية']]]};const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let db,docs=[],pending=[];function fix(s){return String(s||'').replace(/الإنتباه/g,'الانتباه').replace(/مسئولية/g,'مسؤولية').replace(/مسئول/g,'مسؤول').replace(/الظغط/g,'الضغط').replace(/البرجكتر|البروجكتر/g,'البروجكتور').replace(/تقنيه/g,'تقنية').replace(/التقنيه/g,'التقنية').replace(/استراتيجيه/g,'استراتيجية').replace(/عمليه/g,'عملية').replace(/فعليه/g,'فعلية').replace(/النتيجه/g,'النتيجة').replace(/الاداه/g,'الأداة').replace(/الانشطه/g,'الأنشطة').replace(/\s+([،؛:.])/g,'$1').replace(/[ ]{2,}/g,' ').trim()}function bullets(a){return a.filter(Boolean).map(x=>'• '+fix(x)).join('\n')}function nav(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));function init(){$('type').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('');$('quick').innerHTML=Object.entries(TYPES).map(([k,v])=>`<button type="button" data-k="${k}"><span>${v[0]}</span><b>${v[1]}</
