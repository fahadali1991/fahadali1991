<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow phone column. D = live report on top, fixed step panel at the bottom. */
:root{
  --paper:#f6f8f6; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#dbe3df;
  --accent:#0f6b5c; --accent-soft:#e2f0ec; --mark:#f2c14e; --mark-ink:#3d2e00; --ghost:#e9eeeb;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4fbfa8; --accent-soft:#1d2f2a; --mark:#e9b949; --mark-ink:#241a00; --ghost:#26302c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4fbfa8; --accent-soft:#1d2f2a; --mark:#e9b949; --mark-ink:#241a00; --ghost:#26302c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
body.d{padding-bottom:62vh}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.6rem;line-height:1.3} h2{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--mark);outline-offset:2px}
svg.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.teacher{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
.teacher b{color:var(--ink);font-weight:600}

.support{display:flex;flex-direction:column;gap:8px}
.support .row{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.8rem;border-radius:8px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.code{background:transparent;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.lbl{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:14px;font-weight:600;font-size:1rem;width:100%}
.primary:disabled{opacity:.35;cursor:default}

.gridA{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tileA{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:500;min-height:108px;justify-content:center}
.tileA svg.ic{width:36px;height:36px;color:var(--accent)}
.tileA[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px rgb(0 0 0 / .12);transform:translateY(105%);transition:transform .25s ease;max-height:72vh;overflow:auto}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
/* ---------- B ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bub.sys{align-self:flex-start;border-start-start-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--surface);border-color:var(--accent);border-start-end-radius:4px;flex-direction:row;align-items:center;gap:8px}
.bub.me svg.ic{width:22px;height:22px}
.optsB{display:flex;flex-direction:column;gap:6px}
.optB{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:start}
.optB svg.ic{color:var(--accent)}
.summary{border-inline-start:4px solid var(--mark);padding-inline-start:12px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.listC{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowC{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;width:100%}
.rowC:last-child{border-bottom:0}
.rowC svg.ic{color:var(--accent);margin-top:2px}
.rowC .t{font-weight:600}
.rowC .s{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rowC .s span{font-size:.72rem;color:var(--muted);background:var(--paper);border-radius:6px;padding:1px 7px}
.rowC[aria-pressed="true"]{background:var(--accent-soft)}
.detailC{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dock{position:fixed;inset:auto 0 0 0;background:var(--ink);color:var(--paper);

.dock .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px;font-size:.9rem}
.dock .in b{color:var(--mark)}
.dock button{margin-inline-start:auto;background:var(--mark);color:var(--mark-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.dock button:disabled{opacity:.4}

/* ---------- D: live report ---------- */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line),0 10px 24px rgb(0 0 0 / .06);font-size:.9rem}
.repHead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:8px;font-size:.78rem;color:var(--muted)}
.repHead b{font-family:var(--display);color:var(--accent);font-size:.95rem}
.repTitle{font-size:1.2rem;line-height:1.4}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;font-size:.8rem}
.meta div{display:flex;gap:6px;min-width:0} .meta dt{color:var(--muted)} .meta dd{margin:0;font-weight:500}
.sec{display:flex;flex-direction:column;gap:6px}
.sec h3{font-size:.85rem;color:var(--accent)}
.sec ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:2px}
.ghostline{height:10px;border-radius:5px;background:var(--ghost)}
.ghostline.s{width:60%}
.ghost{color:var(--muted);font-weight:500}
.again{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;font-size:.78rem;color:var(--accent)}
.again svg.ic{width:16px;height:16px}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.tbl th{text-align:start;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);width:50%}
.tbl td{vertical-align:top;padding:6px;border-bottom:1px solid var(--line)}
.tbl td div+div{margin-top:6px}
.tbl .code{display:inline-block;direction:ltr;font-variant-numeric:tabular-nums;color:var(--muted);margin-inline-end:4px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.75rem;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover}
.sign{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.fresh{animation:fresh 1.2s ease}
@keyframes fresh{0%{background:color-mix(in srgb,var(--mark) 45%,transparent)}100%{background:transparent}}

.panel{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px rgb(0 0 0 / .14);max-height:58vh;overflow:auto;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.phead{display:flex;align-items:baseline;gap:8px}
.phead h2{font-size:1.15rem}
.phead .n{font-size:.78rem;color:var(--muted)}
.phead .back{margin-inline-start:auto;border:0;background:transparent;color:var(--accent);font-size:.85rem;padding:4px}
.repeat{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;text-align:start;width:100%}
.repeat svg.ic{color:var(--accent);width:24px;height:24px}
.repeat small{display:block;color:var(--muted);font-size:.78rem}
.gridD{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tileD{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 4px;font-size:.74rem;line-height:1.3;text-align:center;font-weight:500;position:relative}
.tileD svg.ic{color:var(--accent)}
.tileD .hot{position:absolute;top:-7px;inset-inline-start:-4px;background:var(--mark);color:var(--mark-ink);font-size:.62rem;border-radius:99px;padding:0 6px}
.more{border:0;background:transparent;color:var(--accent);font-size:.85rem;padding:4px;align-self:flex-start}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--accent);border-radius:12px;padding:14px;color:var(--accent);font-weight:600;cursor:pointer}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.78rem;color:var(--muted)}

/* ---------- prototype chrome (not part of the design) ---------- */
.state{font-size:.75rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px}
.state .chips{gap:6px} .state .chip{padding:3px 10px;font-size:.75rem}
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:99px;padding:4px;box-shadow:0 6px 20px rgb(0 0 0 / .35);font-size:.85rem;white-space:nowrap}
.switch button{background:#2a2a2a;color:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:1.1rem}
.switch span{padding:0 10px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.fresh{animation:none}}
</style>

// deterministic choice per teacher + report + "صياغة أخرى" count, so two teachers get different texts
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pick(arr,key){return arr[hash(key)%arr.length]}
function fill(s,a,cls){const p=P(),g=G[p.g];return s.replaceAll("{opt}",S.opt).replaceAll("{SUBJ}",p.subj).replaceAll("لـ{ST} {CLS}","ل"+g.ST+" "+cls.t).replaceAll("{ST} {CLS}",g.ST+" "+cls.t).replaceAll("لـ{ST}","لل"+g.ST).replaceAll("{ST}","ال"+g.ST).replaceAll("لـ{CLS}","لل"+cls.t.slice(2)).replaceAll("{CLS}",cls.t).replaceAll("{T}",g.T).replaceAll("{USED}",g.USED).replaceAll("{SCHOOL}","مدرسة "+p.school)}
function gen(a,cls){
  const k=[S.prof,a.id,S.opt,cls.k,S.seed].join("|"), t=a.t;
  const goals=[...t.goals].sort((x,y)=>hash(k+x)-hash(k+y)).slice(0,3);
  return {title:fill(pick(t.title,k+"t"),a,cls),
    desc:fill(pick(t.s1,k+"1")+" "+pick(t.s2,k+"2")+" "+pick(S3,k+"3"),a,cls),
    goals:goals.map(x=>fill(x,a,cls))};
}

function D(){
  const p=P(),a=act(),cls=p.classes.find(c=>c.k===S.cls)||p.classes[0];
  const step=!a?1:!S.opt?2:!S.clsOk?3:4;
  const txt=a&&S.opt?gen(a,cls):null;
  const fr=k=>{if(S.seen[k])return'';S.seen[k]=1;return' fresh'};
  const ghost=n=>Array.from({length:n},(_,i)=>`<div class="ghostline${i===n-1?' s':''}"></div>`).join('');
  const date=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
  const rep=`<article class="rep" aria-label="معاينة التقرير">
   <div class="repHead"><b>تقرير شاهد</b><span>مدرسة ${p.school}</span></div>
   <h2 class="repTitle${txt?fr('t'+txt.title):' ghost'}">${txt?txt.title:'العنوان يظهر هنا بعد اختيارك'}</h2>
   <dl class="meta"><div><dt>${G[p.g].T}:</dt><dd>${p.name}</dd></div><div><dt>المادة:</dt><dd>${p.subj}</dd></div>
     <div><dt>الصف:</dt><dd class="${S.clsOk?fr('c'+cls.k):''}">${cls.t}</dd></div><div><dt>التاريخ:</dt><dd>${date}</dd></div></dl>
   <section class="sec"><h3>الوصف</h3>${txt?`<p class="${fr('d'+txt.desc)}">${txt.desc}</p><button type="button" class="again" data-again="1">${ic('redo')}صياغة أخرى</button>`:ghost(3)}</section>
   <section class="sec"><h3>الأهداف</h3>${txt?`<ul class="${fr('g'+txt.goals.join())}">${txt.goals.map(g=>`<li>${g}</li>`).join('')}</ul>`:ghost(3)}</section>
   <section class="sec"><h3>ما يدعمه هذا التقرير</h3>${a?`<table class="tbl${fr('s'+a.id)}"><thead><tr><th>عناصر الأداء الوظيفي</th><th>مؤشرات دليل الهيئة</th></tr></thead>
     <tbody><tr><td>${a.el.map(e=>`<div>${e} (${W[e]}%)</div>`).join('')}</td><td>${a.ind.map(c=>`<div><span class="code">${c}</span>${IND[c]}</div>`).join('')}</td></tr></tbody></table>`:ghost(2)}</section>
   <section class="sec"><h3>الشواهد</h3><div class="photos">${[0,1,2,3].map(i=>`<div class="slot">${S.photos[i]?`<img src="${S.photos[i]}" alt="صورة ${i+1}">`:`صورة ${i+1}`}</div>`).join('')}</div></section>
   <div class="sign"><span>${G[p.g].T}: ${p.name}</span><span>مدير المدرسة: ............</span></div>
  </article>`;

  let body='';
  const ranked=[...ACTS].sort((x,y)=>(p.use[y.id]||0)-(p.use[x.id]||0));
  const top=S.more?ranked:ranked.slice(0,4), last=ACTS.find(x=>x.id===p.last.act), lastCls=p.classes.find(c=>c.k===p.last.cls);
  if(step===1) body=`<button type="button" class="repeat" data-repeat="1">${ic('redo')}<span><b>كرّر آخر تقرير مع فصل ثاني</b><small>${last.n}: ${p.last.opt}، ${lastCls.l}</small></span></button>
    <div class="gridD">${top.map((x,i)=>`<button type="button" class="tileD" data-act="${x.id}">${!S.more&&i<2?'<span class="hot">الأكثر</span>':''}${ic(x.ic)}<span>${x.n}</span></button>`).join('')}</div>
    <button type="button" class="more" data-more="1">${S.more?'أقل':'كل الأنشطة ('+ACTS.length+')'}</button>`;
  if(step===2) body=`${chips(a)}<p class="note">الخيارات مرتّبة حسب مادة ${p.subj}.</p>`;
  if(step===3) body=`<div class="chips">${p.classes.map(c=>`<button type="button" class="chip" data-cls="${c.k}" aria-pressed="${cls.k===c.k}">${c.l}</button>`).join('')}</div>
    <button type="button" class="primary" data-clsok="1">صحيح، التالي</button>`;
  if(step===4) body=`<label class="upload" for="ph">${ic('camera')}<span>${S.photos.length?'أضف صور ('+S.photos.length+' من 4)':'أرفق صور الشاهد'}</span><input id="ph" type="file" accept="image/*" multiple></label>

    <div class="steps" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>

    ${body}</div></div>`;
  return rep+state()+panel;
}

function render(){const v=cur();document.body.classList.toggle('d',v==='d');app.innerHTML=R[v]();document.getElementById('vlabel').textContent=`${v.toUpperCase()} (${VARIANTS[v]})`;}
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.act){ if(S.act!==d.act){S.opt=null;S.clsOk=false;} S.act=d.act; tap(); }
  else if(d.opt){ S.opt=d.opt; tap(); }
  else if(d.tab){ S.tab=d.tab; tap(); }
  else if(d.cls){ S.cls=d.cls; tap(); }
  else if(d.clsok){ S.clsOk=true; tap(); }
  else if(d.again){ S.seed++; tap(); }
  else if(d.more){ S.more=!S.more; }
  else if(d.repeat){ const l=P().last; S.act=l.act; S.opt=l.opt; S.cls=P().classes.find(c=>c.k!==l.cls).k; S.clsOk=false; tap(); }
  else if(d.back){ if(S.clsOk&&cur()==='d'){S.clsOk=false}else if(S.opt){S.opt=null}else{S.act=null} }
  else if(d.prof){ profKeep=d.prof; S=fresh0(); }
  else if(d.reset){ S=fresh0(); }
  else return;
  render();
});
app.addEventListener('change',e=>{
  if(e.target.id!=='ph')return;
  const files=[...e.target.files].slice(0,4-S.photos.length); if(!files.length)return; tap();
  Promise.all(files.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)})))
    .then(urls=>{S.photos.push(...urls.filter(Boolean));render();});
});
function go(dir){const i=(keys.indexOf(cur())+dir+keys.length)%keys.length;S=fresh0();location.hash=keys[i];}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
addEventListener('hashchange',()=>{S=fresh0();render();});
render();
</script>
