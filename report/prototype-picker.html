<!-- PROTOTYPE — throwaway. Question: what should the teacher's "وش سوّيت؟" flow look like?

     Switch with #d / #a / #b / #c and the floating bar. Texts and mappings are drafts for review. -->

<style>
/* Layout: one narrow phone column. D = live report on top, fixed step panel at the bottom. */
:root{
  --paper:#f6f8f6; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#dbe3df;
  --accent:#0f6b5c; --accent-soft:#e2f0ec; --mark:#f2c14e; --mark-ink:#3d2e00; --ghost:#e9eeeb;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4fbfa8; --accent-soft:#1d2f2a; --mark:#e9b949; --mark-ink:#241a00; --ghost:#26302c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101614; --surface:#18201d; --ink:#e7eeeb; --muted:#9aa8a2; --line:#2b3632;
  --accent:#4fbfa8; --accent-soft:#1d2f2a; --mark:#e9b949; --mark-ink:#241a00; --ghost:#26302c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
body.d{padding-bottom:62vh}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.6rem;line-height:1.3} h2{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--mark);outline-offset:2px}
svg.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.teacher{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}

/* ---------- A ---------- */
.gridA{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tileA{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:500;min-height:108px;justify-content:center}

.sheet{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px rgb(0 0 0 / .12);transform:translateY(105%);transition:transform .25s ease;max-height:72vh;overflow:auto}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
/* ---------- B ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bub.sys{align-self:flex-start;border-start-start-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--surface);border-color:var(--accent);border-start-end-radius:4px;flex-direction:row;align-items:center;gap:8px}

/* ---------- C ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500}

.listC{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowC{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;width:100%}

.rowC[aria-pressed="true"]{background:var(--accent-soft)}
.detailC{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

.dock .in b{color:var(--mark)}
.dock button{margin-inline-start:auto;background:var(--mark);color:var(--mark-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:600}

.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;

.repTitle{font-size:1.2rem;line-height:1.4}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;font-size:.8rem}
.meta div{display:flex;gap:6px;min-width:0} .meta dt{color:var(--muted)} .meta dd{margin:0;font-weight:500}
.sec{display:flex;flex-direction:column;gap:6px}

.panel{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;

  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.steps i.on{background:var(--accent)}
.phead{display:flex;align-items:baseline;gap:8px}
.phead h2{font-size:1.15rem}
.phead .n{font-size:.78rem;color:var(--muted)}

.repeat{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;text-align:start;width:100%}
.repeat svg.ic{color:var(--accent);width:24px;height:24px}
.repeat small{display:block;color:var(--muted);font-size:.78rem}
.gridD{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tileD{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 4px;font-size:.74rem;line-height:1.3;text-align:center;font-weight:500;position:relative}
.tileD svg.ic{color:var(--accent)}
.tileD .hot{position:absolute;top:-7px;inset-inline-start:-4px;background:var(--mark);color:var(--mark-ink);font-size:.62rem;border-radius:99px;padding:0 6px}
.more{border:0;background:transparent;color:var(--accent);font-size:.85rem;padding:4px;align-self:flex-start}

.upload input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.78rem;color:var(--muted)}

.part{display:inline;border:0;background:transparent;padding:0 1px;font:inherit;text-align:start;color:inherit;border-radius:4px;cursor:pointer}
.part:hover{background:var(--accent-soft)}
.hint{font-size:.72rem;color:var(--muted)}
.obsNote{font-size:.72rem;color:var(--muted)}
.covTop{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.covTop .big{font-family:var(--display);font-size:1.9rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--ghost);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.covList{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.covRow{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.covRow:last-child{border-bottom:0}
.covRow .nm{flex:1;min-width:0}

.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.7rem;font-weight:700;margin-top:2px}
.dot.ok{background:var(--accent);color:var(--surface)}
.dot.no{border:1.5px dashed var(--muted)}
.go{border:0;background:transparent;color:var(--accent);padding:0;font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
.newb{background:var(--mark);color:var(--mark-ink);font-size:.65rem;border-radius:99px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}

.dRow{border-bottom:1px solid var(--line)} .dRow:last-child{border-bottom:0}
.dHead{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:transparent;padding:12px 14px;text-align:start}

.lvl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.desc{font-size:.85rem} .desc.next{border-inline-start:3px solid var(--mark);padding-inline-start:8px}

.setup{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}

/* ---------- prototype chrome (not part of the design) ---------- */
.state{font-size:.75rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px}

.sign{align-items:flex-end}

function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pick(arr,key){return arr[hash(key)%arr.length]}
function fill(s,a,cls){const p=P(),g=G[p.g];return s.replaceAll("{opt}",S.opt).replaceAll("{SUBJ}",p.subj).replaceAll("لـ{ST} {CLS}","ل"+g.ST+" "+cls.t).replaceAll("{ST} {CLS}",g.ST+" "+cls.t).replaceAll("لـ{ST}","لل"+g.ST).replaceAll("{ST}","ال"+g.ST).replaceAll("لـ{CLS}","لل"+cls.t.slice(2)).replaceAll("{CLS}",cls.t).replaceAll("{T}",g.T).replaceAll("{USED}",g.USED).replaceAll("{SCHOOL}","مدرسة "+p.school)}
function gen(a,cls){

  const goals=[...t.goals].sort((x,y)=>hash(k+x)-hash(k+y)).slice(0,3);
  const parts=[fill(pick(t.s1,k+"1"+S.ps[1]),a,cls),fill(pick(t.s2,k+"2"+S.ps[2]),a,cls),fill(pick(S3,k+"3"+S.ps[3]),a,cls)];
  const obs=S.obs.map(o=>fill(o,a,cls));
  return {title:fill(pick(t.title,k+"t"),a,cls),parts,desc:parts.join(" "),
    goals:goals.map(x=>fill(x,a,cls)),
    obs:obs.length?pick(["ولوحظ أثناء التنفيذ ","وأظهرت الملاحظة المباشرة "],k+"o")+obs.join("، و")+".":null};
}

}

const R={d:D,a:A,b:B,c:C};
const keys=Object.keys(R);
const cur=()=>{const h=location.hash.slice(1);return R[h]?h:'d'};
const startHash=()=>location.hash==='#start';
function render(){const v=cur();const ae=document.activeElement&&document.activeElement.id,ss=ae&&document.activeElement.selectionStart;document.body.classList.toggle('d',v==='d'&&S.view!=='cover');app.innerHTML=R[v]();
  if(ae&&ae!=='ph'){const el=document.getElementById(ae);if(el){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
  const fit=document.getElementById('fit'),rp=document.getElementById('rep'),wr=document.getElementById('a4wrap');if(wr&&rp){const k=wr.clientWidth/794;rp.style.transform=`scale(${k})`;wr.style.height=(1123*k)+'px';}if(fit&&rp){const over=rp.scrollHeight>rp.clientHeight+2;fit.className='fit '+(over?'over':'ok');fit.textContent=over?'أطول من صفحة A4: قلّل الصور أو الملاحظات.':'يتسع في صفحة A4 واحدة.';}
 document.getElementById('vlabel').textContent=`${v.toUpperCase()} (${VARIANTS[v]})`;}
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.act){ if(S.act!==d.act){S.opt=null;S.clsOk=false;} S.act=d.act; tap(); }
  else if(d.opt){ S.opt=d.opt; tap(); }
  else if(d.tab){ S.tab=d.tab; tap(); }
  else if(d.cls){ S.cls=d.cls; tap(); }
  else if(d.clsok){ S.clsOk=true; tap(); }
  else if(d.again){ S.seed++; tap(); }
  else if(d.part){ S.ps[d.part]++; tap(); }
  else if(d.obs){ S.obs=S.obs.includes(d.obs)?S.obs.filter(x=>x!==d.obs):[...S.obs,d.obs]; tap(); }
  else if(d.obsok){ S.obsOk=true; tap(); }
  else if(d.save){ const before=new Set(SAVED[S.prof].flatMap(r=>ACTS.find(x=>x.id===r.act).el));
    SAVED[S.prof].push({act:S.act,opt:S.opt}); lastNew=act().el.filter(e=>!before.has(e)); S.view='cover'; tap(); scrollTo(0,0); }
  else if(d.view){ lastNew=[]; S.view=d.view; scrollTo(0,0); }
  else if(d.new){ lastNew=[]; S=fresh0(); scrollTo(0,0); }
  else if(d.start){ lastNew=[]; S=fresh0(); S.act=d.start; scrollTo(0,0); }
  else if(d.more){ S.more=!S.more; }
  else if(d.repeat){ const l=P().last; S.act=l.act; S.opt=l.opt; S.cls=P().classes.find(c=>c.k!==l.cls).k; S.clsOk=false; tap(); }
  else if(d.back){ if(S.obsOk){S.obsOk=false}else if(S.clsOk&&cur()==='d'){S.clsOk=false}else if(S.opt){S.opt=null}else{S.act=null} }
  else if(d.sg){ SETUP.g=d.sg; }
  else if(d.sst){ SETUP.stage=d.sst; if(SETUP.subj&&!STAGES[d.sst].subj.includes(SETUP.subj))SETUP.subj=null; }
  else if(d.ssu){ SETUP.subj=d.ssu; }
  else if(d.sgo){ makeMe(); profKeep='me'; S=fresh0(); tap(); scrollTo(0,0); }
  else if(d.setup){ S=fresh0(); S.view='setup'; scrollTo(0,0); }
  else if(d.openel){ openEl=openEl===d.openel?null:d.openel; }
  else if(d.lvl){ SELF[S.prof][d.el]=+d.lvl; tap(); }
  else if(d.place){ S.place=d.place; tap(); }
  else if(d.dur){ S.dur=d.dur; tap(); }
  else if(d.tool){ S.tools=S.tools.includes(d.tool)?S.tools.filter(x=>x!==d.tool):[...S.tools,d.tool]; tap(); }
  else if(d.moredet){ S.showMore=!S.showMore; }
  else if(d.allstrat){ S.allStrat=!S.allStrat; S.filter=""; }
  else if(d.a4){ S.a4=!S.a4; tap(); }
  else if(d.ink){ S.ink=!S.ink; tap(); }
  else if(d.ar){ S.ar=!S.ar; tap(); }
  else if(d.cap){ S.caps[d.cap]=(S.caps[d.cap]||0)+1; tap(); }
  else if(d.prof){ profKeep=d.prof; S=fresh0(); }
  else if(d.reset){ S=fresh0(); }
  else return;
  render();
});
app.addEventListener('input',e=>{
  const id=e.target.id; if(id==='filter'){S.filter=e.target.value;render();}
  else if(id==='pre'||id==='post'){S[id]=e.target.value;render();}
  else if(id==='qr'){S.qr=e.target.value.trim();render();}
});
app.addEventListener('change',e=>{
  if(e.target.id!=='ph')return;
  const files=[...e.target.files].slice(0,4-S.photos.length); if(!files.length)return; tap();
  Promise.all(files.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)})))
    .then(urls=>{S.photos.push(...urls.filter(Boolean));render();});
});
function go(dir){const i=(keys.indexOf(cur())+dir+keys.length)%keys.length;S=fresh0();location.hash=keys[i];}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
addEventListener('hashchange',()=>{S=fresh0();if(startHash())S.view='setup';render();});
if(startHash())S.view='setup';
render();
</script>
