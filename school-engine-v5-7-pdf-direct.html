<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك الوثائق المدرسية الذكي V5.7</title></head><body><div style="font-family:Arial,Tahoma,sans-serif;padding:30px;text-align:center">جاري تشغيل النسخة المستقرة…</div><script>
(async function(){
  const base='https://raw.githubusercontent.com/fahadali1991/fahadali1991/main/school-engine-v5-5-stable.html';
  try{
    let html=await fetch(base,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('تعذر تحميل التطبيق');return r.text()});
    const lib='<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"><\\/script>';
    const patch=`<script>(function(){
      'use strict';
      function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
      function dbGet(id){return new Promise(function(resolve,reject){var r=indexedDB.open('schoolDocsV53',1);r.onsuccess=function(){var db=r.result;var q=db.transaction('docs').objectStore('docs').get(id);q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}};r.onerror=function(){reject(r.error)}})}
      function waitImages(root){return Promise.all(Array.prototype.slice.call(root.querySelectorAll('img')).map(function(img){if(img.complete)return Promise.resolve();return new Promise(function(res){img.onload=res;img.onerror=res})}))}
      function statusBox(btn){var old=document.getElementById('pdfDirectStatus');if(old)old.remove();var box=document.createElement('div');box.id='pdfDirectStatus';box.style.margin='10px 0';btn.parentElement.parentElement.insertAdjacentElement('afterend',box);return box}
      function renderDoc(d,showImgs){var imgs=(d.files||[]).filter(function(f){return f.type&&f.type.indexOf('image/')===0});var sec=(d.sections||[]).map(function(s){return '<section class="psec"><h3>'+esc(s.title)+'</h3><div>'+esc(s.body).split('\\n').join('<br>')+'</div></section>'}).join('');var imageHtml='';if(showImgs&&imgs.length){imageHtml='<h3 class="evidenceTitle">الشواهد المصورة</h3><div class="pimgs">'+imgs.map(function(f){return '<figure><img src="'+URL.createObjectURL(f)+'"><figcaption>'+esc(f.name||'صورة')+'</figcaption></figure>'}).join('')+'</div>'}var node=document.createElement('div');node.id='pdfDirectRender';node.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff;z-index:-1';node.innerHTML='<style>.pdfdoc{direction:rtl;width:794px;background:#fff;padding:24px;font-family:Arial,Tahoma,sans-serif;color:#17202a}.pbar{height:7px;background:linear-gradient(90deg,#07A869,#3D7EB9,#0DA9A6,#15445A,#C1B48A);margin-bottom:10px}.phead{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:10px;border-bottom:2px solid #15445A;padding-bottom:9px}.center{text-align:center}.left{text-align:left}.pmoe{font-size:15px;font-weight:700;color:#15445A}.pschool{font-size:19px;font-weight:800;color:#07A869}.psub{font-size:11px;color:#68707a}.ptitle{background:#eef6f8;border:1px solid #d6e4ea;border-radius:9px;padding:9px 11px;margin:10px 0;font-size:17px;font-weight:800;color:#15445A}.pmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}.pmeta div{border:1px solid #dfe5e8;border-radius:7px;padding:6px;font-size:10.5px}.psec{border:1px solid #dfe5e8;border-right:5px solid #07A869;border-radius:9px;padding:9px 11px;margin:6px 0;break-inside:avoid-page}.psec h3{margin:0 0 5px;font-size:14px;color:#15445A}.psec div{font-size:12.5px;line-height:1.65}.evidenceTitle{font-size:14px;color:#15445A;border-bottom:1px solid #dfe5e8;padding-bottom:5px}.pimgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pimgs figure{margin:0;border:1px solid #dfe5e8;border-radius:8px;padding:5px;break-inside:avoid}.pimgs img{width:100%;height:170px;object-fit:cover;border-radius:5px}.pimgs figcaption{font-size:9px;margin-top:3px}.psign{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:12px;padding-top:10px;border-top:1px dashed #c8d2d8;font-size:11px}.pfoot{text-align:center;font-size:9px;color:#68707a;margin-top:6px}</style><div class="pdfdoc"><div class="pbar"></div><div class="phead"><div><div class="pmoe">وزارة التعليم</div><div class="psub">المملكة العربية السعودية</div></div><div class="center"><div class="pschool">'+esc(d.schoolName||'اسم المدرسة')+'</div><div class="psub">'+esc(d.eduOffice||'إدارة التعليم')+'</div></div><div class="left"><div class="pmoe">وثيقة مدرسية</div><div class="psub">نسخة PDF</div></div></div><div class="ptitle">'+esc(d.title||'وثيقة')+'</div><div class="pmeta"><div><b>التاريخ:</b> '+esc(d.date||'-')+'</div><div><b>المدة:</b> '+esc(d.duration||'-')+'</div><div><b>المستفيد:</b> '+esc(d.beneficiary||'-')+'</div><div><b>العدد:</b> '+(d.count||0)+'</div><div><b>المسؤول:</b> '+esc(d.owner||'-')+'</div><div><b>إعداد:</b> '+esc(d.preparedBy||'-')+'</div><div><b>المدير:</b> '+esc(d.principalName||'-')+'</div><div><b>المرفقات:</b> '+((d.files||[]).length)+'</div></div>'+sec+imageHtml+'<div class="psign"><div><b>إعداد الوثيقة</b><br>'+esc(d.preparedBy||'........................')+'</div><div><b>اعتماد مدير المدرسة</b><br>'+esc(d.principalName||'........................')+'</div></div><div class="pfoot">محرك الوثائق المدرسية الذكي</div></div>';document.body.appendChild(node);return node}
      async function makePdf(btn,id){var box=statusBox(btn);if(typeof html2pdf==='undefined'){box.innerHTML='<div style="padding:12px;border:1px solid #d88;border-radius:12px">تعذر تحميل محرك PDF. أعد فتح الصفحة مع اتصال بالإنترنت.</div>';return}box.innerHTML='<div style="padding:12px;border:1px solid #dfe5e8;border-radius:12px">⏳ جاري إنشاء ملف PDF…</div>';try{var d=await dbGet(id);if(!d)throw new Error('لم يتم العثور على السجل');var old=document.getElementById('pdfDirectRender');if(old)old.remove();var showImgs=document.getElementById('poImgs')?document.getElementById('poImgs').checked:true;var node=renderDoc(d,showImgs);await waitImages(node);var filename=(d.title||'وثيقة').replace(/[\\/:*?"<>|]/g,'-')+'.pdf';var opt={margin:[6,6,6,6],filename:filename,image:{type:'jpeg',quality:.92},html2canvas:{scale:1.5,useCORS:true,backgroundColor:'#fff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}};var blob=await html2pdf().set(opt).from(node.querySelector('.pdfdoc')).outputPdf('blob');var url=URL.createObjectURL(blob);box.innerHTML='<div style="padding:12px;border:1px solid #07A869;border-radius:12px"><b>✅ تم إنشاء PDF</b><div style="color:#68707a;margin:6px 0 10px">افتح الملف ثم استخدم زر المشاركة في Safari للطباعة أو الحفظ.</div><a href="'+url+'" target="_blank" rel="noopener" style="display:inline-block;background:#07A869;color:#fff;text-decoration:none;padding:11px 15px;border-radius:12px;margin-left:6px">فتح PDF</a><a href="'+url+'" download="'+esc(filename)+'" style="display:inline-block;background:#eef6f8;color:#15445A;text-decoration:none;padding:11px 15px;border-radius:12px">حفظ PDF</a></div>'}catch(err){console.error(err);box.innerHTML='<div style="padding:12px;border:1px solid #d88;border-radius:12px">تعذر إنشاء PDF: '+esc(err.message||'خطأ غير معروف')+'</div>'}}
      document.addEventListener('click',function(e){var btn=e.target.closest('[data-print]');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();makePdf(btn,btn.dataset.print)},true);
      function relabel(){document.querySelectorAll('[data-print]').forEach(function(b){b.textContent='📄 إنشاء PDF / طباعة'})}
      new MutationObserver(relabel).observe(document.documentElement,{childList:true,subtree:true});relabel();
    })();<\\/script>`;
    html=html.replace('V5.5 — نسخة مستقرة','V5.7 — إنشاء PDF مباشر').replace('</head>',lib+'</head>').replace('</body>',patch+'</body>');
