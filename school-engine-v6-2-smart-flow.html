<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.2</title><style>html,body{margin:0;height:100%;background:#f5f7f8}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-1-print-fix.html"></iframe><script>(function(){'use strict';var base=document.getElementById('base');var EV={program:['صور','تقرير','كشف حضور','رابط/باركود'],meeting:['محضر','كشف حضور','عرض','صور'],training:['خطة/احتياج','إعلان','كشف حضور','شهادة','تقرير أثر'],lesson:['تحضير/خطة درس','صور/منتج تعلم','أداة تقويم','نتائج'],analysis:['ملف نتائج','تحليل','خطة علاجية/إثرائية','متابعة تقدم'],partnership:['اتفاقية/خطاب','صور','تقرير','استبانة/تغذية راجعة'],safety:['نموذج متابعة','صور','محضر/تقرير','طلب صيانة'],plan:['الخطة','محضر بناء الخطة','مؤشرات أداء','تقرير متابعة']};var TXT={'1-1-1-1':'تضع المدرسة خطة تشغيلية شاملة وفق أهداف تطويرية محددة.','1-1-1-2':'تتابع المدرسة تنفيذ خطتها التشغيلية وتطورها بما يضمن تحقيق أهدافها.','1-2-1-1':'تعزز المدرسة القيم الإسلامية والهوية الوطنية.','1-2-1-3':'تطبق المدرسة إجراءات محددة لدعم الانضباط المدرسي، وتتابع الالتزام بها.','1-2-1-4':'تنفذ المدرسة برامج وأنشطة تربوية داعمة للسلوك الإيجابي لدى المتعلمين، ومنهم ذوو الإعاقة والموهوبون، وتتابعها.','1-2-1-5':'تنفذ المدرسة برامج وأنشطة إثرائية لتطوير مواهب المتعلمين وتهيئهم للمستقبل، وتتابعها.','1-3-1-1':'تعزز المدرسة بناء العلاقات الإيجابية والتعاون في المجتمع المدرسي.','1-3-1-2':'تعزز المدرسة مشاركة الأسرة في تعلم أبنائهم والتحضير لمستقبلهم.','1-3-1-3':'تعزز المدرسة الشراكة المجتمعية لدعم التعلم والتأثير الإيجابي في المجتمع.','1-4-1-4':'تدعم المدرسة منسوبيها للحصول على الرخصة المهنية، وتتابعها.','1-4-1-5':'تدعم المدرسة التطوير المهني لمنسوبيها وفقًا لنتائج التقويم وتحليل احتياجاتهم.','1-4-1-6':'تطبق المدرسة التقويم الذاتي المبني على المعايير المعتمدة من الهيئة بشكل مستمر.','1-4-1-7':'تنفذ المدرسة خطة التحسين بناء على نتائج التقويم المدرسي، وتتابعها.','2-1-1-1':'توفر المدرسة فرصًا متكافئة للتعلم تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.','2-1-1-3':'تنوع المدرسة في استراتيجيات التعليم والتعلم لتلبية احتياجات المتعلمين ودعم تعلمهم.','2-1-1-4':'تفعل المدرسة التقنية الرقمية لدعم تعلم المتعلمين وتلبية احتياجاتهم.','2-1-1-5':'تنفذ المدرسة أنشطة تعلم تطبيقية ترتبط بحياة المتعلمين.','2-1-1-6':'تنمي المدرسة المهارات القرائية والعددية الأساسية لدى المتعلمين.','2-1-1-7':'تنمي المدرسة مهارات التفكير والبحث والابتكار لدى المتعلمين.','2-1-1-9':'تعزز المدرسة دافعية المتعلمين للتعلم والاستمتاع به.','2-2-1-1':'تطبق المدرسة أساليب وأدوات تقويم متنوعة للكشف عن مستويات أداء المتعلمين المختلفة.','2-2-1-2':'تطبق المدرسة أساليب وأدوات متنوعة لتقويم نواتج التعلم المستهدفة في مناهج التعليم.','2-2-1-3':'تحلل المدرسة نتائج التقويم وتوظفها في تحسين عمليات التعليم والتعلم والتقويم.','2-2-1-4':'تقدم المدرسة التغذية الراجعة للمتعلمين وأولياء أمورهم، وتتابع تقدمهم بشكل مستمر.','3-1-1-1':'يحقق المتعلمون نتائج مرتفعة في مجال القراءة وفقًا للاختبارات الوطنية.','3-1-1-2':'يحقق المتعلمون نتائج مرتفعة في مجال الرياضيات وفقًا للاختبارات الوطنية.','3-1-1-3':'يحقق المتعلمون نتائج مرتفعة في مجال العلوم وفقًا للاختبارات الوطنية.','3-2-1-1':'يظهر المتعلمون الاعتزاز بالقيم والهوية الوطنية.','3-2-1-4':'يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية.','3-2-1-5':'يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.','4-2-1-1':'تتوافر في مبنى المدرسة ومرافقها جميع متطلبات الأمن والسلامة.','4-2-1-2':'تتابع المدرسة صيانة المبنى وجميع مرافقه وتجهيزاته بشكل دوري.','4-2-1-3':'تتابع المدرسة نظافة المبنى المدرسي وجميع مرافقه بشكل مستمر.'};var RULES=[[['خطة تشغيلية','تشغيلية','بناء الخطة'],['1-1-1-1','1-1-1-2'],'تخطيط ومتابعة تنفيذ'],[['انضباط','سلوك','غياب','تأخر','مواظبة'],['1-2-1-3','1-2-1-4','3-2-1-5'],'انضباط وسلوك'],[['وطني','الوطن','هوية','قيم'],['1-2-1-1','3-2-1-1'],'هوية وقيم وطنية'],[['موهبة','موهوب','إثرائي'],['1-2-1-5','2-1-1-1'],'إثراء ومواهب'],[['أسرة','أولياء','ولي الأمر'],['1-3-1-2','2-2-1-4'],'مشاركة الأسرة'],[['شراكة','تطوع','مجتمع'],['1-3-1-3','3-2-1-4'],'شراكة مجتمعية'],[['تطوير مهني','تدريب','ورشة','احتياج تدريبي'],['1-4-1-5'],'تطوير مهني'],[['تقويم ذاتي'],['1-4-1-6'],'تقويم ذاتي'],[['خطة تحسين'],['1-4-1-7','2-2-1-3'],'تحسين مبني على نتائج'],[['استراتيجية','تدريس','تعلم تعاوني'],['2-1-1-3'],'استراتيجيات تعلم'],[['تقنية','رقمي','منصة','ذكاء اصطناعي'],['2-1-1-4'],'تقنية رقمية'],[['مشروع','تطبيقي','مهمة أدائية'],['2-1-1-5'],'تعلم تطبيقي'],[['قراءة','قرائي','كتابة','الخط','إملاء','عددية'],['2-1-1-6'],'مهارات أساسية'],[['تفكير','بحث','ابتكار','إبداع'],['2-1-1-7'],'تفكير وبحث وابتكار'],[['اختبار','تقويم','روبرك'],['2-2-1-1','2-2-1-2'],'تقويم تعلم'],[['تحليل نتائج','نتائج الطلاب','علاجي','إثرائي'],['2-2-1-3'],'تحليل نتائج وتحسين'],[['تغذية راجعة','تقدم'],['2-2-1-4'],'متابعة تقدم وتغذية راجعة'],[['نافس','اختبارات وطنية'],['3-1-1-1','3-1-1-2','3-1-1-3'],'اختبارات وطنية'],[['سلامة','إخلاء','حريق','طوارئ'],['4-2-1-1'],'أمن وسلامة'],[['صيانة','تكييف','إضاءة'],['4-2-1-2'],'صيانة'],[['نظافة'],['4-2-1-3'],'نظافة']];function norm(s){return String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'')}function dbOpen(){return new Promise(function(res,rej){var r=indexedDB.open('schoolDocsV53Print',1);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}function enrichDoc(title,date,payload){setTimeout(async function(){try{var db=await dbOpen();var all=await new Promise(function(res){var q=db.transaction('docs').objectStore('docs').getAll();q.onsuccess=function(){res(q.result||[])}});var cand=all.filter(function(x){return x.title===title&&(!date||x.date===date)}).sort(function(a,b){return String(b.created||'').localeCompare(String(a.created||''))})[0];if(!cand)return;cand.indicators=payload.indicators;cand.smartEvidence=payload.evidence;cand.smartFlags=payload.flags;cand.smartBoosts=payload.boosts;cand.smartIntegrated=true;await new Promise(function(res){var t=db.transaction('docs','readwrite');t.objectStore('docs').put(cand);t.oncomplete=res})}catch(e){console.error(e)}},900)}function setup(doc){if(doc.getElementById('smartIntegratedBox'))return;var form=doc.getElementById('form'),genBox=doc.getElementById('genBox');if(!form||!genBox)return;var style=doc.createElement('style');style.textContent='#smartIntegratedBox{background:#f8fbfb;border:1px solid #cfe8e1;border-radius:16px;padding:14px;margin:12px 0}.smTitle{color:#15445A;font-weight:800;font-size:16px;margin-bottom:7px}.smHint{color:#68707a;font-size:12px;line-height:1.6}.smChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.smChip{display:inline-flex;gap:5px;align-items:center;border:1px solid #dfe5e8;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px}.smBtn{border:0;border-radius:11px;background:#15445A;color:#fff;padding:10px 12px;font-weight:700}.smItem{border:1px solid #dfe5e8;border-right:4px solid #07A869;background:#fff;border-radius:12px;padding:10px;margin:7px 0}.smStrong{background:#e3f7ee;color:#06764b}.smPossible{background:#fff4ce;color:#755700}.smIndirect{background:#f0f1f3;color:#59616a}.smBadge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:11px;margin:2px}.smBoost{background:#fffaf0;border:1px solid #f0d99a;border-radius:11px;padding:9px;margin:6px 0;font-size:12px;line-height:1.6}.smStatus{font-size:12px;font-weight:700;margin:6px 0}.smFlags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}';doc.head.appendChild(style);var box=doc.createElement('div');box.id='smartIntegratedBox';box.className='full';box.innerHTML='<div class="smTitle">🧭 الربط الذكي والشواهد</div><div class="smHint">حدّد فقط الشواهد الموجودة فعلًا. وجود التقرير لا يعني تحقق المؤشر؛ المحرك يقترح علاقة توثيقية قابلة للمراجعة.</div><div id="smEvidence"></div><div class="smTitle" style="font-size:14px;margin-top:10px">أسئلة تقوية اختيارية</div><div class="smFlags"><label class="smChip"><input type="checkbox" class="smFlag" value="impact"> قياس أثر/قبل وبعد</label><label class="smChip"><input type="checkbox" class="smFlag" value="family"> مشاركة الأسرة</label><label class="smChip"><input type="checkbox" class="smFlag" value="community"> مشاركة مجتمعية</label><label class="smChip"><input type="checkbox" class="smFlag" value="tech"> تقنية رقمية</label><label class="smChip"><input type="checkbox" class="smFlag" value="assessment"> أداة تقويم</label><label class="smChip"><input type="checkbox" class="smFlag" value="feedback"> تغذية راجعة</label><label class="smChip"><input type="checkbox" class="smFlag" value="thinking"> تفكير/بحث/ابتكار</label></div><button type="button" class="smBtn" id="smAnalyze">حلّل واربط المؤشرات</button><div id="smResults"></div><div id="smBoosts"></div></div>';genBox.insertAdjacentElement('afterend',box);var last=[],boosts=[];function type(){return doc.getElementById('type').value}function text(){var title=doc.getElementById('title').value;var sec=[].map.call(doc.querySelectorAll('#sections textarea'),function(x){return x.value}).join(' ');return norm(title+' '+sec)}function renderEvidence(){var arr=EV[type()]||EV.program;var e=doc.getElementById('smEvidence');e.innerHTML='<div class="smTitle" style="font-size:14px">الشواهد المقترحة لهذا النوع</div><div class="smChips">'+arr.map(function(x){return '<label class="smChip"><input type="checkbox" class="smEv" value="'+x+'"> '+x+'</label>'}).join('')+'</div><div class="smStatus" id="smEvStatus"></div>';updateStatus()}function updateStatus(){var all=doc.querySelectorAll('.smEv').length,yes=doc.querySelectorAll('.smEv:checked').length,s=doc.getElementById('smEvStatus');if(s)s.textContent=yes===all&&all?'✅ الشواهد المقترحة مكتملة':'الشواهد المحددة: '+yes+' من '+all+' — الناقص لا يعني أن العمل غير صالح، لكنه قد يضعف التوثيق.'}function analyze(){var t=text(),scores={},reasons={};function add(c,w,r){scores[c]=(scores[c]||0)+w;(reasons[c]||(reasons[c]=[])).push(r)}RULES.forEach(function(r){var hits=r[0].filter(function(k){return t.indexOf(norm(k))>-1}).length;if(hits)r[1].forEach(function(c){add(c,hits*2,r[2])})});var defs={program:['1-2-1-4'],meeting:['1-3-1-1'],plan:['1-1-1-1','1-1-1-2'],training:['1-4-1-5'],analysis:['2-2-1-3'],lesson:['2-1-1-3','2-2-1-1'],partnership:['1-3-1-2','1-3-1-3'],safety:['4-2-1-1']}[type()]||[];defs.forEach(function(c){add(c,1,'نوع الوثيقة يمكن أن يدعم المؤشر إذا كانت الشواهد مناسبة')});var flags=[].map.call(doc.querySelectorAll('.smFlag:checked'),function(x){return x.value});if(flags.indexOf('impact')>-1)Object.keys(scores).forEach(function(c){scores[c]++});if(flags.indexOf('family')>-1){add('1-3-1-2',3,'تم تأكيد مشاركة الأسرة');add('2-2-1-4',2,'متابعة وتواصل مع الأسرة')}if(flags.indexOf('community')>-1){add('1-3-1-3',3,'تم تأكيد مشاركة مجتمعية');add('3-2-1-4',3,'مشاركة مجتمعية/تطوعية')}if(flags.indexOf('tech')>-1)add('2-1-1-4',3,'تم تأكيد استخدام التقنية');if(flags.indexOf('assessment')>-1){add('2-2-1-1',3,'تم تأكيد استخدام أداة تقويم');add('2-2-1-2',2,'تقويم نواتج تعلم')}if(flags.indexOf('feedback')>-1)add('2-2-1-4',3,'تم تأكيد التغذية الراجعة');if(flags.indexOf('thinking')>-1)add('2-1-1-7',3,'تم تأكيد التفكير/البحث/الابتكار');last=Object.keys(scores).sort(function(a,b){return scores[b]-scores[a]}).slice(0,8).map(function(c){var s=scores[c],str=s>=5?'strong':s>=3?'possible':'indirect';return{code:c,text:TXT[c]||'',strength:str,reason:Array.from(new Set(reasons[c]||[])).join('، '),selected:str!=='indirect'}}).filter(function(x){return x.text});drawResults();drawBoosts()}function drawResults(){var r=doc.getElementById('smResults');r.innerHTML='<div class="smTitle" style="font-size:14px;margin-top:12px">المؤشرات المقترحة</div>'+((last.length)?last.map(function(i,idx){var lab=i.strength==='strong'?'قوي مباشر':i.strength==='possible'?'محتمل يحتاج شاهد':'غير مباشر';var cls=i.strength==='strong'?'smStrong':i.strength==='possible'?'smPossible':'smIndirect';return '<div class="smItem"><label><input type="checkbox" class="smInd" data-idx="'+idx+'" '+(i.selected?'checked':'')+'> <b>'+i.code+'</b></label> <span class="smBadge '+cls+'">'+lab+'</span><div style="margin-top:5px">'+i.text+'</div><div class="smHint">سبب الربط: '+i.reason+'</div></div>'}).join(''):'<div class="smItem">لا يوجد ربط واضح بعد. أضف عنوانًا أدق أو محتوى أو اختر أسئلة التقوية التي حدثت فعلًا.</div>')}function drawBoosts(){var arr=EV[type()]||[],sel=[].map.call(doc.querySelectorAll('.smEv:checked'),function(x){return x.value}),miss=arr.filter(function(x){return sel.indexOf(x)<0});boosts=[];if(miss.length)boosts.push('إذا كانت موجودة فعليًا، أضف هذه الشواهد لتقوية الملف: '+miss.join('، ')+'.');var flags=[].map.call(doc.querySelectorAll('.smFlag:checked'),function(x){return x.value});if(flags.indexOf('impact')<0)boosts.push('إذا قِيس الأثر فعلًا، أضف نتيجة أو مقارنة قبل/بعد بدل الاكتفاء بوصف التنفيذ.');if(type()==='training'&&sel.indexOf('تقرير أثر')<0)boosts.push('في التطوير المهني، تقرير الأثر أو تطبيق لاحق يقوي التوثيق أكثر من شهادة الحضور وحدها.');if(type()==='lesson'&&sel.indexOf('أداة تقويم')<0)boosts.push('في الممارسة التعليمية، أداة تقويم أو نتيجة تعلم تجعل الربط بمؤشرات التقويم أقوى.');if(type()==='analysis'&&sel.indexOf('متابعة تقدم')<0)boosts.push('تحليل النتائج يصبح أقوى عند إضافة متابعة التقدم بعد الإجراء العلاجي/الإثرائي.');if(type()==='partnership'&&sel.indexOf('استبانة/تغذية راجعة')<0)boosts.push('في الشراكات، التغذية الراجعة أو قياس أثر المشاركة يقوي الاستدامة والأثر.');if(type()==='plan'&&sel.indexOf('مؤشرات أداء')<0)boosts.push('الخطة تحتاج مؤشرات أداء واضحة حتى يمكن متابعة الإنجاز بدل الاكتفاء بوصف الإجراءات.');if(type()==='safety'&&sel.indexOf('نموذج متابعة')<0)boosts.push('في السلامة والصيانة، نموذج المتابعة أو الإغلاق التصحيحي يقوي إثبات الاستمرارية.');doc.getElementById('smBoosts').innerHTML='<div class="smTitle" style="font-size:14px;margin-top:12px">✨ عزّز توثيقك</div>'+boosts.map(function(x){return '<div class="smBoost">'+x+'</div>'}).join('')}renderEvidence();doc.getElementById('type').addEventListener('change',function(){renderEvidence();last=[];doc.getElementById('smResults').innerHTML='';doc.getElementById('smBoosts').innerHTML=''});doc.getElementById('smEvidence').addEventListener('change',function(){updateStatus();if(last.length)drawBoosts()});doc.getElementById('smAnalyze').onclick=analyze;doc.querySelectorAll('.smFlag').forEach(function(x){x.addEventListener('change',function(){if(last.length)analyze()})});doc.getElementById('gen').addEventListener('click',function(){setTimeout(analyze,120)});form.addEventListener('submit',function(){var title=doc.getElementById('title').value.trim(),date=doc.getElementById('date').value;if(!last.length)analyze();var chosen=[];doc.querySelectorAll('.smInd:checked').forEach(function(c){var i=last[+c.dataset.idx];if(i)chosen.push(i)});var evidence=[].map.call(doc.querySelectorAll('.smEv:checked'),function(x){return x.value});var flags=[].map.call(doc.querySelectorAll('.smFlag:checked'),function(x){return x.value});enrichDoc(title,date,{indicators:chosen,evidence:evidence,flags:flags,boosts:boosts})},true)}function locate(){try{var d1=base.contentDocument;if(!d1)return;var f1=d1.getElementById('v6');if(!f1)return;var d2=f1.contentDocument;if(!d2)return;var f2=d2.getElementById('app');if(!f2)return;function go(){try{setup(f2.contentDocument)}catch(e){console.error(e)}}f2.addEventListener('load',function(){setTimeout(go,250)});go()}catch(e){console.error(e)}}base.addEventListener('load',function(){setTimeout(locate,700)});setInterval(locate,1800)})();</script></body></html>
