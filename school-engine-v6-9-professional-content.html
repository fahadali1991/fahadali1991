<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.9</title><style>html,body{margin:0;height:100%;background:#f5f7f8;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-8-context-linked.html"></iframe><script>(function(){'use strict';const base=document.getElementById('base');function deep(f){try{let d=f.contentDocument;if(!d)return null;let fs=[...d.querySelectorAll('iframe')];if(!fs.length)return f;for(let x of fs){let r=deep(x);if(r)return r}return f}catch(e){return null}}function q(d,id){return(d.getElementById(id)?.value||'').trim()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fix(s){return String(s||'').replace(/الإنتباه/g,'الانتباه').replace(/الرجاءه/g,'الرجاء').replace(/مسئول/g,'مسؤول').replace(/مسئولية/g,'مسؤولية').replace(/الظغط/g,'الضغط').replace(/البرجكتر|البروجكتر/g,'البروجكتور').replace(/تقنيه/g,'تقنية').replace(/التقنيه/g,'التقنية').replace(/استراتيجيه/g,'استراتيجية').replace(/عمليه/g,'عملية').replace(/فعليه/g,'فعلية').replace(/النتيجه/g,'النتيجة').replace(/الاداه/g,'الأداة').replace(/الانشطه/g,'الأنشطة').replace(/الطلاب  /g,'الطلاب ').replace(/\s+([،؛:.])/g,'$1').trim()}const CFG={lesson:{groups:[['الأداة أو الوسيلة',['جهاز عرض','عرض تقديمي','فيديو تعليمي','منصة رقمية','تطبيق تعليمي','سبورة تفاعلية']],['دور الطلاب',['مشاهدة مركزة','مناقشة','حل نشاط','تطبيق عملي','إنتاج عمل','تعلم تعاوني']],['التحقق من التعلم',['أسئلة شفهية','ملاحظة الأداء','ورقة عمل','اختبار قصير','منتج تعلم','لم يتم القياس']],['النتيجة',['تحقق جيد','تحقق جزئي','يحتاج دعم','لم أقس الأثر']]],heads:['الهدف التعليمي والممارسة','التنفيذ','التحقق من التعلم','المتابعة والتحسين']},program:{groups:[['نوع التنفيذ',['عرض توعوي','نشاط تطب s:['الهدف والأدوار','التنفيذ','الأثر والقيمة المضافة','الاستدامة']},safety:{groups:[['نوع الإجراء',['جولة سلامة','إخلاء','توعية','صيانة','معالجة ملاحظة']],['الملاحظة',['لا توجد ملاحظات','ملاحظة بسيطة','ملاحظة تحتاج معالجة','حالة عاجلة']],['المتابعة',['إغلاق الملاحظة','طلب صيانة','إعادة فحص','توعية إضافية']]],heads:['الهدف والإجراء','التنفيذ والملاحظات','الإجراءات التصحيحية','المتابعة']}};function selected(card){let out={};card.querySelectorAll('.v69group').forEach(g=>{let k=g.dataset.k;out[k]=[...g.querySelectorAll('.v69chip.on')].map(b=>b.dataset.v)});out.note=fix(card.querySelector('#v69note')?.value||'');return out}function bullets(a){return a.filter(Boolean).map(x=>'• '+fix(x)).join('\n')}function topicTitle(t){return fix(t||'الموضوع')}function build(type,title,data){let gs=Object.values(data).filter(Array.isArray);let flat=gs.flat(),note=data.note||'';function has(x){return flat.includes(x)}let s=[];if(type==='lesson'){let tool=(data['الأداة أو الوسيلة']||[]).join(' و'),role=(data['دور الطلاب']||[]).join(' و'),check=(data['التحقق من التعلم']||[]).join(' و'),res=(data['النتيجة']||[])[0]||'';s=[[CFG.lesson.heads[0],bullets(['توظيف الممارسة «'+topicTitle(title)+'» لتحقيق ناتج تعلم واضح لدى الطلاب.',tool?'استخدام '+tool+' لدعم عرض المحتوى وتوضيح الأمثلة بما يخدم الهدف التعليمي.':'اختيار وسيلة مناسبة لطبيعة المحتوى والهدف التعليمي.','تهيئة الطلاب للمشاركة الفاعلة أثناء التعلم بدل الاكتفاء بالتلقي.'])],[CFG.lesson.heads[1],bullets([note||('نُفذت الممارسة باستخدام '+(tool||'الوسيلة التعليمية المحددة')+'.'),role?'شارك الطلاب من خلال '+role+'.':'شارك الطلاب في أنشطة مرتبطة بالمحتوى وفق ما تم تنفيذه فعليًا.','رُبط استخدام الوسيلة بخطوات الشرح والتطبيق داخل الحصة.'])],[CFG.lesson.heads[2],bullets([check?(check.includes('لم يتم القياس')?'لم يتم إجراء قياس مباشر للتعلم في هذه الممارسة.':'تم التحقق من التعلم باستخدام '+check+'.'):'لم يحدد المستخدم أداة تقويم؛ لذلك لا يفترض التقرير وجود قياس لم يتم توثيقه.',res?(res==='لم أقس الأثر'?'لم يُسجل حكم على الأثر لعدم وجود قياس موثق.':'أفاد المستخدم بأن مستوى التحقق كان: '+res+'.'):'لا تُثبت نتيجة أو تحسن دون إدخال صريح من المستخدم.'])],[CFG.lesson.heads[3],bullets(['تستخدم نتائج التقويم الفعلية لتحديد الطلاب الذين يحتاجون دعمًا أو إثراءً.','يُعاد توظيف الأداة أو الاستراتيجية إذا أثبتت فائدتها في تحقيق الهدف.','يُستكمل التوثيق بإضافة شاهد تعلم فعلي عند توفره.'])]]}else if(type==='program'){let kind=(data['نوع التنفيذ']||[]).join(' و'),part=(data['مشاركة المستفيدين']||[]).join(' و'),measure=(data['قياس الأثر']||[]).join(' و'),res=(data['النتيجة']||[])[0]||'';s=[[CFG.program.heads[0],bullets(['تنفيذ برنامج «'+topicTitle(title)+'» استجابةً لاحتياج تربوي أو تنظيمي محدد.','تحقيق أهداف واضحة مرتبطة بالفئة المستهدفة وطبيعة البرنامج.','توفير فرصة مشاركة مناسبة للمستفيدين وفق طبيعة النشاط.'])],[CFG.program.heads[1],bullets([note||('نُفذ البرنامج من خلال '+(kind||'أنشطة مناسبة لموضوع البرنامج')+'.'),part?'شارك المستفيدون من خلال '+part+'.':'لم يحدد المستخدم شكل المشاركة؛ لذلك يكتفي التقرير بوصف التنفيذ الموثق.','تم توثيق ما نُفذ دون إضافة أنشطة غير مدخلة.'])],[CFG.program.heads[2],bullets([measure?(measure.includes('لم يتم القياس')?'لم يتم تنفيذ قياس أثر مباشر.':'قيس الأثر باستخدام '+measure+'.'):'لم يحدد المستخدم أداة لقياس الأثر.',res?(res==='لم أقس الأثر'?'لا يثبت التقرير تحقق أثر لعدم وجود قياس.':'أفاد المستخدم بأن النتيجة كانت: '+res+'.'):'لا يثبت التقرير نتيجة غير موثقة.'])],[CFG.program.heads[3],bullets(['الاستمرار في الجوانب التي دعمت تحقيق الهدف عند ثبوت فاعليتها.','معالجة أي جوانب تحتاج متابعة وفق النتائج الفعلية.','الاحتفاظ بالشواهد المرتبطة بالتنفيذ والنتائج.'])]]}else{let c=CFG[type]||CFG.program;s=c.heads.map((h,i)=>[h,bullets([i===0?'يتناول هذا القسم «'+topicTitle(title)+'» وفق المعلومات التي أكدها المستخدم.':i===1?(note||'تم تنفيذ ما تم توثيقه وفق الاختيارات المحددة في النموذج.'):'بُني هذا القسم على الاختيارات المحددة دون افتراض معلومات إضافية.',...(i===1&&flat.length?['العناصر الموثقة: '+flat.join('، ')+'.']:[])])])}return s}function render(d,s){let box=d.getElementById('sections'),gb=d.getElementById('genBox');if(!box||!gb)return;box.innerHTML=s.map(([h,b])=>`<div class="sec v66sec"><div class="v66head"><h4>${esc(h)}</h4><button type="button" class="v66expand">⛶ تكبير المحرر</button></div><textarea>${esc(fix(b))}</textarea></div>`).join('');gb.style.display='block';let info=d.getElementById('v69used');if(info)info.remove();info=d.createElement('div');info.id='v69used';info.innerHTML='<b>✅ صيغ المحتوى من اختياراتك فقط</b><div>يمكنك تعديل أي قسم قبل الحفظ. لم يضف المحرك نتيجة أو أثرًا لم تؤكده.</div>';gb.insertBefore(info,gb.firstChild)}function makeCard(d){let old=d.getElementById('v66context');if(old)old.style.display='none';if(d.getElementById('v69card'))return;let card=d.createElement('div');card.id='v69card';card.innerHTML='<div class="v69top"><div><h3>🧭 ما تم توثيقه</h3><p>اختر بسرعة، والمحرك يكتب التقرير. لا تحتاج لكتابة شرح طويل.</p></div><span>V6.9</span></div><div id="v69groups"></div><div class="v69note"><label>أضف شيئًا مهمًا حدث <small>اختياري</small></label><textarea id="v69note" placeholder="مثال: استخدمت البروجكتور لعرض أمثلة ثم حل الطلاب نشاطًا قصيرًا"></textarea></div><button type="button" id="v69enough">✓ اكتفِ بهذه المعلومات وأنشئ المحتوى</button>';let gen=d.getElementById('gen');let genCard=gen?.closest('.f.full')||gen?.parentElement;if(genCard)genCard.parentNode.insertBefore(card,genCard);function rebuild(){let type=q(d,'type')||'program',cfg=CFG[type]||CFG.program,g=d.getElementById('v69groups');g.innerHTML=cfg.groups.map(([k,vs])=>`<div class="v69group" data-k="${esc(k)}"><b>${esc(k)}</b><div>${vs.map(v=>`<button type="button" class="v69chip" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('')}rebuild();let typeEl=d.getElementById('type');if(typeEl)typeEl.addEventListener('change',rebuild);card.addEventListener('click',e=>{let b=e.target.closest('.v69chip');if(b){b.classList.toggle('on');return}if(e.target.id==='v69enough'){let title=q(d,'title');if(!title){alert('اكتب عنوان الوثيقة أولًا');return}render(d,build(q(d,'type')||'program',title,selected(card)));setTimeout(()=>d.getElementById('genBox')?.scrollIntoView({behavior:'smooth',block:'start'}),80)}});if(gen){gen.textContent='إنشاء المحتوى المهني';gen.onclick=function(e){e.preventDefault();let title=q(d,'title');if(!title){alert('اكتب عنوان الوثيقة أولًا');return}render(d,build(q(d,'type')||'program',title,selected(card)))}}}function patch(){let f=deep(base);if(!f)return;try{let d=f.contentDocument;if(!d)return;if(!d.getElementById('v69style')){let s=d.createElement('style');s.id='v69style';s.textContent=`#v69card{background:#fff;border:1px solid #cfe1dc;border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 5px 18px rgba(21,68,90,.06)}.v69top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.v69top h3{margin:0;color:#15445A;font-size:19px}.v69top p{margin:4px 0 0;color:#6d797f;font-size:13px;line-height:1.6}.v69top span{font-size:11px;background:#eaf7f2;color:#078257;padding:5px 8px;border-radius:9px;font-weight:800}.v69group{margin-top:13px}.v69group>b{display:block;color:#15445A;margin-bottom:7px;font-size:14px}.v69group>div{display:flex;flex-wrap:wrap;gap:7px}.v69chip{background:#f6f8f9!important;color:#27404a!important;border:1px solid #d9e2e5!important;border-radius:999px!important;padding:9px 12px!important;font-size:13px!important}.v69chip.on{background:#e7f7f1!important;color:#067b52!important;border-color:#72c5a8!important;font-weight:800!important}.v69note{margin-top:14px}.v69note label{display:block;color:#15445A;font-weight:800;margin-bottom:6px}.v69note small{font-weight:400;color:#899398}.v69note textarea{width:100%;height:90px!important;min-height:90px!important;max-height:120px!important;font-size:16px!important;line-height:1.8!important;padding:11px!important;border-radius:12px!important;overflow-y:auto!important}#v69enough{width:100%;margin-top:12px;background:#07A869!important;color:#fff!important;border-color:#07A869!important;min-height:48px!important;font-weight:800!important;font-size:15px!important}#v69used{background:#edf8f4;border:1px solid #b9ddd3;border-radius:12px;padding:10px 12px;margin-bottom:10px;color:#15445A;font-size:13px;line-height:1.7}#v69used b{display:block;color:#078257;margin-bottom:3px}@media(max-width:600px){#v69card{padding:12px}.v69chip{font-size:13px!important;padding:9px 11px!important}.v69note textarea{font-size:17px!important}}`;d.head.appendChild(s)}makeCard(d)}catch(e){console.error(e)}}base.addEventListener('load',()=>setTimeout(patch,1600));setInterval(patch,650)})();</script></body></html>
