<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>محرك توثيق المدرسة الذكي V8.1</title><style>html,body{margin:0;height:100%;background:#f4f7f6}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="school-engine-v8-committee.html"></iframe><script>
(function(){'use strict';
const app=document.getElementById('app');let pendingFiles=[];
const SETTINGS_KEY='schoolEngineIdentityV81';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getIdentity(){try{return Object.assign({school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',principal:'',preparer:''},JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch(e){return{school:'مدرسة حطين المتوسطة',office:'الإدارة العامة للتعليم بمنطقة نجران',principal:'',preparer:''}}}
function saveIdentity(d){localStorage.setItem(SETTINGS_KEY,JSON.stringify(d))}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function patch(){let w=app.contentWindow,d=app.contentDocument;if(!d||!w||w.__v81)return;if(!d.getElementById('flowForm')){setTimeout(patch,300);return}w.__v81=true;
  const style=d.createElement('style');style.textContent=`.v81Upload{border:1.5px dashed #9fc9be;border-radius:16px;padding:14px;background:#f8fcfb}.v81Upload input{width:100%}.v81Files{display:grid;gap:8px;margin-top:10px}.v81File{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #dfe7e4;border-radius:12px;padding:9px;background:#fff}.v81File img{width:62px;height:62px;object-fit:cover;border-radius:9px;border:1px solid #e2e8e6}.v81FileInfo{flex:1;min-width:0}.v81FileInfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v81Settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:600px){.v81Settings{grid-template-columns:1fr}}` ;d.head.appendChild(style);
  const p3=d.getElementById('p3');const upload=d.createElement('div');upload.className='field';upload.innerHTML=`<label>رفع الشواهد والمرفقات</label><div class="v81Upload"><input id="v81FilesInput" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"><div class="tiny" style="margin-top:6px">يمكن رفع الصور وPDF والشهادات والملفات. تحفظ مع السجل على هذا الجهاز.</div><div id="v81FilesList" class="v81Files"></div></div>`;p3.insertBefore(upload,p3.firstChild);
  const inp=d.getElementById('v81FilesInput');inp.addEventListener('change',e=>{pendingFiles.push(...Array.from(e.target.files||[]));e.target.value='';renderFiles(d)});
  const settings=d.querySelector('#settings .card');if(settings){let box=d.createElement('div');box.innerHTML=`<hr style="border:0;border-top:1px solid #dfe7e4;margin:18px 0"><h3>هوية التقرير والطباعة</h3><div class="v81Settings"><div class="field"><label>اسم المدرسة</label><input id="v81School"></div><div class="field"><label>الإدارة / مكتب التعليم</label><input id="v81Office"></div><div class="field"><label>اسم مدير المدرسة</label><input id="v81Principal"></div><div class="field"><label>اسم مُعد الوثيقة الافتراضي</label><input id="v81Preparer"></div></div><button class="secondary" id="v81SaveIdentity">حفظ بيانات الهوية</button>`;settings.appendChild(box);let id=getIdentity();d.getElementById('v81School').value=id.school;d.getElementById('v81Office').value=id.office;d.getElementById('v81Principal').value=id.principal;d.getElementById('v81Preparer').value=id.preparer;d.getElementById('v81SaveIdentity').onclick=()=>{saveIdentity({school:d.getElementById('v81School').value.trim(),office:d.getElementById('v81Office').value.trim(),principal:d.getElementById('v81Principal').value.trim(),preparer:d.getElementById('v81Preparer').value.trim()});alert('تم حفظ بيانات الهوية والطباعة')};}
  const origOpen=w.openFlow;w.openFlow=function(type,rec){pendingFiles=rec&&rec.files?Array.from(rec.files):[];let r=origOpen.apply(this,arguments);setTimeout(()=>renderFiles(d),30);return r};
  const origPut=w.putWork;w.putWork=function(rec){rec.files=Array.from(pendingFiles);return origPut.call(this,rec)};
  w.removeV81File=function(i){pendingFiles.splice(i,1);renderFiles(d)};
  w.printRecord=function(id){const rec=(w.works||[]).find(x=>x.id===id);if(rec)premiumPrint(rec,w)};
  const origView=w.viewRecord;w.viewRecord=function(id){origView.call(this,id);setTimeout(()=>injectViewerFiles(id,w,d),20)};
  const oldClose=w.closeFlow;w.closeFlow=function(){pendingFiles=[];return oldClose.apply(this,arguments)};
}
function renderFiles(d){let box=d.getElementById('v81FilesList');if(!box)return;box.innerHTML=pendingFiles.length?pendingFiles.map((f,i)=>{let img=f.type&&f.type.startsWith('image/')?`<img data-file-index="${i}">`:'<div style="width:62px;height:62px;border-radius:9px;background:#eef3f1;display:grid;place-items:center;font-size:28px">📎</div>';return`<div class="v81File">${img}<div class="v81FileInfo"><b>${esc(f.name)}</b><span class="tiny">${esc(f.type||'ملف')} · ${size(f.size||0)}</span></div><button type="button" class="dangerBtn" onclick="removeV81File(${i})">إزالة</button></div>`}).join(''):'<div class="tiny">لم تُرفع ملفات بعد.</div>';box.querySelectorAll('img[data-file-index]').forEach(img=>{let f=pendingFiles[+img.dataset.fileIndex],u=URL.createObjectURL(f);img.src=u;img.onload=()=>URL.revokeObjectURL(u)})}
function injectViewerFiles(id,w,d){let rec=(w.works||[]).find(x=>x.id===id);if(!rec||!rec.files||!rec.files.length)return;let body=d.getElementById('viewerBody');let block=d.createElement('div');block.className='card';block.innerHTML=`<h3>المرفقات المرفوعة</h3><div class="v81Files">${rec.files.map((f,i)=>`<div class="v81File"><div class="v81FileInfo"><b>${esc(f.name)}</b><span class="tiny">${esc(f.type||'ملف')} · ${size(f.size||0)}</span></div><button class="ghost" data-open="${i}">فتح</button></div>`).join('')}</div>`;block.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let f=rec.files[+b.dataset.open],u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)});body.appendChild(block)}
function fileToData(f){return new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)})}
async function premiumPrint(rec,w){let id=getIdentity(),t=(w.TYPES||[]).find(x=>x.id===rec.type)||{label:'وثيقة مدرسية'},imgs=[];for(let f of(rec.files||[])){if(f.type&&f.type.startsWith('image/')){let src=await fileToData(f);if(src)imgs.push({name:f.name,src})}}let others=(rec.files||[]).filter(f=>!(f.type||'').startsWith('image/'));let sections=rec.generated&&rec.generated.length?rec.generated:[['وصف العمل',rec.whatDone||rec.desc||'']];let grades=(rec.grades||[]).join('، '),scope=[rec.stage,grades].filter(Boolean).join(' - '),prep=rec.owner||id.preparer||'........................';let photos=imgs.length?`<section class="evidence"><div class="eHead"><span></span><h2>الشواهد المصورة</h2></div><div class="photoGrid">${imgs.map((x,i)=>`<figure><div class="photo"><img src="${x.src}"></div><figcaption>شاهد مصور ${i+1}${x.name?' - '+esc(x.name):''}</figcaption></figure>`).join('')}</div></section>`:'';let files=others.length?`<section class="files"><div class="eHead"><span></span><h2>المرفقات</h2></div><table><thead><tr><th>#</th><th>اسم الملف</th><th>النوع</th><th>الحجم</th></tr></thead><tbody>${others.map((f,i)=>`<tr><td>${i+1}</td><td>${esc(f.name)}</td><td>${esc(f.type||'ملف')}</td><td>${size(f.size||0)}</td></tr>`).join('')}</tbody></table></section>`:'';let ev=(rec.evidence||rec.evidenceTypes||[]).length?`<div class="evidenceTags">${(rec.evidence||rec.evidenceTypes||[]).map(e=>`<span>${esc(e)}</span>`).join('')}</div>`:'';
let html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(rec.title||t.label)}</title><style>@page{size:A4;margin:11mm 12mm 12mm}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;color:#16343c;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11.5pt}.topbar{height:5px;background:linear-gradient(90deg,#08a66b 0 27%,#0aa6a6 27% 52%,#3e7eb8 52% 77%,#17465b 77%);margin-bottom:10px}.mast{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;border-bottom:1.5px solid #d7e2e6;padding:4px 0 10px}.moe{font-weight:900;color:#15445a;font-size:15pt;line-height:1.55}.school{text-align:center}.school b{font-size:17pt;color:#15445a}.school div{color:#69787e;font-size:9.5pt;margin-top:3px}.mark{text-align:left;color:#718087;font-size:9pt}.mark b{display:block;color:#15445a;font-size:10.5pt}.identity{text-align:center;padding:13px 5px 8px}.doctype{display:inline-block;color:#3d7eb9;font-weight:800;border-bottom:2px solid #0aa6a6;padding:3px 13px;margin-bottom:7px}.title{font-size:20pt;font-weight:900;margin:0;color:#132f3d}.meta{border:1px solid #d7e2e6;border-radius:12px;overflow:hidden;margin:9px 0 14px;background:#fbfcfc}.metaRow{display:grid;grid-template-columns:repeat(3,1fr)}.metaRow+ .metaRow{border-top:1px solid #e1e8eb}.mi{padding:8px 10px;border-left:1px solid #e1e8eb;min-height:48px}.mi:last-child{border-left:0}.lab{font-size:8.8pt;color:#718087;font-weight:700}.val{display:block;margin-top:3px;font-weight:800;color:#183846;line-height:1.35}.sec{margin:0 0 10px;break-inside:avoid-page}.sh{display:flex;align-items:center;gap:8px}.num{width:24px;height:24px;border-radius:50%;background:#eaf7f2;color:#078257;display:grid;place-items:center;font-weight:900;font-size:9pt}.sh h2{font-size:13.5pt;margin:0;color:#15445a}.sh:after{content:'';height:1px;background:#d9e3e7;flex:1}.body{padding:5px 31px 2px 4px;white-space:pre-line;line-height:1.75;color:#263940}.eHead{display:flex;align-items:center;gap:8px;margin:13px 0 8px}.eHead span{width:5px;height:24px;border-radius:5px;background:#08a66b}.eHead h2{margin:0;color:#15445a;font-size:13.5pt}.evidenceTags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 10px}.evidenceTags span{border:1px solid #cfe4de;background:#f2faf7;border-radius:999px;padding:4px 8px;font-size:9pt}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photoGrid figure{margin:0;border:1px solid #dce5e8;border-radius:10px;padding:6px;break-inside:avoid-page}.photo{height:185px;display:flex;align-items:center;justify-content:center;background:#f7f9f9;border-radius:7px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photoGrid figcaption{text-align:center;font-size:8.5pt;color:#65747a;padding-top:5px}table{width:100%;border-collapse:collapse;font-size:9pt}th,td{border:1px solid #dce5e8;padding:6px;text-align:right}th{background:#f1f7f5;color:#15445a}.sign{display:grid;grid-template-columns:1fr 1fr;gap:55px;border-top:1px solid #d8e1e5;margin-top:18px;padding-top:12px;break-inside:avoid-page}.sig{text-align:center;min-height:70px}.sig small{color:#69787e;font-weight:700}.sig b{display:block;margin-top:5px}.line{width:70%;border-bottom:1px dotted #9ca9af;margin:24px auto 0}.foot{display:flex;justify-content:space-between;color:#859198;border-top:1px solid #edf1f2;margin-top:10px;padding-top:6px;font-size:8pt}@media print{.sec,figure,.sign{break-inside:avoid-page}}</style></head><body><div class="topbar"></div><header class="mast"><div class="moe">وزارة التعليم<br><span style="font-size:9pt;color:#6e7d83;font-weight:700">المملكة العربية السعودية</span></div><div class="school"><b>${esc(id.school||'اسم المدرسة')}</b><div>${esc(id.office||'')}</div></div><div class="mark"><b>التوثيق المدرسي</b>وثيقة مهيأة للاعتماد والحفظ</div></header><div class="identity"><div class="doctype">${esc(t.label)}</div><h1 class="title">${esc(rec.title||t.label)}</h1></div><section class="meta"><div class="metaRow"><div class="mi"><span class="lab">التاريخ</span><span class="val">${esc(rec.date||'-')}</span></div><div class="mi"><span class="lab">المرحلة / الصف</span><span class="val">${esc(scope||'-')}</span></div><div class="mi"><span class="lab">المستفيدون</span><span class="val">${esc(rec.beneficiaryGroup||'-')} ${rec.beneficiaries?`(${rec.beneficiaries})`:''}</span></div></div><div class="metaRow"><div class="mi"><span class="lab">المكان</span><span class="val">${esc(rec.place||'-')}</span></div><div class="mi"><span class="lab">المسؤول / المنفذ</span><span class="val">${esc(rec.owner||'-')}</span></div><div class="mi"><span class="lab">حالة التوثيق</span><span class="val">${esc(rec.status||'مكتمل')}</span></div></div></section>${sections.map((s,i)=>`<section class="sec"><div class="sh"><span class="num">${i+1}</span><h2>${esc(s[0])}</h2></div><div class="body">${esc(s[1])}</div></section>`).join('')}<section><div class="eHead"><span></span><h2>الشواهد والمرفقات</h2></div>${ev||'<div style="color:#6f7e83">لم تُحدد أنواع شواهد.</div>'}${rec.evidenceLink?`<div style="font-size:9pt;margin:6px 0"><b>رابط الشاهد:</b> ${esc(rec.evidenceLink)}</div>`:''}</section>${photos}${files}<section class="sign"><div class="sig"><small>إعداد الوثيقة</small><b>${esc(prep)}</b><div class="line"></div></div><div class="sig"><small>اعتماد مدير المدرسة</small><b>${esc(id.principal||'........................')}</b><div class="line"></div></div></section><footer class="foot"><span>${esc(id.school||'التوثيق المدرسي')}</span><span>${esc(t.label)}</span></footer><script>window.onload=function(){setTimeout(function(){window.print()},350)}<\/script></body></html>`;let win=window.open('','_blank');if(!win){alert('اسمح بالنوافذ المنبثقة للطباعة مرة واحدة');return}win.document.open();win.document.write(html);win.document.close()}
app.addEventListener('load',()=>setTimeout(patch,350));setTimeout(patch,700);
})();
</script></body></html>
