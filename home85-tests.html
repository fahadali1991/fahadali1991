<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,sans-serif;background:#f5f7f6;color:#17332a;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce6e1;border-radius:18px;padding:18px;margin:12px 0}.ok{border-right:5px solid #23845b}.bad{border-right:5px solid #b64646}.summary{font-size:1.2rem;font-weight:800}.muted{color:#6b7c75;font-size:.9rem}pre{white-space:pre-wrap;word-break:break-word;background:#f7f9f8;padding:10px;border-radius:10px;font-size:.82rem}</style></head><body><main class="wrap"><h1>اختبارات V85</h1><div id="summary" class="card summary">جارٍ التشغيل...</div><div id="out"></div></main><script type="module">import{runContext85Tests}from'./v10/context85-tests.js?v=85';const r=runContext85Tests(),pass=r.filter(x=>x.pass).length;document.getElementById('summary').textContent=`${pass}/${r.length} حالة ناجحة`;document.getElementById('out').innerHTML=r.map(x=>`<section class="card ${x.pass?'ok':'bad'}"><b>${x.pass?'ناجح':'فشل'} — ${x.name}</b><p>${x.raw}</p><div class="muted">النوع: ${x.actual.type||'غير محسوم'}</div>${x.pass?'':`<pre>${JSON.stringify(x.actual.context,null,2)}</pre>`}</section>`).join('');</script></body></html>
