<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار V101 الصارم</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f6f8f7;color:#17231f;margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde6e2;border-radius:18px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;background:#f4f8f6;text-align:center}.stat b{display:block;font-size:24px}.ok{color:#16634f}.bad{color:#9e3b32}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e7ecea;text-align:right;vertical-align:top}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf4f1;margin:2px}.fail{background:#fff1ef}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}table{font-size:11px}}</style></head><body><main class="wrap"><div class="card"><h1>بنك قبول V101 — المحرك الجديد</h1><p>اختبار صارم: الحقائق المتوقعة + ما يجب أن يبقى مجهولًا + الممنوعات. الفصحى مرجع، واللهجة السعودية والضوضاء طبقات تحمل ثانوية.</p><div id="stats" class="stats"></div></div><div class="card"><h2>حسب سجل اللغة</h2><div id="registers"></div></div><div class="card"><h2>أول حالات الفشل</h2><div style="overflow:auto"><table><thead><tr><th>الحالة</th><th>الإدخال</th><th>الاختلاف</th></tr></thead><tbody id="fails"></tbody></table></div></div></main><script type="module">import{summarizeBank101v2}from'./v10/bank-runner101-v2.js?v=101';const r=summarizeBank101v2();document.querySelector('#stats').innerHTML=`<div class="stat"><b>${r.total}</b>إجمالي</div><div class="stat ok"><b>${r.passed}</b>ناجحة</div><div class="stat bad"><b>${r.failed}</b>فاشلة</div><div class="stat"><b>${r.passRate}%</b>النسبة</div>`;document.querySelector('#registers').innerHTML=Object.entries(r.byRegister).map(([k,v])=>`<span class="pill">${k}: ${v.passed}/${v.total}</span>`).join('');document.querySelector('#fails').innerHTML=r.topFailures.map(x=>`<tr class="fail"><td>${x.id}</td><td>${x.input}</td><td>${x.failed.map(f=>`${f.key}: المطلوب «${f.want}» / الحالي «${String(f.got??'—')}»`).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد حالات فشل</td></tr>';</script></body></html>
