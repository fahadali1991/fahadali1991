name: School Engine Quality Gate
on:
  push:
    branches: [v106-engineering-foundation, v106-adaptive-ui, v109-main-clean, v109-workspace-cleanup, v110-deep-acceptance-lab, v110-visible-description-fix, v110-2-acceptance-browser, v113-canonical-recovery, main]
    paths:
      - 'index.html'
      - 'v10/**'
      - 'home106.html'
      - 'tests-v120-committee-fixes.mjs'
      - 'tests-v121-analysis-release.mjs'
      - 'tests-v122-analysis-contract.mjs'
      - 'tests-v125-analysis-plans.mjs'
      - '.github/workflows/v106-engineering-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'v10/**'
      - 'home106.html'
      - 'tests-v120-committee-fixes.mjs'
      - 'tests-v121-analysis-release.mjs'
      - 'tests-v122-analysis-contract.mjs'
      - 'tests-v125-analysis-plans.mjs'
      - '.github/workflows/v106-engineering-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V106 canonical state, router and generator tests
        run: node --experimental-default-type=module v10/engineering106-tests.js
      - name: V106 sequential adaptive UI logic tests
        run: node --experimental-default-type=module v10/adaptive-ui106-tests.js
      - name: Full teacher-stage-document UX matrix
        run: node --experimental-default-type=module v10/ux-matrix106-tests.js
      - name: V107 adaptive PDF schema and print tests
        run: node --experimental-default-type=module v10/pdf-schema107-tests.js
      - name: V107 PDF renderer tests
        run: node --experimental-default-type=module v10/pdf-renderer107-tests.js
      - name: V108 title sequence and proofreader tests
        run: node --experimental-default-type=module v10/title-spelling108-tests.js
      - name: V109 source-to-question contract audit
        run: node --experimental-default-type=module v10/source-audit109-tests.js
      - name: V109 workspace archive/navigation contract
        run: node --experimental-default-type=module v10/workspace109-tests.js
      - name: V110 deep multi-role acceptance and visible-copy test
        run: node --experimental-default-type=module v10/deep-acceptance110-tests.js
      - name: V110.1 actual visible description variants
        run: node --experimental-default-type=module v10/visible-description110-tests.js
      - name: V110.2 deep change-of-mind, mobile, PDF and cache acceptance
        run: node --experimental-default-type=module v10/acceptance1102-tests.js
      - name: V113 canonical UX regression — enter once, derive what is knowable, print analysis
        run: node --experimental-default-type=module v10/canonical-ux113-tests.js
      - name: V120 committee fixes — locale numbers and curriculum safety
        run: node tests-v120-committee-fixes.mjs
      - name: V121 analysis release contract — mastery, execution state and next steps
        run: node tests-v121-analysis-release.mjs
      - name: V122 analysis contract — aliases, school identity and print structure
        run: node tests-v122-analysis-contract.mjs
      - name: V125 analysis plans — actual-score targeting and no false impact
        run: node tests-v125-analysis-plans.mjs
      - name: Install Chromium acceptance runtime
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: V124 root entrypoint — mobile and desktop must reach tested V123 app
        run: |
          python3 -m http.server 4173 >/tmp/school-engine-root124-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node v10/root-entry124-tests.mjs
      - name: V110.2 real browser mobile and desktop journeys
        run: |
          python3 -m http.server 4173 >/tmp/school-engine-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node v10/browser1102-tests.mjs
      - name: V123 analysis acceptance — mobile, desktop, retention, native share and one-page A4
        run: |
          python3 -m http.server 4173 >/tmp/school-engine-v123-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node v10/analysis-visual123-tests.mjs
      - name: V125 analysis plans acceptance — mobile and desktop
        run: |
          python3 -m http.server 4173 >/tmp/school-engine-v125-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node v10/analysis-plans125-browser.mjs
      - name: Upload analysis visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-visual-v123-v125
          path: artifacts/
          if-no-files-found: ignore
      - name: Browser module syntax checks
        run: node --check v10/family-details106.js && node --check v10/family-details109.js && node --check v10/subject-selector109.js && node --check v10/matrix106.js && node --check v10/question-router106.js && node --check v10/source-contract109.js && node --check v10/document-repository106.js && node --check v10/storage-v53.js && node --check v10/workspace109.js && node --check v10/app103.js && node --check v10/pdf-schema107.js && node --check v10/pdf-layout107.js && node --check v10/pdf-model107.js && node --check v10/pdf-renderer107.js && node --check v10/pdf-analysis113.js && node --check v10/analysis-data113.js && node --check v10/analysis-plans125.js && node --check v10/canonical-ux113-tests.js && node --check v10/title108.js && node --check v10/title-page108.js && node --check v10/spelling108.js && node --check v10/goals76.js && node --check v10/generators106.js && node --check v10/deep-acceptance110-tests.js && node --check v10/description-texts80.js && node --check v10/description-variants88.js && node --check v10/visible-description110-tests.js && node --check v10/acceptance1102-tests.js && node --check v10/browser1102-tests.mjs && node --check v10/root-entry124-tests.mjs && node --check v10/analysis-visual123-tests.mjs && node --check v10/analysis-plans125-browser.mjs && node --check tests-v120-committee-fixes.mjs && node --check tests-v121-analysis-release.mjs && node --check tests-v122-analysis-contract.mjs && node --check tests-v125-analysis-plans.mjs
      - name: Existing V85 regression tests
        run: node --experimental-default-type=module v10/run-context85-tests.js
      - name: Canonical and workspace layers must not use sessionStorage
        run: |
          if grep -R "sessionStorage" v10/canonical-context106.js v10/question-router106.js v10/generators106.js v10/skill-resolver106.js v10/matrix106.js v10/family-details106.js v10/family-details109.js v10/subject-selector109.js v10/source-contract109.js v10/document-repository106.js v10/workspace109.js v10/pdf-schema107.js v10/pdf-layout107.js v10/pdf-model107.js v10/pdf-renderer107.js v10/pdf-analysis113.js v10/analysis-data113.js v10/analysis-plans125.js v10/title108.js v10/title-page108.js v10/spelling108.js v10/goals76.js v10/description-texts80.js; then
            echo "Canonical/workspace state must use document repository only"; exit 1
          fi
