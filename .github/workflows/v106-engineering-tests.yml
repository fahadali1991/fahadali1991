name: School Engine Quality Gate
on:
  push:
    branches: [v106-engineering-foundation, v106-adaptive-ui, v109-main-clean, main]
    paths:
      - 'v10/**'
      - 'home106.html'
      - '.github/workflows/v106-engineering-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v10/**'
      - 'home106.html'
      - '.github/workflows/v106-engineering-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V106 canonical state, router and generator tests
        run: node --experimental-default-type=module v10/engineering106-tests.js
      - name: V106 sequential adaptive UI logic tests
        run: node --experimental-default-type=module v10/adaptive-ui106-tests.js
      - name: Full teacher-stage-document UX matrix
        run: node --experimental-default-type=module v10/ux-matrix106-tests.js
      - name: V107 adaptive PDF schema and print tests
        run: node --experimental-default-type=module v10/pdf-schema107-tests.js
      - name: V107 PDF renderer tests
        run: node --experimental-default-type=module v10/pdf-renderer107-tests.js
      - name: V108 title sequence and proofreader tests
        run: node --experimental-default-type=module v10/title-spelling108-tests.js
      - name: V109 source-to-question contract audit
        run: node --experimental-default-type=module v10/source-audit109-tests.js
      - name: Browser module syntax checks
        run: node --check v10/family-details106.js && node --check v10/family-details109.js && node --check v10/subject-selector109.js && node --check v10/matrix106.js && node --check v10/question-router106.js && node --check v10/source-contract109.js && node --check v10/document-repository106.js && node --check v10/storage-v53.js && node --check v10/workspace109.js && node --check v10/app103.js && node --check v10/pdf-schema107.js && node --check v10/pdf-layout107.js && node --check v10/pdf-model107.js && node --check v10/pdf-renderer107.js && node --check v10/title108.js && node --check v10/title-page108.js && node --check v10/spelling108.js
      - name: Existing V85 regression tests
        run: node --experimental-default-type=module v10/run-context85-tests.js
      - name: Canonical core must not use sessionStorage
        run: |
          if grep -R "sessionStorage" v10/canonical-context106.js v10/question-router106.js v10/generators106.js v10/skill-resolver106.js v10/matrix106.js v10/family-details106.js v10/family-details109.js v10/subject-selector109.js v10/source-contract109.js v10/pdf-schema107.js v10/pdf-layout107.js v10/pdf-model107.js v10/pdf-renderer107.js v10/title108.js v10/title-page108.js v10/spelling108.js; then
            echo "Canonical core must use document state only"; exit 1
          fi
