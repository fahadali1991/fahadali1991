name: V85 Context Tests
on:
  push:
    branches: [main]
    paths:
      - 'v10/context85.js'
      - 'v10/engine85.js'
      - 'v10/context85-tests.js'
      - 'v10/run-context85-tests.js'
      - '.github/workflows/v85-context-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V85 context regression tests
        run: node --experimental-default-type=module v10/run-context85-tests.js
