name: V133 Analysis Deep Review Gate
on:
  push:
    branches: [v133-analysis-deep-review]
    paths:
      - 'v10/school-profile133.js'
      - 'v10/school-profile133-browser.mjs'
      - 'v10/analysis-**'
      - 'v10/final76.js'
      - 'v10/family-details*.js'
      - 'v10/question-router106.js'
      - 'v10/goals76.js'
      - 'v10/title-page71.js'
      - 'v10/evidence85.js'
      - 'v10/app88.js'
      - 'home106.html'
      - 'tests-v129-evaluation-rules.mjs'
      - 'tests-v130-analysis-policy.mjs'
      - 'tests-v131-explicit-criterion.mjs'
      - 'tests-v132-analysis-output.mjs'
      - 'tests-v133-analysis-flow.mjs'
      - 'tests-v133-school-profile.mjs'
      - '.github/workflows/v133-analysis-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v10/school-profile133.js'
      - 'v10/school-profile133-browser.mjs'
      - 'v10/analysis-**'
      - 'v10/final76.js'
      - 'v10/family-details*.js'
      - 'v10/question-router106.js'
      - 'v10/goals76.js'
      - 'v10/title-page71.js'
      - 'v10/evidence85.js'
      - 'v10/app88.js'
      - 'home106.html'
      - 'tests-v129-evaluation-rules.mjs'
      - 'tests-v130-analysis-policy.mjs'
      - 'tests-v131-explicit-criterion.mjs'
      - 'tests-v132-analysis-output.mjs'
      - 'tests-v133-analysis-flow.mjs'
      - 'tests-v133-school-profile.mjs'
      - '.github/workflows/v133-analysis-review.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analysis policy regression
        run: |
          node tests-v129-evaluation-rules.mjs
          node tests-v130-analysis-policy.mjs
          node tests-v131-explicit-criterion.mjs
          node tests-v132-analysis-output.mjs
      - name: V133 analysis flow unit
        run: node tests-v133-analysis-flow.mjs
      - name: V133 school profile unit
        run: node tests-v133-school-profile.mjs
      - name: V133 syntax
        run: |
          node --check v10/school-profile133.js
          node --check v10/school-profile133-browser.mjs
          node --check v10/analysis-final133.js
          node --check v10/analysis-output133.js
          node --check v10/analysis-decision131.js
          node --check v10/analysis-plans131.js
          node --check v10/family-details109.js
          node --check v10/question-router106.js
          node --check v10/final76.js
          node --check tests-v133-analysis-flow.mjs
          node --check tests-v133-school-profile.mjs
      - name: Active V133 criterion module URL guard
        run: |
          if grep -n "analysis-data131.js?v=131" v10/family-details109.js v10/analysis-decision131.js v10/analysis-plans131.js v10/analysis-final133.js v10/analysis-output133.js; then
            echo "Active V133 Analysis path must instantiate analysis-data131 through one URL only"; exit 1
          fi
      - name: Persistent profile storage guard
        run: |
          if grep -E "sessionStorage|localStorage" v10/school-profile133.js; then
            echo "Permanent school profile must stay in IndexedDB"; exit 1
          fi
      - name: Install Chromium
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: V133 mobile and desktop school-profile acceptance
        run: |
          mkdir -p artifacts
          python3 -m http.server 4173 >/tmp/v133-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node v10/school-profile133-browser.mjs
      - name: Upload V133 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v133-analysis-review-evidence
          path: artifacts/
          if-no-files-found: ignore
