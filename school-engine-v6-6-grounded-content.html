<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.6</title><style>html,body{margin:0;height:100%;background:#f5f7f8}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="base" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-5-direct-print-editor.html"></iframe><script>(function(){'use strict';const base=document.getElementById('base');function deep(f){try{let d=f.contentDocument;if(!d)return null;let fs=[...d.querySelectorAll('iframe')];if(!fs.length)return f;for(let x of fs){let r=deep(x);if(r)return r}return f}catch(e){return null}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s||'').toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'')}function lines(a){return a.filter(Boolean).map(x=>'• '+x).join('\n')}function topic(title){let t=norm(title);if(/كتابه|كتابة|الخط|خط |املاء|إملاء/.test(t))return'writing';if(/قراء|قرائي/.test(t))return'reading';if(/انضباط|سلوك|مواظب|غياب|تأخر/.test(t))return'discipline';if(/وطني|وطن|هويه|هوية|تأسيس/.test(t))return'national';if(/نافس|اختبار|نتائج|تحصيل/.test(t))return'results';if(/تقنيه|تقنية|رقمي|منصة|ذكاء اصطناعي/.test(t))return'tech';if(/سلامه|سلامة|اخلاء|إخلاء|حريق|طوارئ/.test(t))return'safety';if(/تدريب|ورشه|ورشة|تطوير مهني/.test(t))return'training';return'general'}function val(d,id){return d.getElementById(id)?.value?.trim()||''}function generate(d){let type=val(d,'type')||'program',title=val(d,'title'),duration=val(d,'duration')||'',beneficiary=val(d,'beneficiary')||'',count=Number(val(d,'count')||0),actual=val(d,'actualWork'),impact=val(d,'impactEvidence'),tp=topic(title),target=count?beneficiary+' وعددهم '+count:beneficiary;let s=[];if(!title){alert('اكتب العنوان أولًا');return}if(type==='program'){let obj=[],impl=[];if(tp==='writing'){obj=['تحسين جودة الكتابة لدى الطلاب من حيث وضوح الخط وتنظيمه ودقته.','تدريب الطلاب على ممارسة الكتابة بصورة منظمة ومتدرجة.','تعزيز الممارسة المستمرة ومتابعة تقدم الطلاب في المهارة المستهدفة.'];impl=actual?[actual,'تم توجيه الطلاب أثناء التطبيق إلى جوانب التحسين المرتبطة بالكتابة.','رُوعي تنويع الممارسة بما يتناسب مع مستوى الطلاب واحتياجاتهم.']:['نُفذت تدريبات تطبيقية على مهارات الكتابة المناسبة للفئة المستهدفة.','مارس الطلاب نماذج كتابية متنوعة مع توجيههم إلى جوانب التحسين.','تمت متابعة الأداء أثناء التطبيق وتقديم ملاحظات تساعد على تطوير الكتابة.']}else if(tp==='reading'){obj=['تنمية المهارات القرائية المستهدفة لدى الطلاب.','رفع مستوى الممارسة المنظمة للقراءة والفهم.','متابعة تقدم الطلاب وتحديد الاحتياجات التي تتطلب دعمًا إضافيًا.'];impl=actual?[actual,'تم توجيه الطلاب أثناء الأنشطة القرائية ومتابعة استجاباتهم.','رُوعي تقديم ممارسة مناسبة لمستويات الطلاب.']:['نُفذت أنشطة قرائية تطبيقية مرتبطة بالمهارة المستهدفة.','أتيح للطلاب التدريب والمشاركة وفق خطوات منظمة.','تمت متابعة الاستجابات وتقديم توجيه يساعد على تحسين الأداء.']}else if(tp==='discipline'){obj=['تعزيز السلوك الإيجابي والانضباط المدرسي لدى الفئة المستهدفة.','رفع الوعي بالقواعد والإجراءات المنظمة للسلوك والمواظبة.','دعم الاستمرارية في المتابعة وتعزيز الممارسات الإيجابية.'];impl=actual?[actual,'تم توضيح السلوكيات المستهدفة والإجراءات المرتبطة بها.','تمت متابعة التنفيذ وتوثيق ما يلزم من ملاحظات.']:['نُفذت أنشطة وإجراءات توعوية وتطبيقية مرتبطة بالانضباط والسلوك.','تم توضيح التوقعات والإجراءات للفئة المستهدفة.','تمت متابعة التنفيذ وتسجيل الملاحظات اللازمة للمتابعة.']}else if(tp==='national'){obj=['تعزيز الاعتزاز بالهوية الوطنية والقيم المرتبطة بالمناسبة.','تنمية وعي الطلاب بالمضامين الوطنية بصورة تربوية.','إتاحة فرص مشاركة مناسبة تعزز الانتماء والمسؤولية.'];impl=actual?[actual,'تم ربط الأنشطة بالمضامين والقيم الوطنية المناسبة.','تم توثيق التنفيذ والشواهد المرتبطة بالمشاركة.']:['نُفذت أنشطة تربوية مرتبطة بالمناسبة الوطنية ومضامينها.','شارك المستفيدون في ممارسات مناسبة تعزز الفهم والانتماء.','تم توثيق التنفيذ والشواهد المرتبطة بالفعالية.']}else{obj=['تحقيق هدف «'+title+'» بما يتناسب مع احتياج المدرسة والفئة المستهدفة.','تنظيم تنفيذ البرنامج بصورة واضحة وقابلة للمتابعة.','توثيق الأنشطة والشواهد المرتبطة بالتنفيذ دون افتراض نتائج غير مقاسة.'];impl=actual?[actual,'تم تنظيم التنفيذ خلال مدة «'+duration+'» بما يتناسب مع طبيعة البرنامج.','تم توثيق الخطوات والشواهد المرتبطة بالتنفيذ.']:['تم تنفيذ أنشطة مرتبطة بموضوع «'+title+'» وفق خطوات منظمة.','رُوعي ارتباط التنفيذ بالفئة المستهدفة وطبيعة الهدف.','تم توثيق الخطوات والشواهد المتاحة للاستفادة منها في المتابعة.']}let follow=impact?[impact,'تُراجع نتائج القياس لتحديد جوانب القوة والجوانب التي تحتاج إلى دعم.','تُبنى الخطوات اللاحقة على ما يظهر من نتائج فعلية.']:['لم يُدخل قياس أثر فعلي في النموذج؛ لذلك لا يفترض التقرير تحقق تحسن أو نتيجة.','يُقاس الأثر من خلال أداة مناسبة لطبيعة البرنامج مثل مقارنة قبل/بعد أو ملاحظة منظمة أو منتج تعلم.','تُوثق النتائج الفعلية لاحقًا ويُبنى عليها الدعم أو الإثراء.'];s=[['الأهداف',lines(obj)],['التنفيذ',lines(impl)],['قياس الأثر والمتابعة',lines(follow)],['التوصيات',lines(['استمرار الممارسة أو المتابعة وفق الحاجة الفعلية.','الاحتفاظ بالشواهد التي توضح التنفيذ والتقدم عند توفره.','تحديث التقرير عند توفر نتائج فعلية بدل الاعتماد على الانطباعات العامة.'])]]}else if(type==='meeting'){s=[['الغرض من الاجتماع',lines(['مناقشة موضوع «'+title+'» وتحديد ما يتطلبه من قرارات أو إجراءات.','توحيد الفهم بين الحضور حول الأولويات والمسؤوليات.','تهيئة متابعة واضحة لما يتم الاتفاق عليه.'])],['المناقشات',lines(actual?[actual,'تمت مناقشة الملاحظات والخيارات ذات العلاقة بالموضوع.','رُوعي تحديد النقاط التي تحتاج قرارًا أو متابعة.']:['تم استعراض واقع الموضوع والملاحظات ذات العلاقة.','ناقش الحضور الأسباب والخيارات والحلول الممكنة.','تم تحديد النقاط التي تحتاج إلى قرار أو متابعة.'])],['القرارات والمسؤوليات',lines(['تُسجل القرارات الفعلية المتفق عليها في هذا القسم بعد اعتمادها.','يُحدد المسؤول عن كل إجراء والمدة الزمنية المناسبة للتنفيذ.','تُتابع القرارات في اجتماع لاحق أو من خلال تقرير متابعة.'])]]}else if(type==='plan'){s=[['مبررات الخطة والهدف العام',lines(['أُعدت الخطة لمعالجة أو تطوير جانب مرتبط بموضوع «'+title+'».','تنظيم العمل ضمن مدة «'+duration+'» وربطه بنتائج يمكن متابعتها.','تحديد المسؤوليات والإجراءات بصورة واضحة وقابلة للتنفيذ.'])],['الأهداف والإجراءات',lines(actual?[actual,'توزع الإجراءات على مراحل ومسؤوليات محددة.','يرتبط كل إجراء بمؤشر متابعة أو شاهد مناسب.']:['تُحدد أهداف تنفيذية قابلة للمتابعة مرتبطة بموضوع الخطة.','تُبنى الإجراءات وفق الأولويات والإمكانات المتاحة.','يرتبط كل إجراء بمسؤول ومدة وشاهد أو مؤشر متابعة.'])],['مؤشرات النجاح والمتابعة',lines(impact?[impact,'تُراجع النتائج دوريًا ويُعدل المسار عند الحاجة.','تُوثق المتابعة من خلال تقارير أو مؤشرات أداء فعلية.']:['تُحدد مؤشرات نجاح قابلة للقياس قبل بدء التنفيذ.','تُراجع نسبة الإنجاز والشواهد بصورة دورية.','تُحدث الخطة استنادًا إلى النتائج الفعلية والمعوقات.'])]]}else if(type==='training'){s=[['الاحتياج والأهداف',lines(['يرتبط «'+title+'» باحتياج مهني يستهدف رفع جودة الممارسة.','تنمية المعارف والمهارات المرتبطة بالموضوع لدى '+target+'.','ربط التطوير المهني بالتطبيق داخل بيئة العمل.'])],['التنفيذ',lines(actual?[actual,'تضمن التنفيذ عرضًا ومناقشة وتطبيقات مرتبطة بالموضوع.','تم توثيق الحضور والمادة أو الشواهد المتاحة.']:['نُفذت محاور تدريبية مرتبطة بموضوع «'+title+'».','تضمن التنفيذ أمثلة أو ممارسات تطبيقية بحسب طبيعة الموضوع.','تم توثيق الحضور والمادة أو الشواهد المتاحة.'])],['قياس الأثر',lines(impact?[impact,'تُقارن نتائج القياس بالممارسة السابقة لتحديد التطور الفعلي.','تُستخدم النتائج لتحديد احتياج المتابعة أو التدريب اللاحق.']:['لا يفترض التقرير تحقق أثر مهني دون قياس.','يُقاس الأثر من خلال تطبيقات ميدانية أو ملاحظة أو استبانة أو مقارنة أداء.','تُوثق نتائج القياس عند توفرها وتُبنى عليها المتابعة.'])]]}else if(type==='analysis'){s=[['مصدر البيانات ونطاق التحليل',lines(['يتناول التحليل موضوع «'+title+'» اعتمادًا على البيانات أو النتائج المتاحة.','يُحدد نطاق التحليل والفئة والفترة الزمنية بوضوح.','لا تُثبت أي نتيجة إلا إذا كانت مدعومة ببيانات فعلية.'])],['النتائج والفجوات',lines(actual?[actual,'تُصنف النتائج إلى جوانب قوة وفجوات ذات أولوية.','تُربط الفجوات بالبيانات الفعلية دون تعميم غير مدعوم.']:['تُدخل النتائج الرقمية أو الوصفية الفعلية في هذا القسم.','تُحدد جوانب القوة والفجوات بناءً على البيانات.','تُرتب الفجوات وفق الأولوية وحجم الأثر.'])],['الإجراءات والمتابعة',lines(impact?[impact,'تُنفذ الإجراءات العلاجية أو الإثرائية بناءً على الفجوات الفعلية.','تُعاد قراءة البيانات لاحقًا للتحقق من التقدم.']:['تُبنى إجراءات علاجية أو إثرائية مناسبة لكل فجوة.','يُحدد مسؤول ومدة ومؤشر متابعة لكل إجراء.','تُعاد قراءة النتائج بعد التنفيذ للتحقق من التقدم الفعلي.'])]]}else if(type==='lesson'){s=[['الهدف التعليمي والاستراتيجية',lines(['تحديد ناتج التعلم المستهدف من ممارسة «'+title+'».','اختيار استراتيجية تدريس مناسبة لطبيعة المحتوى واحتياجات الطلاب.','تحديد طريقة تقويم تكشف مستوى تحقق التعلم.'])],['التنفيذ والتقويم',lines(actual?[actual,'تمت متابعة استجابات الطلاب أثناء التنفيذ باستخدام أداة مناسبة.','تم تقديم توجيه أو تغذية راجعة وفق ما ظهر من استجابات.']:['نُفذت الممارسة وفق تهيئة وعرض وتطبيق مناسب للمحتوى.','استخدمت أساليب لمتابعة الفهم أثناء التنفيذ.','يُسجل هنا ما ظهر فعليًا من استجابات الطلاب وأدلة التعلم.'])],['التحسين',lines(impact?[impact,'تُستخدم نتائج التقويم لتحديد الدعم والإثراء.','تُعدل الممارسة في ضوء النتائج الفعلية.']:['لا يفترض التقرير نجاح الممارسة دون دليل تعلم.','تُستخدم نتائج التقويم لتحديد من يحتاج دعمًا أو إثراءً.','تُطور الممارسة في ضوء ما يظهر من نتائج فعلية.'])]]}else if(type==='partnership'){s=[['الهدف والأدوار',lines(['تحديد هدف الشراكة المرتبط بموضوع «'+title+'».','توضيح دور المدرسة ودور الطرف الشريك بصورة محددة.','ربط الشراكة باحتياج أو قيمة مضافة قابلة للمتابعة.'])],['التنفيذ',lines(actual?[actual,'تم توثيق أدوار الأطراف والشواهد المرتبطة بالتنفيذ.','يُسجل ما تم تقديمه فعليًا للمستفيدين دون مبالغة في النتائج.']:['تُنفذ الأنشطة المتفق عليها وفق توزيع واضح للأدوار.','تُوثق المراسلات أو الاتفاقيات أو الصور أو التقارير ذات العلاقة.','يُسجل ما تم تقديمه فعليًا للمستفيدين.'])],['الأثر والاستدامة',lines(impact?[impact,'تُراجع القيمة المضافة للشراكة بناءً على نتائ
