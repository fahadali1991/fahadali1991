<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرك المدرسة V6.1</title><style>html,body{margin:0;height:100%;background:#f5f7f8}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="v6" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v6-indicators-safe.html"></iframe><script>(function(){'use strict';var outer=document.getElementById('v6');function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function getDoc(id){return new Promise(function(resolve,reject){var r=indexedDB.open('schoolDocsV53Print',1);r.onsuccess=function(){var db=r.result;if(!db.objectStoreNames.contains('docs'))return reject(new Error('الأرشيف غير موجود'));var q=db.transaction('docs').objectStore('docs').get(id);q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}};r.onerror=function(){reject(r.error)}})}function filesToData(files){return Promise.all((files||[]).filter(function(f){return f.type&&f.type.indexOf('image/')===0}).map(function(f){return new Promise(function(resolve){var fr=new FileReader();fr.onload=function(){resolve({name:f.name||'صورة',src:fr.result})};fr.onerror=function(){resolve(null)};fr.readAsDataURL(f)})})).then(function(a){return a.filter(Boolean)})}function writePrint(win,d,imgs){var secs=(d.sections||[]).map(function(s){return '<section class="sec"><h3>'+esc(s.title)+'</h3><div>'+esc(s.body).split('\n').join('<br>')+'</div></section>'}).join('');var pics=imgs.length?'<div class="appendix"><h2>الشواهد المصورة</h2><div class="imgGrid">'+imgs.map(function(i){return '<figure><img src="'+i.src+'"><figcaption>'+esc(i.name)+'</figcaption></figure>'}).join('')+'</div></div>':'';win.document.open();win.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(d.title||'وثيقة')+'</title><style>@page{size:A4;margin:9mm}*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;color:#17202a;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar{height:6px;background:linear-gradient(90deg,#07A869,#3D7EB9,#0DA9A6,#15445A,#C1B48A);margin-bottom:7px}.head{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:center;border-bottom:2px solid #15445A;padding-bottom:8px}.center{text-align:center}.left{text-align:left}.moe{font-size:13px;font-weight:700;color:#15445A}.school{font-size:17px;font-weight:800;color:#07A869}.sub{font-size:9px;color:#68707a}.title{background:#eef6f8;border:1px solid #d6e4ea;border-radius:9px;padding:7px 9px;margin:8px 0;font-size:15px;font-weight:800;color:#15445A}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}.meta div{border:1px solid #dfe5e8;border-radius:7px;padding:5px 6px;font-size:9.8px}.sec{border:1px solid #dfe5e8;border-right:4px solid #07A869;border-radius:8px;padding:7px 9px;margin:5px 0;break-inside:avoid-page}.sec h3{margin:0 0 4px;font-size:12px;color:#15445A}.sec div{font-size:10.8px;line-height:1.55}.appendix{margin-top:8px}.appendix h2{font-size:13px;color:#15445A;border-bottom:1px solid #dfe5e8;padding-bottom:4px}.imgGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}figure{margin:0;border:1px solid #dfe5e8;border-radius:8px;padding:5px;break-inside:avoid}figure img{width:100%;height:145px;object-fit:contain;border-radius:5px}figcaption{font-size:8px;margin-top:3px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:8px;padding-top:8px;border-top:1px dashed #c8d2d8;font-size:10px}</style></head><body><div class="bar"></div><div class="head"><div><div class="moe">وزارة التعليم</div><div class="sub">المملكة العربية السعودية</div></div><div class="center"><div class="school">'+esc(d.schoolName||'اسم المدرسة')+'</div><div class="sub">'+esc(d.eduOffice||'إدارة التعليم')+'</div></div><div class="left"><div class="moe">التوثيق المدرسي</div><div class="sub">نسخة مهيأة للطباعة</div></div></div><div class="title">'+esc(d.title||'وثيقة')+'</div><div class="meta"><div><b>التاريخ:</b> '+esc(d.date||'-')+'</div><div><b>المدة:</b> '+esc(d.duration||'-')+'</div><div><b>المستفيد:</b> '+esc(d.beneficiary||'-')+'</div><div><b>العدد:</b> '+(d.count||0)+'</div><div><b>المسؤول:</b> '+esc(d.owner||'-')+'</div><div><b>إعداد:</b> '+esc(d.preparedBy||'-')+'</div><div><b>المدير:</b> '+esc(d.principalName||'-')+'</div><div><b>المرفقات:</b> '+((d.files||[]).length)+'</div></div>'+secs+pics+'<div class="sign"><div><b>إعداد الوثيقة</b><br>'+esc(d.preparedBy||'........................')+'</div><div><b>اعتماد مدير المدرسة</b><br>'+esc(d.principalName||'........................')+'</div></div><script>window.onload=function(){setTimeout(function(){window.print()},250)}<\/script></body></html>');win.document.close()}function doPrint(id,win){getDoc(id).then(function(d){if(!d)throw new Error('لم يتم العثور على التقرير');return filesToData(d.files).then(function(imgs){writePrint(win,d,imgs)})}).catch(function(err){win.document.body.innerHTML='<div dir="rtl" style="font-family:Arial,Tahoma,sans-serif;padding:30px"><h3>تعذر تجهيز الطباعة</h3><p>'+esc(err.message||err)+'</p></div>'})}function hookInner(){try{var v6doc=outer.contentDocument;if(!v6doc)return;var inner=v6doc.getElementById('app');if(!inner)return;function bind(){try{var doc=inner.contentDocument;if(!doc)return;doc.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button[onclick*="printDoc"]');if(!b)return;var m=(b.getAttribute('onclick')||'').match(/printDoc\(['\"]([^'\"]+)['\"]\)/);if(!m)return;e.preventDefault();e.stopImmediatePropagation();var w=window.open('','_blank');if(!w){alert('Safari منع نافذة الطباعة. اسمح بالنوافذ المنبثقة لهذا الموقع مرة واحدة.');return}w.document.write('<div dir="rtl" style="font-family:Arial,Tahoma,sans-serif;padding:30px">جاري تجهيز الطباعة…</div>');doPrint(m[1],w)},true)}catch(err){console.error(err)}}inner.addEventListener('load',bind);bind()}catch(err){console.error(err)}}outer.addEventListener('load',function(){setTimeout(hookInner,500)});setTimeout(hookInner,1500)})();</script></body></html>
