const PATCH="(()=>{\n'use strict';\nlet editingIdV72=null, editingOriginalV72=null;\nconst GRADE_SETS_V72={elementary:['الصف الأول الابتدائي','الصف الثاني الابتدائي','الصف الثالث الابتدائي','الصف الرابع الابتدائي','الصف الخامس الابتدائي','الصف السادس الابتدائي'],middle:['الصف الأول المتوسط','الصف الثاني المتوسط','الصف الثالث المتوسط'],secondary:['الصف الأول الثانوي','الصف الثاني الثانوي','الصف الثالث الثانوي']};\nconst STAGE_COMBOS_V72={elementary:['elementary'],middle:['middle'],secondary:['secondary'],elementary_middle:['elementary','middle'],middle_secondary:['middle','secondary']};\nconst settingsGrid=document.querySelector('#settings .settings');\nif(settingsGrid&&!document.getElementById('schoolStages')) settingsGrid.insertAdjacentHTML('beforeend','<div class=\"field full\"><label>المراحل الموجودة في المدرسة</label><select id=\"schoolStages\"><option value=\"elementary\">ابتدائي</option><option value=\"middle\">متوسط</option><option value=\"secondary\">ثانوي</option><option value=\"elementary_middle\">ابتدائي ومتوسط</option><option value=\"middle_secondary\">متوسط وثانوي</option></select><div class=\"subtypeHint\">يحدد هذا الخيار الصفوف التي تظهر في نموذج التوثيق فقط، حتى لا تظهر قائمة طويلة غير لازمة.</div></div>');\nconst countField=document.getElementById('count')?.closest('.field');\nif(countField&&!document.getElementById('grade')) countField.insertAdjacentHTML('afterend','<div class=\"field\"><label>الصف <span class=\"muted\">(اختياري)</span></label><select id=\"grade\"><option value=\"\">بدون تحديد</option></select></div>');\nconst stageEl=document.getElementById('schoolStages'),gradeEl=document.getElementById('grade');\nfunction currentSettingsV72(){let s={};try{s=JSON.parse(localStorage.getItem('school_settings')||'{}')}catch(e){}return s}\nfunction renderGradesV72(selected=''){const stage=stageEl?.value||'middle',keys=STAGE_COMBOS_V72[stage]||['middle'],vals=keys.flatMap(k=>GRADE_SETS_V72[k]||[]),extra=selected&&!vals.includes(selected)?[selected]:[] ludes(b.dataset.v))b.classList.add('on')})})}\nfunction setSelectV72(id,value){const el=document.getElementById(id);if(el&&[...el.options].some(o=>o.value===String(value??'')))el.value=String(value??'')}\nfunction editDocV72(id){const d=docs.find(x=>x.id===id);if(!d)return;editingIdV72=d.id;editingOriginalV72=d;document.getElementById('form').reset();pending=[...(d.files||[])];renderPendingV72();const type=TYPES[d.type]?d.type:'program';document.getElementById('type').value=type;renderSubtypes(d.subtype);renderSmart();renderGradesV72(d.grade||'');document.getElementById('title').value=d.title||'';document.getElementById('date').value=d.date||new Date().toISOString().slice(0,10);setSelectV72('duration',d.duration);setSelectV72('beneficiary',d.beneficiary);document.getElementById('count').value=Number(d.count||0);document.getElementById('owner').value=d.owner||'';applySmartV72(d.smartSelections);if(d.sections&&d.sections.length)renderSections(d.sections.map(x=>[x.title||'قسم',x.body||'']));else{document.getElementById('sections').innerHTML='';document.getElementById('generated').classList.remove('active')}document.getElementById('formTitle').textContent='تعديل '+(TYPES[type]?.label||'التوثيق');document.getElementById('formSub').textContent='يمكنك تعديل السجل القديم أو الجديد ثم حفظه في نفس مكانه.';if(!document.getElementById('formDialog').open)document.getElementById('formDialog').showModal()}\ndocument.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();if(!document.getElementById('generated').classList.contains('active')){const s=build();if(!s.length)return;renderSections(s)}if(!db){alert('تعذر فتح قاعدة البيانات. أعد تحميل الصفحة.');return}const st=getSettings(),now=new Date().toISOString(),base=editingOriginalV72||{},d={...base,id:editingIdV72||crypto.randomUUID(),type:document.getElementById('type').value,subtype:document.getElementById('subtype').value,subtypeLabel:subtypeLabel(),title:fix(document.getElementById('title').value),date:document.getElementById('date').value,duration:document.getElementById('duration').value,beneficiary:document.getElementById('beneficiary').value,count:Number(document.getElementById('count').value||0),grade:gradeEl?.value||'',owner:fix(document.getElementById('owner').value),sections:getSections(),files:pending,smartSelections:selections(),schoolName:st.schoolName||'',eduOffice:st.eduOffice||'',principalName:st.principalName||'',preparedBy:st.preparedBy||'',created:base.created||now,updated:now};await put(d);editingIdV72=null;editingOriginalV72=null;document.getElementById('formDialog').close();await render();nav('archive')},true);\ncard=function(d){const type=TYPES[d.type]||{label:'توثيق'};return`<div class=\"doc\"><div class=\"row\"><div><span class=\"tag\">${esc(type.label)}</span>${d.subtypeLabel?`<span class=\"tag\">${esc(d.subtypeLabel)}</span>`:''}${d.grade?`<span class=\"tag\">${esc(d.grade)}</span>`:''}<h3 style=\"margin:7px 0 4px\">${esc(d.title)}</h3><div class=\"muted\">${esc(d.date||'')} · ${esc(d.duration||'')} · ${esc(d.owner||'')}</div></div><div style=\"display:flex;gap:7px;flex-wrap:wrap\"><button class=\"ghost\" data-open-id=\"${esc(d.id)}\">فتح</button><button class=\"primary\" data-edit-id=\"${esc(d.id)}\">تعديل</button></div></div></div>`};\nbindOpenButtons=function(){document.querySelectorAll('[data-open-id]').forEach(b=>b.addEventListener('click',()=>viewDoc(b.dataset.openId)));document.querySelectorAll('[data-edit-id]').forEach(b=>b.addEventListener('click',()=>editDocV72(b.dataset.editId)))};\nconst viewDocV71=viewDoc;viewDoc=function(id){viewDocV71(id);const d=docs.find(x=>x.id===id);if(d?.grade){const meta=document.querySelector('#viewBody .doc');if(meta&&!meta.textContent.includes('الصف:'))meta.insertAdjacentHTML('beforeend',`<span class=\"tag\">الصف: ${esc(d.grade)}</span>`)}};\nsetTimeout(()=>{try{renderGradesV72();render()}catch(e){}},150);\n})();";
const base=document.getElementById('base'),loading=document.getElementById('loading');let done=false;function apply(){if(done)return;try{const w=base.contentWindow,d=base.contentDocument;if(!w||!d||!d.getElementById('quick'))throw new Error('not ready');w.eval(PATCH);done=true;loading.style.display='none'}catch(e){setTimeout(apply,180)}}base.addEventListener('load',()=>setTimeout(apply,120));setTimeout(apply,1200);
