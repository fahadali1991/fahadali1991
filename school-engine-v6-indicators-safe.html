){.row{align-items:flex-start;flex-direction:column}.fab{left:10px;bottom:12px}}</style></head><body><iframe id="app" src="https://htmlpreview.github.io/?https://github.com/fahadali1991/fahadali1991/blob/main/school-engine-v5-3-moe-print.html"></iframe><button class="fab" id="open">🧭 المؤشرات والجاهزية</button><div class="ov" id="ov"><div class="panel"><div class="head"><div><b>مركز المؤشرات الذكي</b><div class="muted">يقرأ نفس أرشيف V5.3 بدون تغيير التطبيق الأساسي</div></div><button class="btn" id="close">✕</button></div><div class="body"><div class="nav"><button data-tab="docs">تقاريري</button><button data-tab="ready">الجاهزية</button><button data-tab="inds">52 مؤشرًا</button></div><div id="docs"></div><div id="ready" class="hidden"></div><div id="inds" class="hidden"><input id="q" type="search" placeholder="ابحث بالرمز أو النص أو المجال"><div id="indList"></div></div></div></div></div><script>const D={1:'الإدارة المدرسية',2:'التعليم والتعلم',3:'نواتج التعلم',4:'البيئة المدرسية'},S={'1-1':'التخطيط','1-2':'قيادة العملية التعليمية','1-3':'المجتمع المدرسي','1-4':'التطوير المؤسسي','1-5':'حقوق المتعلم وحمايته','2-1':'بناء خبرات التعلم','2-2':'تقويم التعلم','3-1':'التحصيل التعليمي','3-2':'التطور الشخصي والصحي والاجتماعي','4-1':'المبنى المدرسي','4-2':'الأمن والسلامة'};const I='1-1-1-1|تضع المدرسة خطة تشغيلية شاملة وفق أهداف تطويرية محددة.\n1-1-1-2|تتابع المدرسة تنفيذ خطتها التشغيلية وتطورها بما يضمن تحقيق أهدافها.\n1-2-1-1|تعزز المدرسة القيم الإسلامية والهوية الوطنية.\n1-2-1-2|تطبق المدرسة قيم مهنة التعليم وأخلاقياتها، وتتابع الالتزام بها.\n1-2-1-3|تطبق المدرسة إجراءات محددة لدعم الانضباط المدرسي، وتتابع الالتزام بها.\n1-2-1-4|تنفذ المدرسة برامج وأنشطة تربوية داعمة للسلوك الإيجابي لدى المتعلمين، ومنهم ذوو الإعاقة والموهوبون، وتتابعها.\n1-2-1-5|تنفذ المدرسة برامج وأنشطة إثرائية لتطوير مواهب المتعلمين وتهيئهم للمستقبل، وتتابعها.\n1-3-1-1|تعزز المدرسة بناء العلاقات الإيجابية والتعاون في المجتمع المدرسي.\n1-3-1-2|تعزز المدرسة مشاركة الأسرة في تعلم أبنائهم والتحضير لمستقبلهم.\n1-3-1-3|تعزز المدرسة الشراكة المجتمعية لدعم التعلم والتأثير الإيجابي في المجتمع.\n1-4-1-1|توفر المدرسة كادرًا تعليميًا مكتملًا ومؤهلًا بما يتسق مع المهام الموكلة له.|private\n1-4-1-2|توفر المدرسة كادرًا إداريًا مكتملًا ومؤهلًا بما يتسق مع المهام الموكلة له.|private\n1-4-1-3|تظهر المدرسة الملاءة والاستدامة المالية.|private\n1-4-1-4|تدعم المدرسة منسوبيها للحصول على الرخصة المهنية، وتتابعها.\n1-4-1-5|تدعم المدرسة التطوير المهني لمنسوبيها وفقًا لنتائج التقويم وتحليل احتياجاتهم.\n1-4-1-6|تطبق المدرسة التقويم الذاتي المبني على المعايير المعتمدة من الهيئة بشكل مستمر.\n1-4-1-7|تنفذ المدرسة خطة التحسين بناء على نتائج التقويم المدرسي، وتتابعها.\n1-5-1-1|تلتزم المدرسة بالمحافظة على حقوق المتعلمين وحمايتهم.\n1-5-1-2|توفر المدرسة مناخًا آمنًا للتعلم والنمو نفسيًا واجتماعيًا.\n2-1-1-1|توفر المدرسة فرصًا متكافئة للتعلم تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.\n2-1-1-2|تدعم المدرسة تنفيذ المناهج بما يحقق نواتج التعلم المستهدفة.\n2-1-1-3|تنوع المدرسة في استراتيجيات التعليم والتعلم لتلبية احتياجات المتعلمين ودعم تعلمهم.\n2-1-1-4|تفعل المدرسة التقنية الرقمية لدعم تعلم المتعلمين وتلبية احتياجاتهم.\n2-1-1-5|تنفذ المدرسة أنشطة تعلم تطبيقية ترتبط بحياة المتعلمين.\n2-1-1-6|تنمي المدرسة المهارات القرائية والعددية الأساسية لدى المتعلمين.\n2-1-1-7|تنمي المدرسة مهارات التفكير والبحث والابتكار لدى المتعلمين.\n2-1-1-8|تنمي المدرسة المهارات العاطفية والاجتماعية لدى المتعلمين.\n2-1-1-9|تعزز المدرسة دافعية المتعلمين للتعلم والاستمتاع به.\n2-2-1-1|تطبق المدرسة أساليب وأدوات تقويم متنوعة للكشف عن مستويات أداء المتعلمين المختلفة.\n2-2-1-2|تطبق المدرسة أساليب وأدوات متنوعة لتقويم نواتج التعلم المستهدفة في مناهج التعليم.\n2-2-1-3|تحلل المدرسة نتائج التقويم وتوظفها في تحسين عمليات التعليم والتعلم والتقويم.\n2-2-1-4|تقدم المدرسة التغذية الراجعة للمتعلمين وأولياء أمورهم، وتتابع تقدمهم بشكل مستمر.\n3-1-1-1|يحقق المتعلمون نتائج مرتفعة في مجال القراءة وفقًا للاختبارات الوطنية.\n3-1-1-2|يحقق المتعلمون نتائج مرتفعة في مجال الرياضيات وفقًا للاختبارات الوطنية.\n3-1-1-3|يحقق المتعلمون نتائج مرتفعة في مجال العلوم وفقًا للاختبارات الوطنية.\n3-1-1-4|يحقق المتعلمون تقدمًا في مجال القراءة قياسًا على مستوى أداء المدرسة السابق في الاختبارات الوطنية.\n3-1-1-5|يحقق المتعلمون تقدمًا في مجال الرياضيات قياسًا على مستوى أداء المدرسة السابق في الاختبارات الوطنية.\n3-1-1-6|يحقق المتعلمون تقدمًا في مجال العلوم قياسًا على مستوى أداء المدرسة السابق في الاختبارات الوطنية.\n3-2-1-1|يظهر المتعلمون الاعتزاز بالقيم والهوية الوطنية.\n3-2-1-2|يظهر المتعلمون اتجاهات إيجابية نحو ذواتهم والآخرين.\n3-2-1-3|يظهر المتعلمون التزامًا بالممارسات الصحية السليمة.\n3-2-1-4|يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية.\n3-2-1-5|يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.\n3-2-1-6|يظهر المتعلمون الاستقلالية والقدرة على التعلم الذاتي.\n3-2-1-7|يظهر المتعلمون اعتزازًا بثقافتهم واحترامًا للتنوع الثقافي في المجتمع.\n4-1-1-1|توفر المدرسة مبنى تعليميًا يستوفي المواصفات والاشتراطات المعتمدة من حيث النوع والخدمات المساندة.\n4-1-1-2|تنظيم مبنى المدرسة ملائم لعدد المتعلمين وخصائص المرحلة العمرية، ومنهم ذوو الإعاقة.\n4-1-1-3|تتوافر فصول ومعامل ملائمة للعملية التعليمية تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة.\n4-1-1-4|تلبي المرافق والتجهيزات والخدمات المساندة احتياجات المتعلمين، ومنهم ذوو الإعاقة.\n4-2-1-1|تتوافر في مبنى المدرسة ومرافقها جميع متطلبات الأمن والسلامة.\n4-2-1-2|تتابع المدرسة صيانة المبنى وجميع مرافقه وتجهيزاته بشكل دوري.\n4-2-1-3|تتابع المدرسة نظافة المبنى المدرسي وجميع مرافقه بشكل مستمر.'.split('\n').map(x=>{let a=x.split('|'),c=a[0];return{code:c,text:a[1],scope:a[2]||'all',domain:+c[0],standard:S[c.slice(0,3)]}});const R=[[['خطة تشغيلية','تشغيلية'],['1-1-1-1','1-1-1-2'],'تخطيط تشغيلي ومتابعة تنفيذ'],[['انضباط','سلوك','غياب','تأخر','مواظبة'],['1-2-1-3','1-2-1-4','3-2-1-5'],'انضباط وسلوك إيجابي'],[['وطني','الوطن','هوية','قيم'],['1-2-1-1','3-2-1-1'],'قيم وهوية وطنية'],[['موهبة','موهوب','إثرائي'],['1-2-1-5','2-1-1-1'],'إثراء ومواهب'],[['أسرة','أولياء','ولي الأمر'],['1-3-1-2','2-2-1-4'],'مشاركة الأسرة'],[['شراكة','تطوع','مجتمع'],['1-3-1-3','3-2-1-4'],'شراكة مجتمعية'],[['تطوير مهن لوثيقة يمكن أن يدعم المؤشر إذا كانت الشواهد مناسبة')});let add=(c,w,r)=>{sc[c]=(sc[c]||0)+w;(rs[c]||(rs[c]=[])).push(r)};if(flags.includes('impact'))Object.keys(sc).forEach(c=>sc[c]++);if(flags.includes('family')){add('1-3-1-2',3,'تم تأكيد مشاركة الأسرة');add('2-2-1-4',2,'تواصل ومتابعة مع الأسرة')}if(flags.includes('community')){add('1-3-1-3',3,'تم تأكيد المشاركة المجتمعية');add('3-2-1-4',3,'مشاركة مجتمعية/تطوعية')}if(flags.includes('tech'))add('2-1-1-4',3,'تم تأكيد استخدام التقنية');if(flags.includes('assessment')){add('2-2-1-1',3,'تم تأكيد استخدام أداة تقويم');add('2-2-1-2',2,'تقويم نواتج تعلم')}if(flags.includes('feedback'))add('2-2-1-4',3,'تم تأكيد التغذية الراجعة');if(flags.includes('thinking'))add('2-1-1-7',3,'تم تأكيد التفكير/البحث/الابتكار');return Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c,s])=>{let i=I.find(x=>x.code===c);return{code:c,text:i?.text||'',strength:s>=5?'strong':s>=3?'possible':'indirect',reason:[...new Set(rs[c]||[])].join('، ')}}).filter(x=>x.text)}function tags(a){return a.map(i=>`<span class="tag ${i.strength}">${i.code}</span>`).join('')}function covered(){let m=new Map();docs.forEach(d=>analyze(d).forEach(i=>{let w=i.strength==='strong'?1:i.strength==='possible'?.6:.3;if(w>(m.get(i.code)||0))m.set(i.code,w)}));return m}function renderDocs(){document.getElementById('docs').innerHTML=docs.length?docs.map(d=>{let a=analyze(d);return`<div class="card"><div class="row"><div><b>${d.title||'بدون عنوان'}</b><div class="muted">${d.date||''} · ${d.type||''}</div><div>${tags(a.slice(0,5))}</div></div><button class="btn primary" data-an="${d.id}">تحليل وتقوية</button></div></div>`}).join(''):'<div class="card">لا توجد تقارير في أرشيف V5.3.</div>'}function renderReady(){let c=covered();document.getElementById('ready').innerHTML='<div class="card muted">الجاهزية هنا توثيقية وليست حكمًا رسميًا على تحقق المؤشر.</div>'+[1,2,3,4].map(d=>{let a=I.filter(i=>i.domain===d&&i.scope!=='private'),s=a.reduce((x,i)=>x+(c.get(i.code)||0),0),r=Math.round(s/a.length*100);return`<div class="card"><div class="row"><b>${D[d]}</b><b>${r}%</b></div><div class="muted">${a.filter(i=>c.has(i.code)).length} من ${a.length} مؤشرًا لديه دعم</div><div class="bar"><i style="width:${r}%"></i></div></div>`}).join('')}function renderInd(){let q=n(document.getElementById('q').value),c=covered();document.getElementById('indList').innerHTML=I.filter(i=>n(i.code+' '+i.text+' '+D[i.domain]+' '+i.standard).includes(q)).map(i=>`<div class="card"><b>${i.code}</b> <span class="tag">${D[i.domain]}</span><span class="tag indirect">${i.standard}</span>${i.scope==='private'?'<span class="tag possible">خاص حسب نوع المدرسة</span>':''}<div>${i.text}</div><div class="muted">${c.has(i.code)?'يوجد دعم توثيقي':'لا يوجد دعم بعد'}</div></div>`).join('')}function dialog(d){let old=document.getElementById('anbox');if(old)old.remove();let box=document.createElement('div');box.id='anbox';box.className='ov';box.style.display='block';box.innerHTML=`<div class="panel" style="max-width:720px"><div class="head"><b>تحليل: ${d.title}</b><button class="btn" id="anclose">✕</button></div><div class="body"><div class="card"><b>أسئلة تقوية</b><div class="checks"><label class="check"><input type="checkbox" class="fq" value="impact"> قياس أثر/قبل وبعد</label><label class="check"><input type="checkbox" class="fq" value="family"> مشاركة الأسرة</label><label class="check"><input type="checkbox" class="fq" value="community"> مشاركة مجتمعية</label><label class="check"><input type="checkbox" class="fq" value="tech"> تقنية رقمية</label><label class="check"><input type="checkbox" class="fq" value="assessment"> أداة تقويم</label><label class="check"><input type="checkbox" class="fq" value="feedback"> تغذية راجعة</label><label class="check"><input type="checkbox" class="fq" value="thinking"> تفكير/بحث/ابتكار</label></div><button class="btn primary" id="rean">إعادة التحليل</button></div><div id="ares"></div><button class="btn primary" id="saveMap">حفظ الربط في التقرير</button></div></div>`;document.body.appendChild(box);let cur=analyze(d);let draw=()=>document.getElementById('ares').innerHTML=cur.map(i=>`<div class="card"><b>${i.code}</b> <span class="tag ${i.strength}">${i.strength==='strong'?'قوي مباشر':i.strength==='possible'?'محتمل يحتاج شاهد':'غير مباشر'}</span><div>${i.text}</div><div class="muted">سبب الربط: ${i.reason}</div></div>`).join('')||'<div class="card">لا يوجد ربط واضح.</div>';draw();document.getElementById('anclose').onclick=()=>box.remove();document.getElementById('rean').onclick=()=>{let f=[...document.querySelectorAll('.fq:checked')].map(x=>x.value);let temp={...d,indicators:null};cur=analyze(temp,f);draw()};document.getElementById('saveMap').onclick=async()=>{d.indicators=cur;d.smartFlags=[...document.querySelectorAll('.fq:checked')].map(x=>x.value);await put(d);docs=await all();drawAll();alert('تم حفظ الربط داخل التقرير')}}function drawAll(){renderDocs();renderReady();renderInd()}document.getElementById('open').onclick=async()=>{document.getElementById('ov').style.display='block';docs=await all();drawAll()};document.getElementById('close').onclick=()=>document.getElementById('ov').style.display='none';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['docs','ready','inds'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='ready')renderReady();if(b.dataset.tab==='inds')renderInd()});document.getElementById('q').oninput=renderInd;document.addEventListener('click',e=>{let b=e.target.closest('[data-an]');if(b){let d=docs.find(x=>x.id===b.dataset.an);if(d)dialog(d)}});openDB().catch(console.error);</script></body></html>
